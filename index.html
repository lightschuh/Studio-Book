ions are repeatable."]}]}, {"id": "compression", "title": "Setting Compression Levels", "desc": "Dialing in the 76-KT (and the dbx alternatives)", "group": "Sound", "blocks": [{"type": "lead", "text": "How to dial in the Klark Teknik 76-KT on a 24&bull;8 channel insert, plus settings for the dbx alternatives. The goal: the compressor does what you want, and the recording stays at the same level as before."}, {"type": "h", "text": "What the knobs do (76-KT)"}, {"type": "ul", "items": ["<b>Input:<\/b> how hard the signal hits the compressor. On an 1176-style unit there is no threshold knob; turning Input up is what makes it compress more.", "<b>Output:<\/b> brings the level back up after compression. This is the knob that keeps the recording at the same volume as bypass.", "<b>Attack:<\/b> how fast it grabs a loud note, about 20 to 800 microseconds. Clockwise is faster. Fast = grabs the drum hit itself; slower = lets the hit through and clamps what follows, which keeps punch.", "<b>Release:<\/b> how long it holds on after the note drops, about 80 to 700 milliseconds. Clockwise is faster. Fast release sounds pumping and aggressive; slow sounds smoother.", "<b>Ratio buttons:<\/b> 4:1 moderate, 8:1 severe, 12:1 mild limiting, 20:1 hard limiting. Pressing all four at once (\"all buttons in\") gives the crushed, exploding sound on drums and room mics.", "<b>Meter:<\/b> shows gain reduction (GR), the amount in dB being turned down. Set the meter switch to GR for all of the steps below. The +4/+8 positions show output level instead."]}, {"type": "h", "text": "Wiring and gain structure"}, {"type": "ul", "items": ["Channel insert jack &rarr; insert Y cable: TRS end into the insert, tip (send) to the 76-KT input, ring (return) from the 76-KT output. The compressor sits after the channel trim and before the EQ and fader, so it's recorded.", "The 76-KT's XLR jacks are balanced, +4 dBu. The Mackie inserts are unbalanced, -2 dBu, a little lower. That's fine: use a TRS-to-dual-XLR insert cable, or the 76-KT's 1/4\" jacks if your unit has them. Expect to run the 76-KT Input a bit higher than you would from a +4 source.", "Set the channel trim first, exactly as in the Gain Staging Guide, with the compressor bypassed. The compressor must never be used to fix a bad trim setting."]}, {"type": "h", "text": "Step by step"}, {"type": "table", "head": ["Step", "What to do", "What you're listening or looking for"], "rows": [["1", "Bypass the 76-KT (or pull the insert). Play the part at full volume and note where the channel meters and Reaper peak.", "This is the level you'll match at the end."], ["2", "Un-bypass. Output at about 12 o'clock, Input low, Attack and Release at 12 o'clock, ratio 4:1, meter on GR.", "The meter needle should sit at 0 with the part playing: no compression yet."], ["3", "Turn Input up slowly while the part plays.", "The needle starts dipping left on loud notes. Stop when it dips to the amount in the table below."], ["4", "Set Attack. Start at 12 o'clock, turn it slower (counter-clockwise) if the drum or pluck loses its snap.", "Transients still cut through; the needle moves right after the hit, not on it."], ["5", "Set Release. Turn it faster (clockwise) until the needle gets back to 0 between notes, then back off a touch.", "The needle breathes with the music and never gets stuck down. Fast on drums, slower on vocals and bass."], ["6", "Flip bypass in and out while adjusting Output.", "Both sound equally loud. The console meters and Reaper peak where they did in step 1."], ["7", "Check the whole band playing together, and check Reaper for clipping.", "If the recording is now too hot, lower Output, not the trim."]]}, {"type": "h", "text": "Starting points"}, {"type": "table", "head": ["Source", "Ratio", "Attack", "Release", "Gain reduction", "Notes"], "rows": [["Lead vocal", "4:1", "Medium (12 o'clock)", "Medium", "3-6 dB on loud lines", "Fast enough to catch peaks, slow enough that quiet words don't jump up. 8:1 for a shouted take."], ["Bass (DI or amp)", "4:1", "Slow (9-10 o'clock)", "Medium-slow", "3-5 dB", "Slow attack keeps the pluck; the compressor evens out note-to-note volume."], ["Room mic (Turner or ch 5/6)", "All buttons in", "Fast (3 o'clock)", "Fast (3-4 o'clock)", "10-20 dB, pinned", "The Tame Impala crush. Blend this under the close drum mics in Reaper."], ["Kick or snare (close mic)", "4:1 or 8:1", "Slow (9 o'clock)", "Fast", "3-6 dB", "Slow attack lets the hit through; fast release pumps. Too fast an attack makes drums sound dull."], ["Drum pair (groups 3-4, if a 2-channel unit)", "4:1", "Medium-slow", "Fast", "4-8 dB", "Link the two channels so the stereo image doesn't wander."], ["Acoustic guitar", "4:1", "Medium", "Medium", "2-4 dB", "Light touch; too much flattens the strumming."], ["Synths through pedals", "4:1 or 8:1", "Fast", "Medium", "3-8 dB", "Tames the spiky peaks from fuzz pedals before the trim."]]}, {"type": "note", "text": "Knob positions are rough: the 76-KT's attack and release scales run backwards from most compressors (clockwise = faster), so go by the meter and your ears."}, {"type": "h", "text": "If you buy the dbx alternative instead (266XS or 1066)"}, {"type": "ul", "items": ["These have a Threshold knob, so Input stays fixed: leave the console insert level alone and turn Threshold down until the gain-reduction meter shows the amount in the table above.", "Ratio knob: 4:1 for vocals, bass and acoustic; 8:1 or higher for drums. OverEasy (soft knee) on for vocals and bass; off (hard knee) for drums.", "Attack and Release: the Auto mode is a fine default for vocals and bass; switch to manual for drums and set them as in the table.", "Output gain: match bypass exactly as in step 6. The gate section: threshold all the way down (off) unless you're using it to cut tom ring; then raise it just until the ring stops between hits.", "Stereo link for the drum pair: press Stereo Couple and use channel 1's controls for both."]}, {"type": "h", "text": "Common mistakes"}, {"type": "ul", "items": ["Needle pinned left all the time: Input is too high or release too slow. The part will sound squashed and small. Back Input off until the needle returns to 0 between phrases (unless you're going for the room-mic crush on purpose).", "Drums sound dull: attack is too fast. Slow it down until the stick hit comes back.", "Everything got louder when you un-bypassed: Output is too high. That's not a better sound, it's just louder. Match bypass before judging.", "Hiss or noise rises between notes: too much gain reduction with a fast release is pumping the noise floor up. Reduce Input, or add the gate (DN514+) on that channel.", "Mix bus: don't put the 76-KT on the main L/R inserts. Reaper's ReaComp or a bus-compressor plugin does that job at mixdown, where you can undo it.", "Hardware compression is printed to the recording. When unsure, use less; you can always add more in Reaper, but you can't take it off."]}]}, {"id": "eq", "title": "EQ Settings, Channel by Channel", "desc": "What each EQ knob does, and a starting point for all 24 channels", "group": "Sound", "blocks": [{"type": "lead", "text": "Starting points for the 24&bull;8's channel EQ, drawn the way the knobs look on the board. Orange = moved from flat. These are places to begin while tracking, not rules; your mics, room and ears decide."}, {"type": "h", "text": "The EQ section on each 24&bull;8 channel, top to bottom"}, {"type": "ul", "items": ["<b>LO CUT button:<\/b> a high-pass filter at 75 Hz, 18 dB per octave. Removes rumble, floor thumps, plosive pops and mic-stand noise below 75 Hz. It works even when EQ IN is off. <b>Use it on<\/b> vocals, toms, guitar amps, trumpet and room mics. <b>Never on<\/b> kick, bass, synths with low notes, or the drum machine: it takes the bottom off them.", "<b>HI knob:<\/b> a 12 kHz shelf, ±15 dB. Everything above about 12 kHz goes up or down together. <b>For:<\/b> air and sparkle on vocals, cymbals and acoustic guitar. <b>Don't:<\/b> boost it on dynamic mics that are already hissy, or on a trumpet; a 15 dB range is there for repair, 1-3 dB is a normal move.", "<b>HI MID knobs:<\/b> three of them. FREQ sweeps the center from 500 Hz to 18 kHz; BANDWIDTH sets how wide the band is, from 3 octaves (wide, gentle) to 1/12 octave (a surgical notch); the gain knob is ±15 dB. This is the presence band: 2-5 kHz is where a vocal or guitar cuts through, and also where things get harsh. <b>Don't:<\/b> boost a narrow band; narrow settings are for cutting problems (a ring, a whistle). Boosts should be wide.", "<b>LO MID knobs:<\/b> FREQ sweeps 45 Hz to 3 kHz and the gain is ±15 dB; the width is fixed at 2 octaves (broad). This is the mud band: 200-500 Hz is where drums get boxy and vocals get chesty. Most useful EQ moves on this console are small cuts here. <b>Don't:<\/b> boost it on more than one or two sources, or the mix turns to soup.", "<b>LO knob:<\/b> an 80 Hz shelf, ±15 dB. Weight and thump. <b>For:<\/b> kick, floor tom, bass. <b>Don't:<\/b> boost it on anything that isn't a bass instrument; low end piles up fast, and the cheap fix is LO CUT on everything that doesn't need lows.", "<b>EQ IN button:<\/b> switches the four EQ bands in or out (LO CUT stays active). Leave it out on any channel set flat, and use it to A/B your EQ: if \"in\" doesn't sound clearly better, set the knobs back to 0."]}, {"type": "h", "text": "Rules that matter more than any setting"}, {"type": "ul", "items": ["Set trim and the compressor first, then EQ. The EQ is before the fader and the group outs and direct outs, so whatever you do here is recorded. Reaper's ReaEQ can do the fine work later with undo; the console EQ is for broad shaping and fixing real problems.", "Cut before you boost. A 3 dB cut at 300 Hz does what a 3 dB boost at 3 kHz does, with less noise and less chance of clipping.", "Find a problem by sweeping: boost the mid gain, turn the FREQ knob slowly until the ugly part jumps out, then turn the gain down to a cut at that spot.", "EQ moves of 1-3 dB are normal. If you need more than 6 dB, move the mic instead: an inch at the amp grille or a few inches on a vocal changes more than any knob.", "Which mic is on the channel matters. A condenser (Worker Bee) has more top and more low rumble: LO CUT on, go easy on HI. Dynamic mics (SM57, SM58, the knockoffs, Peavey) are a bit darker: small presence lifts are fine. The Turner 95D has almost no top or bottom to begin with. Line sources (synths, PV6, Tascam) usually want no EQ at all.", "Stereo pairs (rooms 5-6, Reface 12-13, SH-201 17-18, Tascam 23-24) get identical settings, or the image shifts.", "Listen in context. Solo makes everything sound like it needs more of everything. Decide with the band playing."]}, {"type": "h", "text": "Channels 1-6"}, {"type": "note", "text": "Each strip reads top to bottom like the board: LO CUT and EQ IN buttons, HI shelf, HI MID (frequency, bandwidth, gain), LO MID (frequency, gain), LO shelf. Orange = set away from flat. Pointer straight up = 0 dB or the middle of the sweep."}, {"type": "eq", "rows": [["1", "Kick", false, 0, "4k", 3, "med", "400", -4, 3], ["2", "Snare", false, 2, "5k", 2, "med", "250", -2, 0], ["3", "Rack tom", true, 0, "5k", 2, "med", "500", -3, 2], ["4", "Floor tom", false, 0, "4k", 2, "med", "400", -3, 2], ["5", "Room L", true, 2, "3k", -2, "wide", "300", -3, 0], ["6", "Room R", true, 2, "3k", -2, "wide", "300", -3, 0]]}, {"type": "h", "text": "Channels 7-12"}, {"type": "eq", "rows": [["7", "Bass (DI or amp)", false, 0, "800", 2, "med", "80", 0, 2], ["8", "Magnatone (SM57)", true, 0, "3k", 0, "med", "200", -2, 0], ["9", "Marshall/Orange (SM58-style)", true, 1, "4k", 2, "med", "300", -2, 0], ["10", "Lead vocal (Worker Bee)", true, 2, "3k", 2, "med", "250", -3, 0], ["11", "Wireless (ATW-R3210)", true, 0, "2.5k", 2, "med", "250", -2, 0], ["12", "Reface CS L", false, 0, "1k", 0, "med", "150", 0, 0]]}, {"type": "h", "text": "Channels 13-18"}, {"type": "eq", "rows": [["13", "Reface CS R", false, 0, "1k", 0, "med", "150", 0, 0], ["14", "Trumpet (SM58)", true, -1, "3k", -3, "narrow", "300", 0, 0], ["15", "Vocal 2 (Peavey)", true, 1, "3k", 2, "med", "250", -2, 0], ["16", "Vocal 3 (Turner 95D)", true, 3, "4k", 3, "med", "400", -3, 0], ["17", "SH-201 L", false, 0, "1k", 0, "med", "150", 0, 0], ["18", "SH-201 R", false, 0, "1k", 0, "med", "150", 0, 0]]}, {"type": "h", "text": "Channels 19-24"}, {"type": "eq", "rows": [["19", "PV6 submix L", false, 0, "1k", 0, "med", "150", 0, 0], ["20", "PV6 submix R", false, 0, "1k", 0, "med", "150", 0, 0], ["21", "1970s drum machine", false, 2, "3k", 1, "med", "200", 0, 2], ["22", "Open", false, 0, "1k", 0, "med", "150", 0, 0], ["23", "Tascam 246 L", false, 1, "3k", 0, "med", "150", 0, 0], ["24", "Tascam 246 R", false, 1, "3k", 0, "med", "150", 0, 0]]}, {"type": "h", "text": "Why each channel is set this way"}, {"type": "table", "head": ["Ch", "Source", "Why these settings"], "rows": [["1", "Kick", "Low shelf adds thump; 400 Hz cut removes the cardboard \"box\"; 4 kHz gives the beater click so it cuts through. Keep LO CUT off."], ["2", "Snare", "A little top for crack. If it rings, sweep LO MID until the ring is loudest, then cut 3-4 dB there."], ["3", "Rack tom", "LO CUT on: nothing useful below 75 Hz on a 13\" tom. Cut the boxy 500 Hz, add stick attack at 5 kHz."], ["4", "Floor tom", "Same idea as the rack tom. LO CUT off so the low thump stays. Both toms share groups 3-4, so keep them similar."], ["5", "Room L", "Rooms are about air and smack. Cut the mud at 300 Hz, soften 3 kHz if the cymbals are harsh, LO CUT on (the kick mic already has the lows)."], ["6", "Room R", "Match channel 5 exactly, or the stereo picture shifts."], ["7", "Bass (DI or amp)", "Gentle: a touch of low shelf for weight, a little 800 Hz so it's audible on small speakers. No LO CUT ever on bass."], ["8", "Magnatone (SM57)", "SM57 on a tube amp needs almost nothing. LO CUT on to drop the rumble a close mic picks up. Cut a little 200 Hz if it's muddy."], ["9", "Marshall/Orange (SM58-style)", "SM58-style mics are a little darker than an SM57 on an amp: a small lift at 4 kHz and the HI shelf brings back the bite."], ["10", "Lead vocal (Worker Bee)", "Condenser: LO CUT on for plosives and rumble, cut the 250 Hz chestiness, a little 3 kHz presence, HI shelf for air. Cut less than you think."], ["11", "Wireless (ATW-R3210)", "Depends on what's plugged into the body pack. Start flat and add presence only if it sounds dull."], ["12", "Reface CS L", "Flat. Synths come out already shaped. EQ IN off until something is actually wrong."], ["13", "Reface CS R", "Match channel 12."], ["14", "Trumpet (SM58)", "Trumpet is naturally bright and loud. Cut 3 kHz a little so it doesn't pierce; LO CUT on. Distance from the mic does more than EQ."], ["15", "Vocal 2 (Peavey)", "Dynamic mic: a bit more presence than the Worker Bee needs, plus LO CUT."], ["16", "Vocal 3 (Turner 95D)", "Vintage mic with a narrow 100 Hz-10 kHz range. Boost the top to open it up, or leave it dark on purpose for the lo-fi vocal sound."], ["17", "SH-201 L", "Flat; EQ on the synth or the pedals instead. Through fuzz pedals, cut 3-5 kHz a little if it's harsh."], ["18", "SH-201 R", "Match channel 17."], ["19", "PV6 submix L", "Monitor only. Flat; adjust on the PV6."], ["20", "PV6 submix R", "Monitor only. Flat."], ["21", "1970s drum machine", "Old drum machines are dull and thin: a little low shelf and top brings them to life. Keep LO CUT off."], ["23", "Tascam 246 L", "Tape loses a little top; a 1 dB HI shelf brings it back. Otherwise flat, so you hear what the tape did."], ["24", "Tascam 246 R", "Match channel 23."]]}]}, {"id": "mics", "title": "Mic Placement", "desc": "Where each mic goes, how far and aimed at what", "group": "Sound", "blocks": [{"type": "lead", "text": "Where each mic goes, how far, and aimed at what, for every mic'd source in the channel map. Distances are starting points; move the mic before you reach for EQ. Room dimensions aren't needed for most of this, since placement is about distance from the source. The places where your room sizes would change the advice are marked \"room-dependent\" and listed at the end."}, {"type": "h", "text": "Rules that cover everything"}, {"type": "ul", "items": ["<b>Move the mic, not the EQ.<\/b> An inch at a guitar grille or two inches on a vocal changes more than any knob on the console. Set placement with headphones on and someone playing, then set trim, then EQ.", "<b>Closer = more bass, less room.<\/b> Every directional mic you own (SM57, SM58, the knockoffs, Peavey, Worker Bee in cardioid) gets boomier as it gets closer, called proximity effect. Use it on purpose for warmth; back off when a source gets muddy.", "<b>Aim the mic's back at what you don't want.<\/b> Cardioid mics reject sound from directly behind. Point the back of the snare mic at the hi-hat, the back of the vocal mic at the drum kit, and bleed drops without moving anything else.", "<b>3:1 rule for two mics on one source.<\/b> When two mics can hear the same thing (two tom mics, the room pair, a vocal mic near the acoustic guitar mic), keep them at least three times as far from each other as each is from its source, or their sound combines with hollow phase cancellation.", "<b>Check in mono.<\/b> Press MONO in the console's monitor section with the room pair up. If the drums get thinner or the kick disappears, a mic is out of phase: move it a few inches or flip a cable's polarity.", "<b>Stands and cables.<\/b> Boom arm over the heavy tripod leg so it doesn't tip. One loop of cable around the stand. Never let a mic cable hang from the mic's connector."]}, {"type": "h", "text": "Drums"}, {"type": "table", "head": ["Mic / channel", "Where", "Distance", "Aim", "Notes"], "rows": [["Kick (ch 1)", "Inside the kick through the port hole if the front head has one; otherwise 2-4 in. outside the front head, off-center", "Inside: 3-6 in. from the beater head. Outside: 2-4 in.", "At the beater spot for click; angled toward the shell for more boom", "More click = closer to the beater. Take the pillow out of the drum before you blame the mic. Room-dependent: no."], ["Snare (ch 2)", "Top head, over the rim, between the hi-hat and the first rack tom", "1-2 in. above the rim, pointed at the center", "Capsule aimed at the center of the head, body tilted so its back faces the hi-hat", "If the snare sounds thin, lower the angle; if too much hi-hat, rotate the back of the mic toward it. Stand on the drummer's left."], ["Rack tom (ch 3)", "Over the top rim, away from the cymbal above it", "1-2 in. above the head, at the rim", "At the center of the head", "SM58-style: pull the grille basket off for a closer, punchier position if it's a true 58 clone."], ["Floor tom (ch 4)", "Over the top rim on the side away from the ride", "1-2 in. above the head", "At the center", "Same as the rack tom. Check the 3:1 rule between the two tom mics."], ["Room L / R (ch 5-6)", "Room-dependent. Default: a spaced pair, 6-10 ft in front of the kit, 4-6 ft apart, at 5-6 ft high, equidistant from the snare", "6-10 ft from the kit", "Both at the snare", "Measure from the snare to each mic with a tape and make them equal: that keeps the snare centered. The further back, the more room sound; in a small room, 6 ft is plenty. See the room notes."], ["Turner 95D as a mono crush mic (optional)", "Low, in front of the kick, or out in the room at chest height", "3-6 ft", "At the kit", "Into the 76-KT, all buttons in. Blend under the close mics. Its narrow range is the point."]]}, {"type": "h", "text": "Amps"}, {"type": "table", "head": ["Mic / channel", "Where", "Distance", "Aim", "Notes"], "rows": [["Magnatone, SM57 (ch 8)", "On the speaker cone, halfway between the dust cap (center) and the edge", "1-2 in. off the grille", "Straight at the cone", "Toward the center = brighter and more bite; toward the edge = warmer. Off-axis (angled) = smoother top. The Magnatone's vibrato is in the amp, so the mic hears it; no need to add it later."], ["Marshall MG250DFX or Orange, SM58-style (ch 9)", "Same as above", "1-2 in.", "At the cone, slightly off-axis", "SM58-style mics are darker than a 57; start nearer the dust cap. For the 2x12 Marshall, pick the speaker that sounds best and mic only that one."], ["Bass amp, if mic'd instead of DI (ch 7)", "On the cone, toward the edge", "2-4 in.", "At the cone", "Combine with the DI for the best of both: mic for grit, DI for low end. Check mono for phase between them."], ["Blending two amps on group 6", "Both mics as above", "", "", "Both amps share group 6, so set each mic first, then balance on the console faders. Keep the two amps a few feet apart so each mic hears mostly its own."]]}, {"type": "h", "text": "Vocals, horn and acoustic"}, {"type": "table", "head": ["Mic / channel", "Where", "Distance", "Aim", "Notes"], "rows": [["Lead vocal, Worker Bee (ch 10)", "On a boom in front of the singer, capsule at mouth height or slightly above, with a pop filter", "6-10 in. from the mouth, pop filter at 3-4 in.", "At the mouth, singer slightly off to one side of the capsule's center", "Closer for intimacy and more low end; back off for a shouted take. Hang a blanket or put the singer's back to the room's soft side: a condenser hears the whole room. LO CUT on at the console."], ["Vocal 2, Peavey (ch 15)", "Handheld or on a stand", "1-3 in. (dynamic mics like it close)", "At the mouth, slightly off-axis to tame plosives", "Dynamic mics reject the room, so they can sit near the drum kit when the band tracks together. Point its back at the kit."], ["Vocal 3, Turner 95D (ch 16)", "On a stand", "2-6 in.", "At the mouth", "Lo-fi by nature. Closer makes it fuller; it has no low end to over-emphasize. Sort its impedance first (Setup Map)."], ["Trumpet, SM58 (ch 14)", "In front of the bell, off-center", "12-24 in. from the bell", "Slightly off the bell's axis, not straight down it", "Loudest source in the room. Straight into the bell is harsh and clips; off-axis and back a foot is round. The console trim will be low."], ["Acoustic guitar, Worker Bee (ch 10)", "Where the neck meets the body", "8-12 in.", "At the 12th fret, angled slightly toward the sound hole", "Never straight at the sound hole: that's all boom. For strummed parts pull back to 14-18 in."]]}, {"type": "h", "text": "The band tracking together: bleed control"}, {"type": "ul", "items": ["Order of volume in the room: drums, then amps, then trumpet, then voices. Put the loudest things farthest from the vocal mics, and point every cardioid mic's back at the kit.", "Guitar amps: face them away from the drums and away from each other, or put a blanket or a sofa cushion over the back and sides of an open-back combo. Even a chair with a coat on it between amp and kit helps.", "Vocals during a band take go on the dynamics (Peavey, SM58), not the Worker Bee: a condenser will record the drums as much as the voice. Overdub the lead vocal with the Worker Bee afterward.", "Bass through the DI needs no isolation at all; that's the main reason to use it for live takes.", "The room mics will hear everything. That's fine: in a small room they become \"band mics\" and glue the take. Check them in mono before committing."]}, {"type": "h", "text": "Room-dependent decisions (what your measurements would change)"}, {"type": "ul", "items": ["<b>Where the kit sits.<\/b> Not in the exact center of the room and not against a wall; about a third of the way along the longer dimension, facing the long way, is the usual best spot. In a very small room, a corner-ish placement with the kick firing diagonally gives the room mics the most distance.", "<b>Room mic distance and height.<\/b> The defaults above assume a room of roughly 10-14 ft on its longer side. Smaller: bring the pair to 4-6 ft and lower, or use one mono room mic. Bigger: push back to 10-12 ft and raise to 6-7 ft. The ceiling height sets the maximum useful mic height: keep the capsules at least 18 in. below the ceiling.", "<b>Whether the room is live or dead.<\/b> Carpet and a low ceiling (like the control room in your photos) is dead: room mics will sound small, and the Turner crush mic becomes the better room sound. Hard floors and bare walls are live: room mics shine, but the vocal needs a blanket behind the singer.", "<b>Control room.<\/b> For mixing on the DIY monitors, the speakers should sit on the long wall's centerline with your head and the two speakers forming an equal triangle, and the first reflection points on the side walls (where a mirror held flat against the wall shows a speaker from your seat) get an absorber. The room's size sets the speaker spacing; with the console desk at about 4 ft wide, the clamp-mounted speakers land roughly 3.5-4 ft apart, so sit about 3.5-4 ft back.", "<b>What to send me:<\/b> length, width and ceiling height of the live room and the control room, and which walls are hard or soft. With those, the room-mic positions, the kit spot and the monitor triangle above become exact numbers instead of ranges."]}]}, {"id": "tascam", "title": "Tascam 246: Setup and Recording", "desc": "Connections, levels, recording passes, bouncing", "group": "Recording", "blocks": [{"type": "lead", "text": "How the 246 Portastudio connects to the 24&bull;8, how its own mixer is set, and the settings for recording to tape, bouncing, and getting four tracks back out. Everything here is for after the repair; it doesn't play tape yet. Control names follow the 246's panel."}, {"type": "h", "text": "What's on the 246 (so the rest makes sense)"}, {"type": "ul", "items": ["<b>Six input channels.<\/b> Channels 1-4 have a selector for MIC/LINE, OFF or REMIX (tape playback of that track). Channels 5-6 select MIC/LINE, OFF or LINE B (a pair of phono inputs on the back). Each channel has a trim with an overload LED, a two-band sweepable EQ (HI 1-8 kHz, LO 62 Hz-1.5 kHz, inner knob = cut/boost, outer = frequency), two post-fader effect sends, pan, and a fader. All inputs are unbalanced 1/4\".", "<b>Assign buttons per channel: L/1, R/2, 3, 4.<\/b> A channel goes to tape track 1 or 2 through L/1 and R/2 with the pan (left = 1, right = 2), and to tracks 3 and 4 directly. At mixdown, L/1 and R/2 are the stereo left and right program busses.", "<b>Four RECORD FUNCTION buttons<\/b> arm the tracks; the LED flashes when armed and stays lit while recording. <b>Four big VU meters<\/b> show the tape tracks; two smaller ones show the stereo mix, the monitor mix or the effect sends depending on the meter select button.", "<b>Monitor section:<\/b> a level and pan for each of the four tape tracks (this is its own little cue mixer), a MONO button, PHONES level, and a CUE / PGM button. In PGM you hear the mix going to tape; in CUE you hear the tape tracks through the monitor section. The INSERT button is for punch-ins.", "<b>Back panel:<\/b> four TAPE OUT phonos (one per track, straight off the tape), stereo program outs, monitor outs, two effect send outs, LINE B inputs, six channel insert jacks, and two dbx noise-reduction slide switches (all tracks, or track 4 alone).", "<b>Under the cassette door:<\/b> the tape speed switch, 1-7/8 or 3-3/4 ips. Use 3-3/4 ips for everything you record here; it's cleaner and brighter. 1-7/8 exists only to play tapes made on slower machines. The pitch control (±12%) has its own on/off switch; leave it off unless you're doing it on purpose."]}, {"type": "h", "text": "Connections"}, {"type": "table", "head": ["Direction", "From", "To", "Cable", "Notes"], "rows": [["Console to tape", "24&bull;8 MAIN MIX OUT L and R", "246 channels 5 and 6, selector on MIC/LINE (or LINE B phonos on the back)", "1/4\" TRS to 1/4\" TS, 2", "The 24&bull;8's main outs are +4 dBu balanced; the 246 inputs are -10 dBV unbalanced. Expect to keep the console's main fader lower than usual and the 246 trims low."], ["Tape back to console", "246 TAPE OUT 1-4 (phono), or the stereo program outs for a mixed pair", "24&bull;8 ch 23-24 line inputs", "RCA to 1/4\" TS, 2 (or 4 if you want all four tracks on their own console channels)", "Ch 23-24 are the book's plan. For four separate tape tracks into the console at once, borrow ch 21-22 as well."], ["Into Reaper", "24&bull;8 ch 23-24 assigned to groups 7-8", "UMC1820 inputs 7-8 (Reaper 7-8)", "Already wired", "Temporarily in place of the Reface CS. Record 23-24 in Reaper, then put the Reface back on 7-8."], ["Power", "246 integral mains lead", "Furman rear outlet 7 (the spare)", "", "Low draw. It can share the Furman switch with the rack."]]}, {"type": "h", "text": "Levels: the one thing that matters most"}, {"type": "ul", "items": ["Set the 24&bull;8 side first, as in the Gain Staging Guide: whatever you're sending to tape should be peaking near 0 on the console's L/R meters with the main fader at U.", "Then turn the 246's channel 5/6 trims up from zero until the big VU meters for the armed tracks peak around 0 VU on the loudest parts. The overload LED next to the trim must not flash. Cassette has very little headroom above 0 VU; +3 is the ceiling, and with dbx engaged even that starts to crunch.", "For the saturation sound you're after, run the meters into the red on drums and bass by a VU or two, then listen back. The crunch you hear is the tape, and it's permanent. Back off if cymbals turn to mush.", "Leave the 246's channel faders at the 0 mark for the tape-in path; use the trims for level, the same rule as on the console.", "If the tape comes back too quiet into the 24&bull;8, raise the trims on ch 23-24, not the 246's program faders."]}, {"type": "h", "text": "246 channel settings"}, {"type": "table", "head": ["246 channel", "Used for", "Trim", "EQ HI (1-8 kHz)", "EQ LO (62-1.5k)", "Effect 1 / 2", "Pan", "Assign"], "rows": [["5", "24&bull;8 main mix L", "To 0 VU", "Flat", "Flat", "Off", "Hard L", "L/1 (and 3 for a drum pass)"], ["6", "24&bull;8 main mix R", "Match ch 5", "Flat", "Flat", "Off", "Hard R", "R/2 (and 4 for a drum pass)"], ["1-4 on REMIX", "Playback of tracks 1-4 at mixdown or bounce", "To taste", "Up to +3 dB at 5-6 kHz to put back the top tape loses", "Cut 2-3 dB around 250 Hz if muddy", "Off (the TSR-12 is on the console)", "Spread L/R to taste", "L/1 and R/2 = the stereo outs"], ["1-4 on MIC/LINE", "Recording straight into the 246 (4-track ideas away from the console)", "To 0 VU", "Flat to start", "Flat", "Off", "Per assign rule", "1 track each"]]}, {"type": "note", "text": "The rule for EQ on the 246: none on the way in. The console's EQ already shaped the sound, and anything you add here is baked into the tape. Use its EQ only on the way back out, and lightly. The console's ch 23-24 EQ (HI shelf +1 dB) is the planned place for that."}, {"type": "h", "text": "Recording a pass to tape, step by step"}, {"type": "table", "head": ["Step", "Do this", "Watch for"], "rows": [["1", "Tape speed to 3-3/4 ips. dbx switch to the position for all four tracks (on). Pitch off. Clean tape, wound a few seconds past the leader.", "The dbx LED. Decide dbx on or off before recording and never change it between recording and playback: a tape recorded with dbx on and played with it off sounds pumped and dull, and the reverse is hissy."], ["2", "Press RECORD FUNCTION on the track(s) you're recording. Set the 246 to PGM so you hear what's going to tape.", "The armed LEDs flash."], ["3", "On the 24&bull;8: keep ch 23-24 OUT of the L/R mix (their L/R buttons up). Otherwise the tape output feeds back into its own input.", "If you hear a building howl or echo, this is why."], ["4", "Set levels as above: console to 0, then 246 trims to 0 VU on the armed tracks.", "Overload LEDs stay off."], ["5", "Press RECORD and PLAY together. Record the pass. Stop. Zero return.", "The counter: note where the take starts."], ["6", "Playback check: 246 to CUE, raise that track's level in the monitor section, and listen on the 246's own headphone jack, or set ch 23-24 into L/R on the console and listen there.", "Compare to the dry Reaper track. The difference is what tape did."], ["7", "Capture into Reaper: assign ch 23-24 to groups 7-8, arm Reaper inputs 7-8, press play on the 246. Line the take up by ear or with the click at the start.", "There is no sync between the 246 and Reaper. Record a short click or count-in at the head of every tape pass so lining up is easy."]]}, {"type": "h", "text": "Using all four tracks"}, {"type": "ul", "items": ["<b>Two stereo passes.<\/b> Pass one: console mix to tracks 1-2 (ch 5 to L/1, ch 6 to R/2). Pass two: a different mix or the same mix with heavier saturation to tracks 3-4 (ch 5 and 6 assigned to 3 and 4). Play all four back and blend them in the monitor section or on the console.", "<b>Drums-only crush.<\/b> Send only the drum groups to the console's L/R (mute everything else, or use the group masters), tape them to 3-4 with the meters hot, then capture that pair into Reaper as a parallel \"tape drums\" track to blend under the clean ones. This is the closest thing to the Tame Impala drum sound you can do without a reel-to-reel.", "<b>Bouncing inside the 246.<\/b> Put channels 1-3 on REMIX, assign them all to track 4, arm 4, record. Tracks 1-3 are now mixed onto 4 and can be re-used. Each bounce adds hiss and loses some top, so bounce once, not twice, and record the loudest sources last.", "<b>Four-track songwriting away from the console.<\/b> Channels 1-4 on MIC/LINE, one source per track, a mic straight into a 1/4\" input. The 246 is a complete little studio on its own; dump the four TAPE OUTs into the console later.", "<b>Punch-ins.<\/b> Set the 246 to CUE with INSERT on, play up to the spot, press RECORD at the punch point; the monitor switches from tape to input at that moment. The optional footswitch jack does the same hands-free."]}, {"type": "h", "text": "Things that go wrong"}, {"type": "ul", "items": ["Playback sounds dull and pumpy, or bright and hissy: dbx mismatch between record and play. Match the switch and try again.", "Howling or a slap echo when ch 23-24 are up: feedback loop. Take 23-24 out of L/R while recording to tape.", "Wow and flutter (pitch wobble): a worn belt or pinch roller, which is probably part of the repair. Also check that the pitch control is switched off.", "One channel of the pair is quiet: a trim mismatch between 246 ch 5 and 6, or the console's main L/R fader isn't the stereo pair you think (it is on the 8•Bus; check the sub-master assignment).", "The tape dropouts on track 4: the dbx switch for track 4 is separate for a reason. Try it off for that track if you're recording a sync tone or a click there.", "Head cleaning: cotton swab and isopropyl on the heads, capstan and pinch roller every few hours of use. Dirty heads lose high end before anything else."]}]}, {"id": "reaper", "title": "Reaper Setup", "desc": "Driver, 16 ins and outs, the track template, playback, MIDI", "group": "Recording", "blocks": [{"type": "lead", "text": "Getting Reaper on the PC to see all 16 inputs and 16 outputs through the UMC1820, with a track template that matches the console channel map, playback going back to the tape returns, MIDI for the pads, and recording settings that leave headroom."}, {"type": "h", "text": "1. Driver and audio device (once)"}, {"type": "ul", "items": ["Install Behringer's UMC driver for Windows from Behringer's site before plugging the UMC1820 in. Use the ASIO driver, not Windows' built-in WASAPI or DirectSound: ASIO is the only mode that exposes all 18 inputs and 20 outputs and gives low latency.", "In Reaper: Options > Preferences > Audio > Device. Audio system: <b>ASIO<\/b>. ASIO driver: <b>UMC ASIO Driver<\/b> (the name on your system may say BEHRINGER UMC). Enable inputs: first <b>1<\/b>, last <b>16<\/b>. Enable outputs: first <b>1<\/b>, last <b>18<\/b>.", "Sample rate: <b>48000<\/b> (or 44100). Never 88.2 or 96 kHz: ADAT drops to 4 channels and inputs 13-16 vanish. Set the same rate on the ADA8200's switch. Block size: start at <b>256<\/b>; go to 128 if headphone latency bothers performers, 512 if you hear clicks.", "Click ASIO Configuration to open the UMC control panel and confirm the sample rate and clock there too. The UMC1820's inputs 9-16 are the ADAT input (the ADA8200); 17-18 are S/PDIF, which you aren't using.", "Preferences > Project > Media: recording format <b>WAV, 24-bit<\/b>. 24-bit is what gives you room to record at -12 dBFS without losing anything."]}, {"type": "h", "text": "2. Name the inputs and outputs (once)"}, {"type": "ul", "items": ["Preferences > Audio > Device > Input channel name aliasing: name them so the track-input menu reads like the console map. Inputs 1-8 are the groups; 9-16 are the ADA8200.", "Suggested names: 1 Kick (grp1), 2 Snare (grp2), 3 Drums L (grp3), 4 Drums R (grp4), 5 Bass (grp5), 6 Guitars (grp6), 7 Reface L / Tape L (grp7), 8 Reface R / Tape R (grp8), 9 Lead vocal (ADA1), 10 Wireless (ADA2), 11 Trumpet (ADA3), 12 Vocal 2 (ADA4), 13 Vocal 3 (ADA5), 14 SH-201 L (ADA6), 15 SH-201 R (ADA7), 16 Drum machine (ADA8).", "Output aliasing: 1-2 Tape ret 1-2 (UMC main), 3-8 Tape ret 3-8, 9-10 unused (UMC 9-10), 11-18 Tape ret 9-16 (ADAT to the ADA8200). Reaper numbers the UMC1820's outputs 1-10 as the analog jacks and 11-18 as ADAT; the console's tape returns 9-16 are therefore Reaper outputs 11-18."]}, {"type": "h", "text": "3. The track template (matches the console map)"}, {"type": "table", "head": ["Reaper track", "Input", "Record arm default", "Output (playback)", "Console channel it plays back on"], "rows": [["1 Kick", "Mono 1", "Armed in the drum template", "Out 1", "Tape return 1"], ["2 Snare", "Mono 2", "Armed", "Out 2", "Tape return 2"], ["3-4 Drums (toms + rooms)", "Stereo 3/4", "Armed", "Outs 3/4", "Tape returns 3-4"], ["5 Bass", "Mono 5", "Armed", "Out 5", "Tape return 5"], ["6 Guitars", "Mono 6", "Armed", "Out 6", "Tape return 6"], ["7-8 Reface CS (or Tascam capture)", "Stereo 7/8", "Off until used", "Outs 7/8", "Tape returns 7-8"], ["9 Lead vocal", "Mono 9", "Armed", "Out 11", "Tape return 9"], ["10 Wireless", "Mono 10", "Off until used", "Out 12", "Tape return 10"], ["11 Trumpet", "Mono 11", "Off until used", "Out 13", "Tape return 11"], ["12 Vocal 2", "Mono 12", "Off until used", "Out 14", "Tape return 12"], ["13 Vocal 3", "Mono 13", "Off until used", "Out 15", "Tape return 13"], ["14-15 SH-201", "Stereo 14/15", "Off until used", "Outs 16/17", "Tape returns 14-15"], ["16 Drum machine", "Mono 16", "Off until used", "Out 18", "Tape return 16"], ["17 E-drums (MIDI)", "MIDI: UMC1820 MIDI in, all channels", "Armed when the pad is in use", "Out 18 (shares the drum machine's return) or the main 1/2", "Tape return 16, or 1-2"], ["18 SamplePad (MIDI)", "MIDI: SamplePad USB, all channels", "Off until used", "Main 1/2", "Tape returns 1-2"], ["MASTER", "", "", "Outs 1/2", "Tape returns 1-2 (MIX-B)"]]}, {"type": "note", "text": "Build this once, then File > Project templates > Save project as template, named \"Toad Studio tracking\". Every new session starts from it. Set each track's input with the small IN button on the track panel, and its output in the track's Routing window: untick \"Master send\" and add a hardware output to the out listed above. The MASTER goes to outs 1/2 so a quick mix comes back on tape returns 1-2 when you press MIX-B."}, {"type": "h", "text": "4. Playback back to the console"}, {"type": "ul", "items": ["Two ways to hear Reaper, pick per session. <b>Per-track playback:<\/b> every track to its own hardware out as in the table, so each Reaper track comes back on its own console tape return and you mix on the console's MIX-B section (or flip the channel to TAPE). That's the 16-track overdub setup.", "<b>Mix playback:<\/b> tracks send to the master only, master to outs 1/2, and the whole mix comes back on tape returns 1-2. Simpler for writing and for mixing in Reaper; press MIX-B on the console and you hear it.", "The UMC1820's front MAIN OUT knob sets outs 1-2 only. Keep it all the way up; the console's MIX-B level is your volume.", "Don't route a track to the same hardware out as the input it's recording from while the console channel is in the L/R mix: that's a feedback loop through the console. The per-track plan avoids it because recording comes from group/direct outs and playback goes to tape returns, which are separate paths."]}, {"type": "h", "text": "5. Recording settings"}, {"type": "ul", "items": ["Preferences > Audio > Recording: <b>input monitoring off<\/b> on all audio tracks (the track panel's monitor button). You're hearing yourself through the console, with zero latency; Reaper's monitoring would add a delayed copy. Turn Reaper monitoring on only for the MIDI tracks, which need it to hear the virtual drums.", "Record mode (Options > Record mode): <b>Normal<\/b> for tracking. Use <b>Time selection auto punch<\/b> for punch-ins; it starts and stops recording at the selection edges.", "Levels: the whole book aims for peaks around -12 to -6 dBFS on the Reaper meters. At 24-bit that's plenty. If a track's meter is touching the top, fix it at the console trim, not with Reaper's input gain (there isn't one; the fader is playback only).", "Pre-roll and count-in: Preferences > Audio > Recording > \"Count-in before recording\": 2 bars, and the metronome on during count-in only. The count-in through the headphone mix is also the click you'll use to line up Tascam passes.", "Project settings (Alt+Enter): BPM and time signature per song; <b>Timebase for items: Time<\/b>, so a later tempo change doesn't stretch recorded audio.", "Autosave: Preferences > Project > \"Save project every 5 minutes\" and \"when recording stops\". Record files into a dated project folder on the PC, not a USB drive."]}, {"type": "h", "text": "6. MIDI for the e-drums and SamplePad"}, {"type": "ul", "items": ["Preferences > Audio > MIDI Devices: enable <b>UMC1820 MIDI In<\/b> (the e-drum module) and the <b>SamplePad 4<\/b> USB MIDI port as inputs. Enable UMC1820 MIDI Out only if you want Reaper to drive the module's sounds.", "On the MIDI tracks, insert <b>ReaSamplOmatic5000<\/b> or a drum instrument plugin (the free MT Power Drum Kit works well for the one-pad-at-a-time method) and arm with monitoring on. Record the pad hits as MIDI notes, then move or re-pitch notes to any drum sound afterwards.", "To record the module's own sounds as audio instead, that's the PV6 path on console channels 19-20, which is monitor-only by design. Use the MIDI path for anything you want to keep."]}, {"type": "h", "text": "7. Mixing in Reaper: the plugins that replace outboard"}, {"type": "ul", "items": ["<b>ReaComp<\/b> on the drum bus and master does the clean bus compression the dbx units would. <b>ReaEQ<\/b> for anything beyond the console's broad strokes. <b>ReaDelay<\/b> and <b>ReaVerb<\/b> stand in for the aux-2 delay until you buy one.", "For the Tame Impala crush in the box: a free 1176-style plugin on the room-mic track, or ReaComp with ratio 20:1, fast attack, fast release, pushed 10-15 dB, blended under the clean drums. Not as good as the real 76-KT, but close for demos.", "Render (File > Render): WAV 24-bit for masters, MP3 320 for sharing. Render to a \"Mixes\" folder inside the project folder with the date in the filename."]}, {"type": "h", "text": "Troubleshooting"}, {"type": "ul", "items": ["Reaper shows only 8 inputs: audio system isn't ASIO, or last input is set to 8. Both are in Preferences > Audio > Device.", "Inputs 9-16 are silent or clicky: the ADA8200 and UMC1820 aren't on the same clock, or the sample rates differ. See the Setup Map's clock notes; the ADA8200's SYNC light must read LOCKED.", "Doubled, slightly delayed sound in headphones while recording: Reaper's input monitoring is on. Turn it off on the audio tracks.", "Playback is heard only on tape returns 1-2: the tracks are sending to the master instead of their own hardware outs. Check each track's Routing window.", "Crackles when the screen is busy: raise the block size one step, and set Windows' power plan to High performance. USB hubs cause this too; the UMC1820 should be on its own port on the PC.", "Reaper can't find the files after a session: the project was saved to a different folder than the media. Use File > Save project as with \"Copy all media into project directory\" ticked once, and the template's folder setting after that."]}]}, {"id": "fl-studio", "title": "FL Studio Setup", "desc": "The same studio in FL Studio", "group": "Recording", "blocks": [{"type": "lead", "text": "The same studio in FL Studio instead of Reaper. The driver, sample rate, clock and all the wiring are identical to the Reaper page; what's different is how FL takes in audio, which runs through the Mixer rather than tracks. Recording external audio needs FL Studio Producer Edition or higher. Control names follow the FL Studio manual."}, {"type": "h", "text": "What's the same as Reaper (don't redo it)"}, {"type": "ul", "items": ["Behringer's UMC ASIO driver, 48 kHz, 24-bit, the same block size, the ADA8200 clocked to the UMC1820: all exactly as in the Reaper page, sections 1 and the clock notes in the Setup Map.", "Inputs 1-8 are the console groups, 9-16 are the ADA8200 (direct outs). Outputs 1-10 are the UMC1820's analog jacks (tape returns 1-8 on outputs 1-8), outputs 11-18 are the ADAT outs (tape returns 9-16).", "You still monitor through the console, not the computer. Latency and feedback rules are the same."]}, {"type": "h", "text": "1. Audio settings (once)"}, {"type": "ul", "items": ["Options > Audio Settings (F10). Device: the Behringer UMC ASIO driver. The manual's own advice: use the manufacturer's ASIO driver; \"FL Studio ASIO\" is a compatibility fallback that adds latency and jitter, and ASIO4ALL is only for combining several devices. One interface means the Behringer driver.", "Sample rate 48000. Buffer length: start around 256 samples (about 5 ms); larger if you hear underruns, which FL shows as a counter in the Audio Settings window.", "Mixer menu > Disk recording: tick <b>Auto-unarm<\/b> so armed inserts drop out after a take, and <b>Latency compensation<\/b> so recorded clips line up with the Playlist.", "Options > Project general settings: default recording folder inside a dated project folder on the PC, same habit as Reaper."]}, {"type": "h", "text": "2. Map the 16 inputs to Mixer inserts (once, then save as template)"}, {"type": "ul", "items": ["Open the Mixer (F9). On Insert 1, right-click the <b>Input<\/b> menu (top right of the insert, with the Recording Pickup selector in front of it) and choose <b>Auto-map<\/b>. FL assigns each device input to a successive insert: input 1 to Insert 1, through input 16 to Insert 16. It also disables those inserts' sends to the Master so the live input can't feed back; you see meters but hear nothing, which is correct because you're listening through the console.", "Mono vs stereo: the Input menu has a stereo list on top and a mono list below. For every mono source (kick, snare, bass, vocals, trumpet, drum machine) pick the mono entry so it feeds both sides. Use the stereo pairs only for inputs 3/4 (drums), 7/8 (Reface) and 14/15 (SH-201). Auto-map picks stereo pairs, so fix the mono ones by hand afterwards.", "Recording Pickup selector on each insert: <b>EXT<\/b> (external), the manual's recommendation, so the recording is the raw input before any insert effects.", "Name and color the inserts to match the console map (right-click the insert name, F2): 1 Kick, 2 Snare, 3-4 Drums, 5 Bass, 6 Guitars, 7-8 Reface / Tape, 9 Lead vocal, 10 Wireless, 11 Trumpet, 12 Vocal 2, 13 Vocal 3, 14-15 SH-201, 16 Drum machine.", "Link each insert to a Playlist track so takes land in a predictable place: right-click a Playlist track header > Track mode > Audio track > pick the insert. Do this for all 16, in order.", "File > Save as template (or save to Templates folder) as \"Toad Studio tracking\"."]}, {"type": "h", "text": "3. Playback back to the console"}, {"type": "table", "head": ["Mixer insert", "Output (insert's OUT menu)", "Console tape return", "Note"], "rows": [["1-8 (groups)", "UMC outputs 1-8, one per insert", "Tape returns 1-8", "Pair inserts 3/4 and 7/8 as stereo outs 3-4 and 7-8."], ["9-16 (ADA8200)", "UMC outputs 11-18, one per insert", "Tape returns 9-16", "FL numbers the ADAT outs 11-18 exactly as Reaper does."], ["Master", "UMC outputs 1-2", "Tape returns 1-2", "The whole mix comes back on MIX-B when you only want a stereo return."]]}, {"type": "note", "text": "Each insert's output is chosen in its OUT menu, next to the Input menu. By default everything goes to the Master; for 16-track overdubbing give each insert its own hardware output as above and leave the Master on 1-2. Keep the UMC1820's MAIN OUT knob all the way up; MIX-B level on the console is the volume."}, {"type": "h", "text": "4. Recording a take"}, {"type": "ul", "items": ["Arm the inserts you're recording: click the <b>disk icon<\/b> at the bottom of each insert (selecting an input arms it automatically; check it's lit).", "Right-click the transport <b>Record<\/b> button and make sure <b>Audio<\/b> is ticked in the recording filter. This is the step everyone misses: with Audio unticked, FL records knob moves and notes but no sound.", "Left-click Record so it lights orange, then press Play. Recording runs until Stop. In Song mode with Auto-create audio clip on, the takes appear as Audio Clips on the linked Playlist tracks.", "Count-in: the one-click recording mic icon in the toolbar gives a 4-beat count-in and records straight into the Playlist; use it for quick takes. For the count-in click through the headphones, turn the metronome on and set it to count-in only.", "Levels: the same -12 to -6 dBFS target on the insert meters. Set it at the console trim; the insert fader is playback only.", "<b>Monitor external input: Off<\/b> on every audio insert (right-click the insert's input area). You hear yourself through the console; FL's monitoring would add a delayed copy. If a take comes back slightly early or late against the click, use the Audio input delay compensation control in the Mixer menu."]}, {"type": "h", "text": "5. MIDI for the e-drums and SamplePad"}, {"type": "ul", "items": ["Options > MIDI Settings: enable the UMC1820 MIDI In (e-drum module) and the SamplePad 4 USB port as inputs. Set each to a different controller type only if FL asks; generic is fine.", "Add FPC (FL's drum sampler) or a drum VST on a Channel Rack channel, route it to a free Mixer insert (17 or above), and record the pad hits as a Pattern. One pad can be any drum; move notes in the Piano roll to re-assign them.", "FL records MIDI into Patterns by default, so for the pads use Pattern mode or make sure the Notes box is ticked in the recording filter."]}, {"type": "h", "text": "6. Mixing in FL: the plugins that replace outboard"}, {"type": "ul", "items": ["Fruity Limiter in compressor mode, or Maximus, for bus compression; Fruity Parametric EQ 2 for surgery; Fruity Delay 3 for the aux-2 delay stand-in; Fruity Reeverb 2 for reverb.", "The room-mic crush: Fruity Limiter with ratio high, fast attack and release, 10-15 dB of gain reduction, on the room-mic insert, blended under the clean drums.", "Export: File > Export > WAV, 24-bit, for masters; MP3 320 for sharing, to a \"Mixes\" folder inside the project folder."]}, {"type": "h", "text": "Reaper or FL Studio for this studio?"}, {"type": "ul", "items": ["Either works with everything in this book. The console does the tracking work in both cases; the computer is a 16-track tape machine.", "Reaper's track-per-input model maps onto the console more directly and its per-track hardware outputs are quicker to set up. FL Studio's strengths are the Channel Rack and Piano roll for the e-drums, SamplePad and drum machine programming.", "A reasonable split: track the band in Reaper, program beats and synth parts in FL, and move audio between them as WAV files. Both read the same 24-bit 48 kHz files, so nothing is lost."]}, {"type": "h", "text": "Troubleshooting"}, {"type": "ul", "items": ["Nothing records: the recording filter's Audio box is unticked, or no insert has its disk icon lit, or the input is set on the insert but it's a stereo entry for a mono mic (you'll get one side only).", "FL sees only 2 inputs or none: Audio Settings isn't on the Behringer ASIO driver.", "A doubled, delayed sound while playing: Monitor external input is on. Turn it off; you're monitoring through the console.", "Takes land on the wrong Playlist track: the insert isn't linked to a Playlist track; set Track mode > Audio track on the track you want.", "Clicks on inputs 9-16 only: clock. The ADA8200's SYNC light must read LOCKED (Setup Map).", "Everything in the Playlist is a quarter-beat late: Disk recording > Latency compensation is off."]}]}, {"id": "pro-tools", "title": "Pro Tools Setup", "desc": "The same studio in Pro Tools", "group": "Recording", "blocks": [{"type": "lead", "text": "The same studio in Pro Tools. Driver, sample rate, clock and wiring are identical to the Reaper page. Pro Tools adds one step the others don't have, the I/O Setup window, where every input and output has to exist as a named path before a track can use it. Control names follow Avid's current Pro Tools."}, {"type": "h", "text": "What's the same as Reaper (don't redo it)"}, {"type": "ul", "items": ["Behringer's UMC ASIO driver on Windows, 48 kHz, 24-bit, the ADA8200 clocked to the UMC1820: all as in the Reaper page and the Setup Map's clock notes.", "Inputs 1-8 are the console groups, 9-16 are the ADA8200. Outputs 1-10 are the UMC1820's analog jacks (tape returns 1-8 on 1-8), outputs 11-18 are the ADAT outs (tape returns 9-16).", "You monitor through the console, not the computer.", "Tier check before you start: Pro Tools Intro is limited to 8 audio tracks total, so it can't run this 16-input studio. Pro Tools Artist (16 simultaneous record inputs) is the minimum; Studio removes the limits. Check the current Avid tier table, since these numbers change."]}, {"type": "h", "text": "1. Session and Playback Engine (once)"}, {"type": "ul", "items": ["Dashboard > Create: name it, <b>WAV, 24-bit, 48 kHz<\/b>, I/O Settings: Last Used. Pro Tools fixes the sample rate per session, so pick 48 kHz here and never change the UMC1820 or ADA8200 afterwards.", "Setup > Playback Engine. Playback Engine: the <b>Behringer UMC ASIO<\/b> driver (Windows lists ASIO drivers here). H/W Buffer Size: <b>256<\/b> for tracking; raise to 1024 when mixing with lots of plugins. Voices: leave at the default. Holding N while Pro Tools starts opens this window if the wrong device is stuck.", "Setup > Session (Ctrl+2): Clock Source should be <b>Internal<\/b> on the UMC1820 side. The ADA8200 follows it over ADAT (SYNC switch to ADAT IN, LOCKED light on)."]}, {"type": "h", "text": "2. I/O Setup (once, then export the settings)"}, {"type": "ul", "items": ["Setup > I/O (Ctrl+Shift+I). This is the step that trips people up: Pro Tools only offers a track the paths defined here.", "<b>Input tab:<\/b> click <b>Default<\/b> to let Pro Tools create a path per physical input, then rename them to the console map. Make inputs 3-4, 7-8 and 14-15 stereo paths and leave the rest mono. Click a name to rename: Kick, Snare, Drums (3-4), Bass, Guitars, Reface/Tape (7-8), Lead vocal (ADA1), Wireless (ADA2), Trumpet (ADA3), Vocal 2 (ADA4), Vocal 3 (ADA5), SH-201 (ADA6-7), Drum machine (ADA8).", "<b>Output tab:<\/b> Default, then rename. Outputs 1-2 are the UMC1820's main jacks (tape returns 1-2); make them a stereo path called \"Main / Tape 1-2\". Outputs 3-8 mono paths \"Tape 3\" through \"Tape 8\" (or stereo pairs for 3-4 and 7-8). Outputs 11-18 are the ADAT outs: name them \"Tape 9\" through \"Tape 16\". Outputs 9-10 are the UMC1820's unused analog pair; leave them.", "<b>Bus tab:<\/b> leave the defaults. Set the <b>Monitor Path<\/b> (bottom of the Output tab) to Main / Tape 1-2.", "Click <b>Export Settings<\/b> and save as \"Toad Studio.pio\" so a new session can Import Settings instead of redoing this."]}, {"type": "h", "text": "3. The session template"}, {"type": "table", "head": ["Track", "Input path", "Output path", "Console tape return"], "rows": [["Kick (mono)", "Kick (in 1)", "Tape 1", "1"], ["Snare (mono)", "Snare (in 2)", "Tape 2", "2"], ["Drums (stereo)", "Drums (in 3-4)", "Tape 3-4", "3-4"], ["Bass (mono)", "Bass (in 5)", "Tape 5", "5"], ["Guitars (mono)", "Guitars (in 6)", "Tape 6", "6"], ["Reface / Tape capture (stereo)", "Reface/Tape (in 7-8)", "Tape 7-8", "7-8"], ["Lead vocal (mono)", "Lead vocal (in 9)", "Tape 9 (out 11)", "9"], ["Wireless (mono)", "Wireless (in 10)", "Tape 10 (out 12)", "10"], ["Trumpet (mono)", "Trumpet (in 11)", "Tape 11 (out 13)", "11"], ["Vocal 2 (mono)", "Vocal 2 (in 12)", "Tape 12 (out 14)", "12"], ["Vocal 3 (mono)", "Vocal 3 (in 13)", "Tape 13 (out 15)", "13"], ["SH-201 (stereo)", "SH-201 (in 14-15)", "Tape 14-15 (outs 16-17)", "14-15"], ["Drum machine (mono)", "Drum machine (in 16)", "Tape 16 (out 18)", "16"], ["E-drums (Instrument track)", "MIDI: UMC1820 MIDI In, all", "Main / Tape 1-2", "1-2"], ["SamplePad (Instrument track)", "MIDI: SamplePad USB, all", "Main / Tape 1-2", "1-2"], ["Master Fader", "", "Main / Tape 1-2", "1-2 (MIX-B)"]]}, {"type": "note", "text": "Track > New (Ctrl+Shift+N): make the mono and stereo audio tracks in one go, timebase Samples. Set each track's Input and Output selectors in the Mix window's I/O section (the two buttons above the fader). Then File > Save as Template, named \"Toad Studio tracking\", so Dashboard offers it under Templates. With each track on its own output, every Pro Tools track comes back on its own console tape return; switch all outputs to Main / Tape 1-2 when you only want a stereo return on MIX-B."}, {"type": "h", "text": "4. Recording"}, {"type": "ul", "items": ["Record-enable tracks with the <b>R<\/b> button on each track (Alt-click arms every track). It blinks red when armed and stays solid once the transport is record-armed.", "Monitoring: you listen through the console, so Pro Tools shouldn't also feed you the live input. Leave <b>Options > Auto Input Monitoring<\/b> on (its default) and <b>Input Only Monitoring<\/b> off, and keep the console's tape-return channels for the tracks you're recording out of the L/R mix during the take. Bring them back in for playback. If you ever do monitor through Pro Tools, <b>Options > Low Latency Monitoring<\/b> bypasses plugins on armed tracks to keep the delay small.", "Transport: record button, then Play (or Ctrl+Space). For punch-ins, Options > <b>QuickPunch<\/b>, which lets you punch in and out on the fly with Ctrl+Space while rolling.", "Count-off: Setup > Click/Countoff Options: 2 bars, countoff only during record. Add a click track with Track > Create Click Track; its output can go to Main / Tape 1-2 so it reaches the headphones through MIX-B, and is also the click you'll use to line up Tascam passes.", "Levels: the same -12 to -6 dBFS target on the track meters. Pro Tools track meters are post-fader by default; Setup > Preferences > Metering lets you switch them to pre-fader, which is more useful while tracking.", "Setup > Preferences > Operation: Auto Backup on, every 5 minutes, keep 10. Sessions and audio into a dated session folder on the PC."]}, {"type": "h", "text": "5. MIDI for the e-drums and SamplePad"}, {"type": "ul", "items": ["Setup > MIDI > Input Devices: tick the UMC1820 MIDI In and the SamplePad 4. Create two Instrument tracks, set each one's MIDI input to its device (all channels), and insert a drum instrument (Pro Tools ships with Boom and Xpand!2; a free third-party kit works too). Record-enable and record the pad hits as MIDI; re-assign notes to any drum afterwards in the MIDI Editor."]}, {"type": "h", "text": "6. Mixing: the plugins that replace outboard"}, {"type": "ul", "items": ["Dyn3 Compressor/Limiter on the drum bus and master; EQ3 7-Band for surgery; Mod Delay III for the aux-2 delay stand-in; D-Verb for reverb. All ship with Pro Tools.", "The room-mic crush: BF-76 (Avid's included 1176 model) on the room-mic track, all four ratio buttons in, input pushed hard, blended under the clean drums. This is the closest in-the-box match to the 76-KT you're buying.", "Bounce: File > Bounce Mix, WAV 24-bit for masters, MP3 for sharing, to a \"Mixes\" folder in the session folder."]}, {"type": "h", "text": "Troubleshooting"}, {"type": "ul", "items": ["A track's input menu only shows a few inputs: I/O Setup hasn't been defaulted or the paths aren't active. Setup > I/O > Input tab > Default.", "No sound from inputs 9-16 or clicks on them: clock. Session Setup clock on Internal, ADA8200 SYNC on ADAT IN and LOCKED.", "Audio outputs aren't selectable above 2: Playback Engine is on the wrong device, or the Output tab needs Default.", "Doubled, delayed sound while recording: Pro Tools' monitoring is reaching the console through the tape returns while the live channel is also in the mix. Take the tape-return channels out of L/R while tracking.", "\"Session sample rate doesn't match\": the UMC1820 is at a different rate than the session. Match it in the UMC control panel and the ADA8200 switch, then reopen the session.", "Pro Tools won't open the session's audio: it was moved without the Audio Files folder. Always move the whole session folder."]}]}, {"id": "garageband", "title": "GarageBand Setup", "desc": "The same studio on a Mac in GarageBand", "group": "Recording", "blocks": [{"type": "lead", "text": "The same studio in GarageBand. Two things to know first: GarageBand runs on Mac and iPad only, so this page applies if a Mac joins the studio alongside the Windows PC; and GarageBand is built for small sessions, so it works for overdubs and demos but can't do the full 16-input band tracking the other pages describe. Control names follow Apple's GarageBand User Guide."}, {"type": "h", "text": "What's different about GarageBand"}, {"type": "ul", "items": ["<b>Simultaneous recording is limited.<\/b> Apple's guide says you can record to more than one audio track at a time but doesn't publish a cap; in practice GarageBand users report a ceiling of around 8 armed tracks. Treat it as an 8-input recorder: the console's groups 1-8 into the UMC1820, with the ADA8200's 8 extra inputs for overdubs one at a time. Logic Pro, GarageBand's big brother, removes the limit and opens GarageBand projects directly.", "<b>No ASIO.<\/b> On a Mac the UMC1820 and ADA8200 are class-compliant: no driver to install. The Mac's Core Audio sees the UMC1820 with all 18 inputs and 20 outputs.", "<b>Outputs are stereo only.<\/b> GarageBand sends everything to one stereo output pair. There is no per-track hardware output, so there is no 16-track playback to the tape returns. Playback comes back on tape returns 1-2 and you press MIX-B on the console. For per-track returns you need Logic, Reaper (which also runs on Mac), or Pro Tools.", "<b>Projects are fixed at 44.1 kHz<\/b> in GarageBand's settings (Preferences > Audio/MIDI > Sample rate offers 44.1 or 48 in recent versions; older versions are 44.1 only). Whichever you choose, set the UMC1820 and ADA8200 to match."]}, {"type": "h", "text": "1. Preferences (once)"}, {"type": "ul", "items": ["GarageBand > Settings (Preferences) > Audio/MIDI. Output Device: <b>UMC1820<\/b>. Input Device: <b>UMC1820<\/b>. Sample rate 48 kHz if offered, otherwise 44.1 kHz, and set the ADA8200's switch and the UMC1820 to the same.", "In the same pane, set the buffer (I/O Buffer Size) to Medium or Small for tracking. GarageBand hides latency controls behind these presets.", "Audio MIDI Setup (in Applications > Utilities): confirm the UMC1820 shows 18 ins and 20 outs and the right sample rate. This app is where the Mac's clock and rate are set; GarageBand follows it.", "Settings > Advanced: tick <b>Show advanced tools<\/b>. Without it, Record Enable buttons and per-track input selection don't appear."]}, {"type": "h", "text": "2. Make the tracks and set their inputs"}, {"type": "ul", "items": ["Track > New Track > Audio (mic icon), <b>Input: Input 1<\/b> for a mono source or <b>Input 1 + 2<\/b> for a stereo pair. Repeat per source; GarageBand asks for the input as you create each track, which is the quickest way to map the console channels.", "To change an input later: select the track, open the Smart Controls (B), and use the <b>Input<\/b> menu in the recording settings area, or double-click the track header for the track's inspector.", "Show the Record Enable buttons: Track > <b>Configure Track Header<\/b> (or Option-T), tick <b>Record Enable<\/b>. Apple's guide: the Record Enable button must be visible on each track you want to record to.", "Name and color the tracks to match the console map, and save the project as a template by keeping a blank copy called \"Toad Studio tracking\" (GarageBand has no template feature; File > Save As and duplicate it per session)."]}, {"type": "h", "text": "3. The track layout"}, {"type": "table", "head": ["GarageBand track", "Input (UMC1820)", "Console source", "Armable at once?"], "rows": [["Kick", "Input 1", "Group 1", "Yes"], ["Snare", "Input 2", "Group 2", "Yes"], ["Drums (stereo)", "Input 3 + 4", "Groups 3-4", "Yes"], ["Bass", "Input 5", "Group 5", "Yes"], ["Guitars", "Input 6", "Group 6", "Yes"], ["Reface / Tape (stereo)", "Input 7 + 8", "Groups 7-8", "Yes (this is the 8-input live set)"], ["Lead vocal", "Input 9", "ADA8200 1 (ch 10 direct out)", "As an overdub, or swap into the live set"], ["Wireless", "Input 10", "ADA8200 2", "Overdub"], ["Trumpet", "Input 11", "ADA8200 3", "Overdub"], ["Vocal 2", "Input 12", "ADA8200 4", "Overdub"], ["Vocal 3", "Input 13", "ADA8200 5", "Overdub"], ["SH-201 (stereo)", "Input 14 + 15", "ADA8200 6-7", "Overdub"], ["Drum machine", "Input 16", "ADA8200 8", "Overdub"], ["E-drums (Software Instrument)", "MIDI: UMC1820 MIDI In", "Pad", "Yes"], ["SamplePad (Software Instrument)", "MIDI: SamplePad USB", "Pad", "Yes"]]}, {"type": "note", "text": "For a live band take, arm the first eight (the group inputs) and record the drums, bass, guitars and keys together; the lead vocal goes down in the same pass only if you move it onto a group (assign ch 10 to group 7 or 8 instead of the Reface for that song). Everything on the ADA8200 inputs is then overdubbed one or two at a time, which is how most GarageBand records get made anyway."}, {"type": "h", "text": "4. Recording"}, {"type": "ul", "items": ["Arm the tracks (Record Enable buttons). Apple's guide notes that record-enabling a track also lets you monitor the input in GarageBand; turn each armed track's <b>monitoring<\/b> off (the small speaker icon next to Record Enable, or in Smart Controls) because you're hearing yourself through the console and would otherwise get a delayed double.", "Set the metronome and count-in (the metronome and count-in buttons in the control bar; count-in length in Settings > Metronome). The count-in is also your click for lining up Tascam passes.", "Press Record (R), play, press Stop. Multiple takes on one track go into a take folder; click the take number to choose.", "Levels: the same -12 to -6 dBFS target on the track meters, set at the console trim. GarageBand's track volume is playback only; its recording level control (in Smart Controls) stays at 0 because the UMC1820's gain is at minimum and the console is doing the work.", "Punch-ins: Record > Autopunch (or the Autopunch button in the control bar) and drag the red punch range in the ruler."]}, {"type": "h", "text": "5. Playback back to the console"}, {"type": "ul", "items": ["GarageBand's stereo output goes to UMC1820 outputs 1-2, which are tape returns 1-2. Press MIX-B on the console and raise MIX-B LEVEL. That's it; there is no per-track return.", "For a performer to hear a backing track and themselves, the console does the blend: MIX-B (GarageBand) plus the live channel on the aux 3/4 performer mix or on MONITOR.", "The UMC1820's front MAIN OUT knob sets outputs 1-2. Keep it all the way up."]}, {"type": "h", "text": "6. MIDI and the built-in instruments"}, {"type": "ul", "items": ["The UMC1820's MIDI in and the SamplePad's USB port appear automatically in GarageBand once the Mac sees them. Create a Software Instrument track, pick a Drum Kit, and play the pad; GarageBand records the MIDI. Drummer tracks and Apple's drum kits are a real strength here for the one-pad-at-a-time method."]}, {"type": "h", "text": "7. Mixing: the plugins that replace outboard"}, {"type": "ul", "items": ["Compressor and Channel EQ on every track (GarageBand's are Logic's, trimmed down). Delay and Reverb on the two master effect sends stand in for the TSR-12 and the aux-2 delay.", "For the room-mic crush: Compressor set to the Vintage FET model, ratio high, fast attack and release, pushed hard, on the room-mic track under the clean drums.", "Share > Export Song to Disk: WAV 24-bit for masters, AAC or MP3 for sharing."]}, {"type": "h", "text": "When to move up"}, {"type": "ul", "items": ["You'll feel GarageBand's limits the first time the whole band wants to record together with vocals, or the first time you want each track back on its own console channel. Logic Pro is the natural step: same files, same look, no track limits, per-track outputs, and it opens every GarageBand project you've made. Reaper also runs on the Mac and would let the PC and Mac share one workflow."]}, {"type": "h", "text": "Troubleshooting"}, {"type": "ul", "items": ["Only inputs 1-2 appear: Input Device isn't the UMC1820, or Show advanced tools is off.", "Tracks can't all be armed: you've hit the simultaneous-record ceiling. Record in two passes, or move to Logic or Reaper.", "Doubled, delayed sound: track monitoring is on. Turn it off; the console is your monitor.", "Clicks on inputs 9-16: sample rate mismatch between the project, the UMC1820 and the ADA8200. Set all three the same in Audio MIDI Setup and on the ADA8200.", "The project plays back at the wrong pitch after changing the rate: GarageBand resampled. Keep one rate per project from the start."]}]}, {"id": "panning", "title": "Panning Guide", "desc": "Console pans for tracking; Reaper pans for the mix", "group": "Sound", "blocks": [{"type": "img", "src": "img/panning-1.png", "title": "Panning Guide, Part 1: Console Pan Knobs (Tracking)", "alt": "Panning Guide, Part 1: Console Pan Knobs (Tracking) Dot = 248 pan knob position. Group channels: pan picks the group, keep it fixed. Direct-out channels: pan only changes the headphones. L C R Ch Source Records to 1 Kick Group 1 2 Snare Group 2 3 Rack tom (SM58-style) Groups 3-4 4 Floor tom (SM58-style) Groups 3-4 5 Room L Groups 3-4 6 Room R Groups 3-4 7 Bass amp (DI out or mic) Group 5 8 Magnatone (SM57) Group 6 9 Marshall or Orange (SM58-style) Group 6 10 Lead vocal (Worker Bee) Direct out > ADA8200 in 1 11 ATW-R3210 wireless Direct out > ADA8200 in 2 12 Reface CS L Group 7 13 Reface CS R Group 8 14 Trumpet (SM58) Direct out > ADA8200 in 3 15 Vocal 2 (Peavey) Direct out > ADA8200 in 4 16 Vocal 3 (Turner 95D) Direct out > ADA8200 in 5 17 Roland SH-201 L Direct out > ADA8200 in 6 18 Roland SH-201 R Direct out > ADA8200 in 7 19 Peavey PV6 main out L Monitor only 20 Peavey PV6 main out R Monitor only 21 1970s Roland drum machine Direct out > ADA8200 in 8 22 Open (drum machine R if stereo) 23 Tascam 246 line out L Monitor; groups 7-8 to capture 24 Tascam 246 line out R Monitor; groups 7-8 to capture Group channel: keep this pan setting Direct-out: pan for headphones; L/R only Monitor only: not recorded through the console Lopsided headphones? Press MONO or use the AUX SEND 3/4 performer mix. Neither changes the recording. Set final panning in Reaper."}, {"type": "img", "src": "img/panning-2.png", "title": "Panning Guide, Part 2: Final Mix in Reaper", "alt": "Panning Guide, Part 2: Final Mix in Reaper Suggested starting points for mixdown. Console pan doesn't carry over; set these on Reaper's tracks. L C R Reaper Track Why 1 Kick Center: anchors the low end. 2 Snare Center (or just off, to taste). 3-4 Toms + rooms (stereo) Stereo track at full width. Rack tom ends up left of center, floor tom right, matching the console pans. 5 Bass Center: low end stays mono. 6 Guitars (Magnatone + Marshall/Orange) Slightly left; for wide guitars, double-track and pan the second take right. 7-8 Reface CS (stereo) Stereo track at about 70% width so it doesn't crowd the guitars. 9 Lead vocal Center, always. 10 Wireless Center if it's a lead part; off-center if it's an instrument. 11 Trumpet Right, opposite the guitar track. 12 Vocal 2 Harmony left. 13 Vocal 3 Harmony right, mirroring vocal 2. 14-15 Roland SH-201 (stereo) Stereo pair: hard L/R for a wide pad, or narrow it if it fights the Reface. 16 1970s drum machine Center, or slightly off if it's a percussion layer. Mono track: pan position Stereo track: width Rules of thumb: kick, snare, bass and lead vocal stay centered. Balance the sides: what goes left, something similar goes right. Check the mix in mono (Reaper master mono button or the console's MONO): nothing important should disappear. Headphones exaggerate width; once the monitors are built, re-check panning on them."}, {"type": "h", "text": "Console pan map (text version)"}, {"type": "table", "head": ["Ch", "Source", "Pan", "Records to"], "rows": [["1", "Kick", "Hard L", "Group 1 (Reaper 1)"], ["2", "Snare", "Hard R", "Group 2 (Reaper 2)"], ["3", "Rack tom (SM58-style)", "10 o'clock", "Groups 3-4 (Reaper 3-4)"], ["4", "Floor tom (SM58-style)", "2 o'clock", "Groups 3-4 (Reaper 3-4)"], ["5", "Room L", "Hard L", "Groups 3-4 (Reaper 3-4)"], ["6", "Room R", "Hard R", "Groups 3-4 (Reaper 3-4)"], ["7", "Bass amp (DI out or mic)", "Hard L", "Group 5 (Reaper 5)"], ["8", "Magnatone (SM57)", "Hard R", "Group 6 (Reaper 6)"], ["9", "Marshall or Orange (SM58-style)", "Hard R", "Group 6 (Reaper 6)"], ["10", "Lead vocal (Worker Bee)", "Center", "Direct out &rarr; ADA8200 in 1 (Reaper 9)"], ["11", "ATW-R3210 wireless", "Center", "Direct out &rarr; ADA8200 in 2 (Reaper 10)"], ["12", "Reface CS L", "Hard L", "Group 7 (Reaper 7)"], ["13", "Reface CS R", "Hard R", "Group 8 (Reaper 8)"], ["14", "Trumpet (SM58)", "1 o'clock", "Direct out &rarr; ADA8200 in 3 (Reaper 11)"], ["15", "Vocal 2 (Peavey)", "10 o'clock", "Direct out &rarr; ADA8200 in 4 (Reaper 12)"], ["16", "Vocal 3 (Turner 95D)", "2 o'clock", "Direct out &rarr; ADA8200 in 5 (Reaper 13)"], ["17", "Roland SH-201 L", "9 o'clock", "Direct out &rarr; ADA8200 in 6 (Reaper 14)"], ["18", "Roland SH-201 R", "3 o'clock", "Direct out &rarr; ADA8200 in 7 (Reaper 15)"], ["19", "Peavey PV6 main out L", "Hard L", "Monitor only (e-drums, SamplePad 4, DJ)"], ["20", "Peavey PV6 main out R", "Hard R", "Monitor only (e-drums, SamplePad 4, DJ)"], ["21", "1970s Roland drum machine", "Center", "Direct out &rarr; ADA8200 in 8 (Reaper 16)"], ["22", "Open (drum machine R if stereo)", "&mdash;", "&mdash;"], ["23", "Tascam 246 line out L", "Hard L", "Monitor; assign to groups 7-8 to capture into Reaper"], ["24", "Tascam 246 line out R", "Hard R", "Monitor; assign to groups 7-8 to capture into Reaper"]]}]}, {"id": "alternate-setups", "title": "Alternate Setups", "desc": "A: all direct outs; B: stereo playback on two outputs", "group": "Setup", "blocks": [{"type": "lead", "text": "Other ways to wire the same studio. The Setup Map is the main plan and stays as it is; everything in this chapter is an option to try, with what changes, what it costs you, and how to switch back. New variations get added here as Alternate B, C and so on."}, {"type": "h", "text": "How to use this chapter"}, {"type": "ul", "items": ["Each alternate lists only what's <b>different<\/b> from the main plan. Anything not mentioned (rack, power, playback to the tape returns, clock, aux sends, monitoring outputs) stays exactly as the rest of the book describes.", "Every alternate here can be tried and undone in an afternoon by moving snake tails at the back of the console. Nothing needs buying. Alternates can be combined: for example, Alternate A's recording with Alternate B's playback, which is what the connection diagram at the end of this chapter shows."]}, {"type": "h", "text": "Alternate A: all direct outs"}, {"type": "p", "text": "Recording skips the eight groups. Each of channels 1-16 sends its own direct out to its own Reaper input, so channel 1 = Reaper track 1 through channel 16 = Reaper track 16, and each track plays back on the same channel's tape return. This is a standard way to track on an in-line console like the 24&bull;8: every source gets its own track, and the balance between them is decided in the mix instead of at tracking."}, {"type": "h", "text": "Alternate A channel map"}, {"type": "p", "text": "The sources stay on the same channels as the main map; only what the snakes plug into changes. Pans now affect only what you hear, so they can be set naturally (kick and bass centered) instead of hard left/right to pick a group."}, {"type": "table", "head": ["Ch", "Source", "Records to", "Pan (headphones only)"], "rows": [["1", "Kick", "Direct out &rarr; UMC1820 in 1 (Reaper 1)", "Center"], ["2", "Snare", "Direct out &rarr; UMC1820 in 2 (Reaper 2)", "Center or slightly R"], ["3", "Rack tom", "Direct out &rarr; UMC1820 in 3 (Reaper 3)", "10 o'clock"], ["4", "Floor tom", "Direct out &rarr; UMC1820 in 4 (Reaper 4)", "2 o'clock"], ["5", "Room L", "Direct out &rarr; UMC1820 in 5 (Reaper 5)", "Hard L"], ["6", "Room R", "Direct out &rarr; UMC1820 in 6 (Reaper 6)", "Hard R"], ["7", "Bass (DI out or mic)", "Direct out &rarr; UMC1820 in 7 (Reaper 7)", "Center"], ["8", "Magnatone (SM57)", "Direct out &rarr; UMC1820 in 8 (Reaper 8)", "10 o'clock"], ["9", "Marshall or Orange", "Direct out &rarr; ADA8200 in 1 (Reaper 9)", "2 o'clock"], ["10", "Lead vocal (Worker Bee)", "Direct out &rarr; ADA8200 in 2 (Reaper 10)", "Center"], ["11", "ATW-R3210 wireless", "Direct out &rarr; ADA8200 in 3 (Reaper 11)", "Center"], ["12-13", "Reface CS L/R", "Direct outs &rarr; ADA8200 in 4-5 (Reaper 12-13)", "Hard L / hard R"], ["14", "Trumpet (SM58)", "Direct out &rarr; ADA8200 in 6 (Reaper 14)", "1 o'clock"], ["15", "Vocal 2 (Peavey)", "Direct out &rarr; ADA8200 in 7 (Reaper 15)", "10 o'clock"], ["16", "Vocal 3 (Turner 95D)", "Direct out &rarr; ADA8200 in 8 (Reaper 16)", "2 o'clock"], ["17-18, 21", "SH-201 L/R, drum machine", "<b>Not recorded<\/b> in this layout (monitor only). See \"Recording more than 16\".", "As in the main map"], ["19-20, 23-24", "PV6, Tascam 246", "Monitor only, same as the main plan", "As in the main map"]]}, {"type": "h", "text": "Rewiring: what moves"}, {"type": "ul", "items": ["<b>White-tape snake (recording 1-8):<\/b> unplug its console end from GROUP OUTS 1-8 and plug the same tails, in the same color order, into the DIRECT OUTS of channels 1-8. The UMC1820 end doesn't move.", "<b>Blue-tape snake (direct outs to the ADA8200):<\/b> move its console tails from the direct outs of channels 10, 11, 14, 15, 16, 17, 18, 21 to the direct outs of channels <b>9-16<\/b>, in color order (brown = ch 9 through black = ch 16). The ADA8200 end doesn't move.", "<b>Playback does not move.<\/b> The black-tape and yellow-tape snakes stay on tape returns 1-16. Reaper track N now plays back on channel N's own tape return, which is how this console was designed to be used.", "Label the console ends with a second strip of tape (\"ALT A\") so nobody has to guess which layout is plugged in."]}, {"type": "h", "text": "Settings that change"}, {"type": "ul", "items": ["<b>Channel assign buttons:<\/b> on channels 1-16 press <b>L/R only<\/b>, no group buttons. The groups are no longer in the recording path; leave group faders down and the group L-R assign buttons up.", "<b>Channel faders 1-16 at U (unity), and leave them there while recording.<\/b> On the 24&bull;8 the direct out is taken after the EQ, the fader and the mute. Moving a fader changes the recorded level; muting a channel mutes its track. Set the level with the trim knob only, to -12 to -6 dBFS on Rea
