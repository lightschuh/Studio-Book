per's meters.", "<b>EQ is printed.<\/b> Whatever the channel EQ and LO CUT are doing goes onto the track. Keep it to corrective moves (LO CUT on vocals, a small cut where something's boomy) and save the real shaping for Reaper.", "<b>Inserts still work.<\/b> The 76-KT on a channel insert is recorded, because the insert sits ahead of the direct out in the channel.", "<b>Monitoring:<\/b> the hard-panned group issue goes away. With natural pans the control room and MONITOR headphones sound balanced without pressing MONO. Aux 3/4 performer mixes work the same as now.", "<b>Reaper:<\/b> save a second track template, \"Toad Studio tracking (direct)\", with tracks named in the order of the channel map above (track N = input N = console channel N). Outputs don't change.", "<b>UMC1820 and ADA8200:<\/b> same as now: gain knobs at minimum, UMC inputs 1-2 on LINE, not INST."]}, {"type": "h", "text": "Recording more than 16 at once"}, {"type": "ul", "items": ["This layout records 16 sources, one per track. The main plan squeezes 20 sources into 16 tracks by blending some on the groups. If a session needs the SH-201 or the drum machine, swap a blue snake tail for that session: for example move the tail from ch 15's direct out to ch 17's and from ch 16's to ch 18's, and the SH-201 records instead of vocals 2 and 3.", "Or run a hybrid for that session: put the white snake's last tails back on GROUP OUTS 7-8, assign the SH-201 (ch 17-18) to groups 7-8, and give up the bass and Magnatone tracks (or move them to group pairs too). Hybrids work but are easy to get confused by; write down which tails are where."]}, {"type": "h", "text": "Main plan vs Alternate A"}, {"type": "table", "head": ["", "Main plan (groups + direct outs)", "Alternate A (all direct outs)"], "rows": [["Sources recorded at once", "20 sources onto 16 tracks", "16 sources, one per track"], ["Drums", "Toms and room mics blended onto one stereo pair (groups 3-4); balance fixed at tracking", "Every drum mic on its own track; balance decided in the mix"], ["Two guitar amps", "Blended onto group 6", "Separate tracks (8 and 9)"], ["Noise", "Groups add the bus summing stage", "Skips the bus; possibly quieter (test it, below)"], ["Recording level set by", "Trim, channel fader and group fader", "Trim only (faders fixed at U)"], ["Headphone pans", "Group channels hard L/R; MONO often needed", "Natural pans; no MONO needed"], ["Setup effort", "As in the Setup Map", "Simpler: L/R assign only on every channel"], ["Best for", "Big band takes with everything going", "Up to 16 sources when you want to mix later"]]}, {"type": "h", "text": "How the direct outs behave on the 24&bull;8"}, {"type": "ul", "items": ["<b>After the EQ, fader and mute.<\/b> A direct out on this console is not a raw mic feed. Whatever the channel's EQ, fader and mute are doing is what gets recorded, so faders stay at U and nobody touches mutes during a take.", "<b>Unbalanced<\/b> (1/4\" TS). Fine at line level over the 20 ft snakes. Keep the snakes away from power cords; an unbalanced line picks up hum more easily than a balanced one.", "<b>Independent of the groups and the L/R mix.<\/b> The direct out works whether or not the channel is assigned anywhere, so the L/R assign is only for hearing the channel.", "<b>Noise.<\/b> Skipping the groups removes the bus summing stage from the recording path. Groups pick up a little hiss from every channel assigned to them, so a direct out can be quieter. How much depends on the console; the noise test below measures it."]}, {"type": "h", "text": "Where the computer comes back in"}, {"type": "ul", "items": ["<b>Playback goes to the tape returns, never to channel inputs.<\/b> The 24&bull;8 is an in-line console: every channel has a second path (Mix-B) fed by its own tape return. UMC1820 outputs 1-8 feed tape returns 1-8 and the ADA8200's outputs feed tape returns 9-16, exactly as in the main plan. That gives 16 playback tracks while all 24 channel inputs stay free for sources. Plugging playback into channel inputs (for example channels 17-24) would give only 8 playback tracks and take away the channels that hold the SH-201, PV6, drum machine and Tascam.", "In this layout the returns line up one to one: channel N records track N, and channel N's tape return plays track N back. Press MIX-B in the monitor section and raise MIX-B LEVEL to hear playback.", "<b>The groups don't reach the main mix unless asked.<\/b> A group feeds the L/R mix only when its L-R assign button in the master section is pressed. In this layout leave all eight up."]}, {"type": "h", "text": "Monitoring and latency"}, {"type": "ul", "items": ["<b>Headphones<\/b> plug into the console's PHONES jacks (Monitoring chapter). <b>Speakers<\/b> connect to CONTROL ROOM OUTPUTS L/R. Powered bookshelf speakers such as Edifiers need only a cable from 1/4\" TRS to their input (RCA or 3.5 mm on most models); turn CNTRL RM down before connecting them.", "<b>Zero latency for the performer.<\/b> The console sends each live mic straight to the headphones and speakers; the computer is not in that path.", "<b>Backing tracks and earlier takes come from the computer.<\/b> They play from Reaper through the tape returns, and new overdubs record into Reaper. Reaper shifts each recorded take back by the interface's latency so it lines up. This works as long as Reaper's input monitoring is off on the audio tracks (Reaper Setup, section 5)."]}, {"type": "h", "text": "The noise test (do this before deciding)"}, {"type": "ul", "items": ["Set up one mic, say the kick mic on ch 1, with the trim at its normal recording setting.", "Main-plan path: ch 1 assigned to group 1, group fader at U, recording on Reaper track 1. Record 15 seconds of silence (nobody playing, the mic connected).", "Alternate path: move the white snake's brown tail from GROUP OUT 1 to ch 1's DIRECT OUT, ch 1 assigned to L/R only, fader at U. Record another 15 seconds of silence on the same track.", "In Reaper, solo each clip, turn up the master and listen on headphones, and compare their peak readings (or run each through a plugin meter). A difference of 3 dB or more is real; less than that and the groups weren't the problem, and hiss is more likely coming from trim set too high or a noisy source.", "If the groups do turn out noisier, also try pressing in only the group buttons you need (unassign every unused channel from the groups) in the main plan. That alone lowers bus noise."]}, {"type": "h", "text": "Switching back"}, {"type": "ul", "items": ["Move the white snake back to GROUP OUTS 1-8 and the blue snake back to the direct outs of 10, 11, 14-18 and 21, re-press the group assign buttons from the Setup Map, and load the main Reaper template. Everything else in the book applies again unchanged."]}, {"type": "h", "text": "Alternate B: stereo playback (two outputs)"}, {"type": "p", "text": "Reaper plays the whole mix back to the console on two outputs instead of sixteen. The console still records all 16 inputs and still handles every live source and headphone mix; the mixing of recorded tracks happens in Reaper. Use it until the 6 ft playback snake is in place, or for good if you prefer to mix in the computer. It works with either the main plan or Alternate A."}, {"type": "h", "text": "Alternate B wiring"}, {"type": "ul", "items": ["UMC1820 outputs 1-2 (the MAIN OUT jacks) to <b>tape returns 1-2<\/b>, on the brown and red tails of the black-tape snake, which are already connected in the main plan. Nothing else is needed.", "Not used for playback: UMC1820 outputs 3-8, the ADA8200's outputs and the yellow-tape snake. The second optical cable (UMC1820 to ADA8200) is optional; with only one optical cable, set the ADA8200 to its internal clock and the UMC1820 to clock from optical (Setup Map).", "The UMC1820's front MAIN OUT knob controls outputs 1-2: keep it all the way up and use MIX-B LEVEL on the console as the playback volume."]}, {"type": "h", "text": "Alternate B settings"}, {"type": "ul", "items": ["<b>Reaper:<\/b> every track's output goes to the master only; master to outputs 1/2. This is the \"Mix playback\" mode in Reaper Setup, section 4.", "<b>Console:<\/b> press MIX-B in the monitor section and raise MIX-B LEVEL to hear the playback in the control room and on MONITOR headphones.", "<b>Performer headphone mixes:<\/b> on channels 1 and 2, press SOURCE on the aux 3/4 section so those two aux knobs send the tape return (the Reaper mix) instead of the live channel. Raise them to put the backing track in the aux 3/4 mix. Channels 1 and 2 still record their live mics normally; SOURCE changes only what the aux hears. Or set the phones source to MIX-B plus AUX SEND 3&amp;4.", "<b>Overdubs:<\/b> the same as always. The live source goes through the console to the headphones with no latency, the backing track comes from Reaper, and Reaper's input monitoring stays off on audio tracks."]}, {"type": "h", "text": "16-track vs stereo playback"}, {"type": "table", "head": ["", "16-track playback (main plan)", "Stereo playback (Alternate B)"], "rows": [["Cables", "Black and yellow snakes, 2 optical cables", "Two tails of the black snake"], ["Where recorded tracks are mixed", "On the console: each track on its own tape return, with MIX-B level, EQ and aux sends", "In Reaper, with plugins (Reaper Setup, section 7)"], ["TSR-12 and outboard on recorded tracks", "Per track, from the console", "On the whole mix only, or use Reaper plugins"], ["Backing track in headphones", "Any mix of tracks, set per track", "The Reaper mix as one stereo feed"], ["Best for", "Mixing on the console, analog summing, outboard on playback", "Writing, overdubs and mixing in the computer; fewer cables"]]}, {"type": "h", "text": "Moving to 16-track playback later"}, {"type": "ul", "items": ["Connect UMC1820 outputs 3-8 to tape returns 3-8 (the rest of the black snake), the second optical cable, and the ADA8200's outputs to tape returns 9-16 on the 6 ft snake. In Reaper, send each track to its own output as in the main template. Stereo playback still works at any time by sending tracks to the master only."]}, {"type": "h", "text": "Alternate Setups: Connection Diagram"}, {"type": "img", "src": "img/alternate-setups-5.png", "title": "Alternate Setups: Connection Diagram", "alt": "Alternate Setups: Connection Diagram Alternate A recording (all direct outs) with Alternate B playback (two outputs). Dashed lines are only for 16-track playback. Mackie 248 console Ch 1-8 Kick, snare, toms, room L/R, bass, Magnatone Ch 9-16 Marshall/Orange, lead vocal, wireless, Reface L/R, trumpet, vocals 2-3 Ch 17-24 SH-201, PV6, drum machine, Tascam: monitor only in Alternate A Direct outs 1-8 Direct outs 9-16 Tape returns 1-2 (MIX-B) Tape returns 3-16 Control room out L/R Ch 1-16: L/R assign only, faders at U Groups not used: faders down, L-R up Pans set the headphones only Press MIX-B to hear Reaper Behringer UMC1820 Inputs 1-8 = Reaper 1-8 Outs 1-2 = MAIN OUT (knob full up) Outs 3-8: 16-track playback only Behringer ADA8200 Line ins 1-8 = Reaper 9-16 Gain knobs at minimum XLR outs: 16-track playback only Computer: Reaper Track N = input N = channel N All tracks to master; master to outs 1/2 RACK Recording snake (white tape) Direct outs 1-8 to inputs 1-8 Direct-out snake (blue tape) Direct outs 9-16 to ADA8200 ins 1-8 Optical (recording) Optical (playback) USB Playback snake (black tape) Brown + red tails only: outs 1-2 to tape returns 1-2 16-track only: outs 3-8 to returns 3-8, ADA outs to returns 9-16 (6 ft snake) Speakers Powered (e.g. Edifier), or Peavey 260 + DIY monitors Phones 1 MONITOR, or MIX-B + AUX 3&4 Phones 2 Performer: AUX SEND 3&4 Backing track in a performer mix Ch 1-2: press SOURCE on aux 3/4, raise those two aux knobs Recording snake Direct-out snake Playback snake ADA playback snake Single cable Only for 16-track playback (not used in Alternate B)"}]}, {"id": "equipment", "title": "Studio Equipment List", "desc": "Everything you own", "group": "Gear", "blocks": [{"type": "lead", "text": "Everything you own. Updated October 2026."}, {"type": "h", "text": "Recording and mixing"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Mackie", "24&bull;8", "8-bus analog console, with meter bridge and 220W power supply"], ["Behringer", "U-Phoria UMC1820", "Audio interface"], ["Behringer", "Ultragain Digital ADA8200", "8-channel mic preamp / ADAT expander"], ["Peavey", "PV6", "Mixer (monitor submixer: e-drums, SamplePad 4, DJ)"], ["Tascam", "246 Portastudio", "4-track cassette recorder (in repair)"], ["DigiTech", "TSR-12", "Rack effects processor"], ["Monoprice", "8-channel TRS snake (2), 20 ft", "Snake cables"], ["&mdash;", "8-channel snake, 3 ft", "Snake cable (swapping for 6 ft)"], ["&mdash;", "Rolling rack", "Equipment rack under the desk"], ["Cockos", "Reaper", "DAW (desktop PC)"]]}, {"type": "h", "text": "Power"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Furman", "Merit Series M-8x2", "Rackmount power conditioner (won on eBay, on its way)"]]}, {"type": "h", "text": "Monitoring"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Peavey", "260 Stereo Booster Amplifier", "Vintage stereo power amp (for the DIY monitors)"], ["Sony", "MDR-7506", "Closed-back headphones (used)"], ["Sennheiser", "HD 280 Pro", "Closed-back headphones (used)"]]}, {"type": "h", "text": "PA / powered mixers"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Phonic", "Powerpod 410", "Powered mixer / PA"], ["Yamaha", "EMX62M", "Powered mixer"]]}, {"type": "h", "text": "Microphones and wireless"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Neat", "Worker Bee", "Condenser microphone"], ["Shure", "SM57", "Dynamic microphone"], ["Shure", "SM58", "Dynamic microphone"], ["&mdash;", "SM58-style (3)", "Dynamic microphones"], ["Peavey", "&mdash;", "Dynamic microphone (came with PA)"], ["Turner", "95D", "Vintage dynamic microphone"], ["&mdash;", "&mdash;", "Snare, kick, and room mics"], ["Audio-Technica", "ATW-R3210", "UHF diversity wireless receiver"], ["Audio-Technica", "ATW-T3201", "Body-pack transmitter"], ["Behringer", "PS400 Micro Power", "Phantom power supply (not needed with the 24&bull;8)"]]}, {"type": "h", "text": "Amplifiers"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Magnatone", "M10 Custom", "Tube guitar amp"], ["Marshall", "MG250DFX", "2x12 guitar combo amp"], ["Orange", "&mdash;", "Guitar amp"], ["Fender", "&mdash;", "Bass amp"]]}, {"type": "h", "text": "Guitars"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Silvertone", "ET-230 style (1960s)", "Electric guitar"], ["Schecter", "&mdash; (7-string, white)", "Electric guitar"], ["&mdash;", "&mdash;", "Acoustic guitar"]]}, {"type": "h", "text": "Keys, drums and electronics"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Yamaha", "Reface CS", "Synthesizer"], ["Roland", "SH-201", "Synthesizer"], ["Roland", "&mdash; (1970s)", "Drum machine"], ["Roland", "&mdash;", "Electronic drum module + 1 pad"], ["Alesis", "SamplePad 4", "Percussion pad"], ["&mdash;", "&mdash;", "DJ setup"], ["&mdash;", "&mdash;", "Drum kit: kick, 14\" snare, 13\" rack tom, 16\" floor tom"], ["Overtone Labs", "Tune-bot", "Drum tuner"]]}, {"type": "h", "text": "Pedalboard"}, {"type": "table", "head": ["Make", "Model", "Type"], "rows": [["Electro-Harmonix", "720", "Stereo looper"], ["Electro-Harmonix", "Big Muff", "Fuzz"], ["Electro-Harmonix", "Cock Fight Plus", "Talking wah / fuzz"], ["Death By Audio", "Exploding Head", "Pedal"], ["&mdash;", "La Grotte", "Pedal"], ["JHS", "&mdash;", "Gain pedal"]]}, {"type": "note", "text": "Not listed yet: the second pedalboard on the amp cart, and the makes and models marked with a dash. Send those and they'll be filled in."}]}, {"id": "needs", "title": "Studio Gear Needs List", "desc": "What's still missing, with prices", "group": "Gear", "blocks": [{"type": "lead", "text": "Checked against your Studio Equipment List (October 2026): only what's still missing. Low = budget, used, or lowest common price; High = new or bundle price. Tax and shipping not included."}, {"type": "h", "text": "Studio essentials"}, {"type": "table", "head": ["Item", "Suggested model", "Qty", "Low", "High", "Notes"], "rows": [["Ear pads: Sony MDR-7506", "Genuine Sony or aftermarket (Brainwavz, Wicked Cushions, GEVO)", "1 pair", "$12", "$22", "Aftermarket around $12 to $17; genuine Sony about $16 to $22."], ["Ear pads: Sennheiser HD 280 Pro", "Genuine Sennheiser pad kit or aftermarket", "1 set", "$10", "$25", "Aftermarket pairs around $10 to $15. Genuine kit (ear + headband pads) about $24, fits 2016 and newer units."], ["XLR cables", "15-20 ft for drums, amps and trumpet; 25 ft for vocals and room mics", "Up to 15", "$90", "$150", "Estimate for budget cables. The channel map uses 14 mic lines plus 1 spare; subtract any you already own."], ["Optical (TOSLINK) cable", "Any standard TOSLINK cable, 3-6 ft", "1", "$8", "$15", "Estimate. UMC1820 ADAT out to ADA8200 ADAT in, for 16-track playback and clock. Add one more if you don't have the ADA8200-to-UMC1820 cable yet."], ["Third 8-channel TRS snake", "Monoprice (to match yours) or Hosa CSS-801 / CSS-803", "1", "$43", "$56", "Direct outs from ch 10-11, 14-18 and 21 to the ADA8200 (all 8 tails). Eight single TRS cables also work. The two Hosa snakes in Cory's listing ($20 each) could cover this."], ["Subtotal", "", "", "$163", "$268", ""]]}, {"type": "h", "text": "For the Tame Impala sound"}, {"type": "table", "head": ["Item", "Suggested model", "Qty", "Low", "High", "Notes"], "rows": [["FET compressor", "Klark Teknik 76-KT", "1", "$135", "$209", "$209 new; around $135 used. 1176-style, for squashed drums and vocals. Two dbx 1066s from Cory's listing ($150 each) are the alternative."], ["Insert (Y) cables", "TRS to dual TS insert cable", "2", "$20", "$40", "Estimate. One connects the 76-KT to a channel insert on the 24&bull;8; the second is a spare. Four channels of compression would need 4; add 4 more for the gate."], ["Vibrato pedal", "Diamond Vibrato (reissue)", "1", "$249", "$279", "About $249 to $279 new. The pedal Parker used on most Lonerism guitars. Needs a 9-18V supply; check whether one is included."], ["Phaser pedal", "MXR Phase 90", "1", "$100", "$100", "$99.99 new; often cheaper used. Needs a 9V adapter or battery."], ["Subtotal", "", "", "$504", "$628", ""]]}, {"type": "h", "text": "Monitoring and recording extras"}, {"type": "table", "head": ["Item", "Suggested model", "Qty", "Low", "High", "Notes"], "rows": [["DIY passive monitor kit (pair)", "Parts Express C-Note MT kit, or the Hitmaker MT studio monitor kit", "1 pair", "$160", "$250", "C-Note pair with knock-down cabinets about $159.98; drivers, crossovers and cabinets included. Upper figure is an estimate for the Hitmaker. Check the impedance against the Peavey 260's rating."], ["Peavey 260 tech check", "Local amp tech", "1", "$60", "$150", "Rough estimate: clean controls, check capacitors, fit a grounded 3-prong plug if it has a 2-prong."], ["Line cables to the Peavey 260", "1/4\" TRS (console) to 1/4\" TS (amp)", "2", "$15", "$30", "Estimate. CONTROL ROOM out L/R to Peavey channels A and B."], ["Speaker cable", "Real speaker cable, length to suit", "2", "$15", "$30", "Estimate. Peavey outputs to the DIY monitors. Never instrument cables."], ["DI box", "Radial ProDI", "1", "$80", "$129", "About $80 used, around $129 new. Passive, with a -15dB pad and ground lift. Clean guitar/bass track for re-amping; acoustic with a pickup."], ["Rack shelf for the computer", "2U vented rack shelf (on order)", "1", "$20", "$40", "Estimate. Holds the PC in the rack above the Furman. A lip or strap so it can't slide when the rack rolls."], ["Monitor swing arm", "Desk-clamp monitor arm, VESA", "1", "$25", "$60", "Estimate. Clamps to the desk right of the console; keeps the screen off the console surface."], ["Speaker clamp mounts", "Pair of desk-edge clamp speaker brackets, or a DIY wood bracket", "1 pair", "$20", "$60", "Estimate. Mount the DIY monitors on the back edge of the desk, tweeters at ear height."], ["Reference cable", "3.5mm to dual RCA", "1", "$5", "$12", "Estimate. Phone or computer into the 2-TK input to A/B against reference tracks."], ["Subtotal", "", "", "$400", "$761", ""]]}, {"type": "note", "text": "<b>Budget DI alternative:<\/b> Behringer DI400P, about $30 new. Pick one DI or the other; totals use the Radial ProDI."}, {"type": "h", "text": "Only if needed"}, {"type": "table", "head": ["Item", "Suggested model", "Qty", "Low", "High", "Notes"], "rows": [["Delay / second effects unit", "Used rack delay or multi-effects, e.g. TC Electronic D-Two, Boss RV/DD rack units, or a second TSR-12", "1", "$60", "$200", "Estimate. Aux send 2 to its input, outputs to aux return 2. Takes the rack slot the headphone amp would have used."], ["Personal headphone mixers", "Small 4-channel mixers with a headphone jack (Behringer Xenyx 502 class), one per extra player", "1-3", "$30", "$60", "Estimate, each. Fed from aux sends 3-6; each one doubles as that player's headphone amp. Replaces a rack headphone amp."], ["XLR-female to TRS-male adapters", "Any brand", "8", "$15", "$30", "Estimate. Only if the 6 ft snake from Todd is TRS on both ends (ADA8200 outputs are XLR)."], ["Subtotal", "", "", "$105", "$290", ""]]}, {"type": "h", "text": "Compressor alternatives and gate option (not in the totals)"}, {"type": "p", "text": "Decision: the 76-KT is the primary compressor and is in the totals above. These are the alternatives seen on Facebook Marketplace, kept here in case a 76-KT doesn't turn up or you want four channels later. Prices are the listed asking prices."}, {"type": "table", "head": ["Item", "Suggested model", "Qty", "Low", "High", "Notes"], "rows": [["Alternative B: two dbx 266XS", "Drew's Facebook listing", "1 pair", "$110", "$110", "Four channels of clean compression plus a gate on each, for less than one 1066. Covers the drum pair (linked), lead vocal and bass. Doesn't give the 1176 crunch; the 76-KT or ReaComp still does that. Test every channel and gain-reduction meter."], ["Alternative C: two dbx 1066", "Cory's Facebook listing", "1 pair", "$300", "$300", "Same four channels, better built. Only worth it over the 266XS pair if the price comes down."], ["Quad noise gate", "Klark Teknik DN514+ (Facebook, $100, free shipping)", "1", "$100", "$100", "Fair price. Four channels on the inserts of kick, snare and both toms; cuts ring and cymbal bleed before it's recorded. Reaper can gate for free afterwards, so this is a convenience, not a must. Needs 4 insert Y cables."], ["Subtotal", "", "", "$510", "$510", ""]]}, {"type": "h", "text": "Totals"}, {"type": "table", "head": ["Estimated total", "Low", "High"], "rows": [["Studio essentials", "$163", "$268"], ["Essentials + Tame Impala sound", "$667", "$896"], ["Essentials + Tame Impala + monitoring extras", "$1,067", "$1,657"], ["Everything, including only-if-needed items", "$1,172", "$1,947"]]}, {"type": "note", "text": "The Goal Studio Diagram on the next page shows where every item above plugs in once it's bought."}, {"type": "h", "text": "What's not on the list, and why"}, {"type": "table", "head": ["Not on the list", "Why"], "rows": [["Audio interface", "You have the Behringer UMC1820, plus the ADA8200 for 8 more inputs."], ["Second 8-channel snake", "You have two 20 ft snakes: one for recording, one for playback."], ["Furman M-8x2 power conditioner", "Won on eBay; on its way."], ["Rack", "You have the rolling rack under the desk."], ["Power amp (Crown)", "Not needed: the Peavey 260 stereo power amp drives the DIY passive monitors."], ["Powered monitors (JBL 305P MkII)", "Replaced by the Peavey 260 + DIY passive monitors. Still the plug-and-play backup: $169 each new, about $80-124 used."], ["Graphic EQ (dbx 231)", "For correcting PA speakers and rooms, not studio recording; console EQ and ReaEQ cover it. Maybe for the garage PA."], ["Mic preamp", "Not needed: the 24&bull;8 has 24 preamps, plus 8 on the ADA8200."], ["More microphones, SM57s", "Every mic position is covered (SM57, SM58, 3 SM58-style, Peavey, Turner 95D, Worker Bee, drum and room mics). Another SM57 is the first add if you want one."], ["AT2020 condenser", "You have the Neat Worker Bee."], ["Lexicon MX200 reverb", "Your DigiTech TSR-12 covers reverb and delay on an aux send."], ["dbx 166XS compressor", "Replaced by the 76-KT, which suits the drum sound better. Reaper's free ReaComp covers the mix bus."], ["Mic stands", "Add stands only if you're short."], ["Patchbay and patch cables", "Nice to have, not needed to get started. Two are in Cory's listing at $20 each."], ["Headphones", "A used Sony MDR-7506 and Sennheiser HD 280 Pro at $40 each. Only replacement pads are listed."], ["Rack headphone amp (HA8000)", "Dropped to keep the rack slot for a delay unit. Personal mixers at the players' spots do the job and don't need rack space."], ["Fuzz Face, pedal power supply", "The Big Muff on your pedalboard covers fuzz. The Diamond Vibrato and Phase 90 still need their own supplies."]]}, {"type": "note", "text": "Notes: Prices come from major retailers and used-market listings and change often. Items marked \"Estimate\" were not priced from a specific listing. The Tascam 246 repair isn't included. The Behringer PS400 isn't needed with the 24&bull;8, which has built-in phantom power."}]}, {"id": "goal", "title": "Goal Studio Diagram", "desc": "Where every planned purchase plugs in", "group": "Gear", "blocks": [{"type": "img", "src": "img/goal-1.png", "title": "Goal Studio: Everything on the Needs List Connected", "alt": "Goal Studio: Everything on the Needs List Connected Where each planned purchase plugs in. Orange dashed = on the needs list. Navy solid = already in the studio. Mackie 248 console Mic inputs Line inputs Phones 1 / 2 2-TK in Aux sends 3-6 Channel inserts Group outs 1-8 Direct outs Tape returns 1-16 Aux 1 send / return Aux 2 send / return Control room out Mics, amps, synths, PV6 Everything you record or hear today (channel list in the Setup Map) XLR x15 (planned) Guitar pedals (planned) Diamond Vibrato + MXR Phase 90 after the pedalboard, then the amp mic Radial ProDI (planned) Guitar or bass > DI > a mic input thru jack carries on to the amp Headphone pads (planned) MDR-7506 + HD 280 Pro into Phones 1 and 2 Reference cable (planned) Phone or computer, 3.5mm to RCA into the 2-TK input; press 2-TK Personal mixers (planned) one per extra player, fed from aux sends 3-6 Klark Teknik 76-KT (planned) alt: 2 x dbx 266XS or 1066 inserts: drums, vocal, bass Quad gate (option) DN514+ on inserts of ch 1-4 UMC1820 + ADA8200 Reaper inputs 1-16, playback 1-16 2nd optical cable (planned) 3rd snake + 6 ft snake (planned) Recording snake Third snake (planned) Playback 1-8; 9-16 planned DigiTech TSR-12 Reverb on aux 1 / return 1 Delay unit (future) Aux 2 / return 2 second effects unit or a pedal Patchbay (planned) Inserts, compressor ins/outs, groups 7-8 swaps. 2 in Cory's listing in the rack, between the console and the gear above Furman M-8x2 (on its way) Console power supply, rack gear and the Peavey all plug in here Peavey 260 tech check (planned) TRS-to-TS in control room out DIY monitors (planned) Parts Express C-Note or Hitmaker kit speaker cable Owned On the needs list / planned"}]}, {"id": "values", "title": "Studio Equipment Values", "desc": "Rough used-market value, with totals", "group": "Gear", "blocks": [{"type": "lead", "text": "Rough used-market estimates, October 2026. Low = quick private sale or rough condition; High = good condition, patient sale. The computer and the second pedalboard aren't included."}, {"type": "h", "text": "Console, rack and recording"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Mackie 24&bull;8 with meter bridge and 220W power supply", "$600", "$1,200", "A refurbished 24x8x2 + power supply bundle was listed at $1,199.99 by a vintage dealer; private sales run lower."], ["Behringer UMC1820", "$150", "$200", ""], ["Behringer ADA8200", "$150", "$200", ""], ["DigiTech TSR-12", "$50", "$100", ""], ["Furman M-8x2", "$60", "$90", "Won on eBay."], ["Peavey PV6", "$40", "$80", ""], ["Tascam 246 Portastudio (not playing tape)", "$75", "$150", "Worth noticeably more once repaired."], ["Snakes: 2 x 20 ft TRS, 1 x 3 ft", "$70", "$100", ""], ["Rolling rack", "$50", "$100", ""], ["Subtotal", "$1,245", "$2,220", ""]]}, {"type": "h", "text": "Amplifiers"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Magnatone M10 Custom", "$600", "$1,100", "Equipboard average about $740; a 1965 M10A in excellent working condition was listed at $1,349.99."], ["Marshall MG250DFX (2x12 combo)", "$200", "$300", "Solid-state stereo combo."], ["Fender bass amp and Orange guitar amp", "$250", "$900", "Models unknown; the biggest swing in this category."], ["Peavey 260 Stereo Booster Amplifier (1970s)", "$75", "$175", "Rough estimate; untested vintage power amp."], ["Subtotal", "$1,125", "$2,475", ""]]}, {"type": "h", "text": "Guitars"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Silvertone ET-230 style (1960s, likely Teisco-made)", "$300", "$800", "Teisco built guitars for Sears' Silvertone line; the ET-230 is the 1960s Teisco \"sharkfin\" design. Originality and condition drive the price."], ["Schecter 7-string (white)", "$200", "$350", "Exact model unknown."], ["Acoustic guitar", "$100", "$400", "Brand and model unknown."], ["Subtotal", "$600", "$1,550", ""]]}, {"type": "h", "text": "Synths, drums and electronics"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Yamaha Reface CS", "$250", "$330", ""], ["Roland SH-201", "$350", "$500", "Equipboard average about $395; a used one from Japan listed on eBay at $494."], ["1970s Roland drum machine", "$300", "$2,000", "Model unknown. A CR-78 is the high end."], ["Roland e-drum module + 1 pad", "$50", "$150", ""], ["Alesis SamplePad 4", "$80", "$120", ""], ["DJ setup", "$200", "$800", "Brands and models unknown."], ["Drum kit (kick, 14\" snare, 13\" and 16\" toms)", "$200", "$500", ""], ["Overtone Labs Tune-bot", "$50", "$80", ""], ["Subtotal", "$1,480", "$4,480", ""]]}, {"type": "h", "text": "Microphones, wireless and headphones"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Neat Worker Bee", "$80", "$120", ""], ["Audio-Technica ATW-R3210 + ATW-T3201", "$150", "$250", ""], ["Shure SM57", "$60", "$75", ""], ["Shure SM58", "$60", "$75", ""], ["SM58-style mics (3)", "$30", "$60", ""], ["Peavey mic", "$15", "$30", ""], ["Turner 95D (vintage)", "$50", "$150", ""], ["Kick, snare and room mics", "$50", "$150", "Models unknown."], ["Behringer PS400", "$15", "$25", ""], ["Sony MDR-7506 + Sennheiser HD 280 Pro (used)", "$80", "$100", "Priced at $40 each; both need pads."], ["Subtotal", "$590", "$1,035", ""]]}, {"type": "h", "text": "Pedalboard"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Electro-Harmonix 720 looper", "$100", "$140", ""], ["Electro-Harmonix Big Muff", "$50", "$80", ""], ["Electro-Harmonix Cock Fight Plus", "$100", "$140", ""], ["Death By Audio Exploding Head", "$120", "$200", ""], ["La Grotte", "$100", "$200", ""], ["JHS gain pedal", "$100", "$180", ""], ["Subtotal", "$570", "$940", ""]]}, {"type": "h", "text": "Powered PA mixers"}, {"type": "table", "head": ["Item", "Low", "High", "Notes"], "rows": [["Phonic Powerpod 410", "$100", "$200", ""], ["Yamaha EMX62M", "$100", "$180", ""], ["Subtotal", "$200", "$380", ""]]}, {"type": "h", "text": "Totals"}, {"type": "table", "head": ["Category", "Low", "High"], "rows": [["Console, rack and recording", "$1,245", "$2,220"], ["Amplifiers", "$1,125", "$2,475"], ["Guitars", "$600", "$1,550"], ["Synths, drums and electronics", "$1,480", "$4,480"], ["Microphones, wireless and headphones", "$590", "$1,035"], ["Pedalboard", "$570", "$940"], ["Powered PA mixers", "$200", "$380"], ["Total", "$5,810", "$13,080"]]}, {"type": "note", "text": "Most likely value: around the middle of the range. The widest swings come from the drum machine model, the Fender and Orange amp models, the Silvertone, the DJ setup and the acoustic guitar. Replacing everything new would cost much more, probably $12,000-20,000+."}, {"type": "note", "text": "For insurance: photograph each piece and record serial numbers. Researched prices (Mackie, Magnatone, SH-201) and the Silvertone/Teisco background come from dealer listings, eBay and Equipboard; all other figures are rough estimates, and prices change often."}]}, {"id": "how-it-works", "title": "How Each Piece Works", "desc": "What each piece of gear does and how it connects", "group": "Gear", "blocks": [{"type": "lead", "text": "What each piece of your gear does and how it connects to the Mackie 24&bull;8. For exact channel numbers and cables, see the Studio Setup Map."}, {"type": "h", "text": "How it all connects"}, {"type": "table", "head": ["Signal", "From", "To"], "rows": [["Mics and instruments", "Mics (XLR), synths and mixers (1/4\")", "Console mic and line inputs"], ["Recording 1-8", "Group outs 1-8", "UMC1820 inputs 1-8 (white-tape snake)"], ["Recording 9-16", "Direct outs of ch 10-11, 14-18, 21", "ADA8200 line ins 1-8 (blue-tape snake), then optical to the UMC1820"], ["Playback 1-8", "UMC1820 outputs 1-8", "Tape returns 1-8 (black-tape snake)"], ["Playback 9-16", "ADA8200 outputs 1-8", "Tape returns 9-16 (yellow-tape snake)"], ["Your monitoring", "Control room outs L/R; Phones 1 and 2", "Peavey 260 and DIY monitors; headphones"], ["Performer mix", "Aux sends 3-6 (PRE down)", "Phones 2, or personal mixers at each player"], ["Effects", "Aux send 1 (PRE up)", "TSR-12 input; its outputs to aux return 1"], ["Dynamics", "Channel insert (Y cable)", "Compressor in and out"], ["Tape", "Main mix out L/R", "Tascam 246 line inputs; its line outs to ch 23-24"], ["Power", "Wall outlet", "Furman M-8x2, then all gear"]]}, {"type": "h", "text": "Recording"}, {"type": "card", "title": "<b>Audio interface<\/b> &nbsp; Behringer UMC1820", "fields": [["Purpose", "Turns the console's analog signals into digital audio so you can record, edit and mix in Reaper, then sends audio back out to the board."], ["How it works", "Eight analog inputs (1-2 on the front, 3-8 on the back) and ten analog outputs. Outputs 1-2 are the MAIN OUT jacks, which follow the front MAIN OUT knob. It connects to the computer by USB and has optical (ADAT) in and out plus MIDI in and out."], ["Setup with the 24&bull;8", "Group outs 1-8 go to inputs 1-8. Set the inputs to LINE with gain at minimum and do the gain staging on the console. Outputs 1-8 go to tape returns 1-8 so Reaper playback comes back through the board; keep the MAIN OUT knob all the way up."]]}, {"type": "card", "title": "<b>Input/output expander<\/b> &nbsp; Behringer ADA8200", "fields": [["Purpose", "Adds eight more inputs and eight more outputs to the UMC1820 over optical cables, for 16 tracks in and 16 out."], ["How it works", "Eight mic/line inputs on the front and eight XLR outputs on the back. One optical cable carries its 8 inputs to the UMC1820; a second carries 8 Reaper outputs back to it. ADAT carries 8 channels at 44.1 or 48 kHz and only 4 at 88.2 or 96 kHz."], ["Setup with the 24&bull;8", "Direct outs from channels 10, 11, 14-18 and 21 feed its line inputs with the gain knobs at minimum. Its XLR outputs feed tape returns 9-16. The two units have to share one clock: see the Setup Map for the SYNC settings."]]}, {"type": "card", "title": "<b>8-channel snakes<\/b> &nbsp; 2 x 20 ft TRS owned; a third TRS and a 6 ft snake to come", "fields": [["Purpose", "Carry eight line-level signals in one bundled cable, which keeps the back of the console organized."], ["How it works", "Eight color-coded tails on each end. Yours aren't numbered, so the color order is the numbering: brown, red, yellow, green, blue, gray, white, black."], ["Setup with the 24&bull;8", "One snake per job, marked with tape near both ends: white for recording, black for playback 1-8, blue for direct outs, yellow for ADA8200 playback 9-16. Coil extra length loosely and keep it away from power cords and the console's power supply."]]}, {"type": "h", "text": "Monitoring"}, {"type": "card", "title": "<b>Power amp and monitors<\/b> &nbsp; Peavey 260 Stereo Booster Amplifier + DIY passive speakers", "fields": [["Purpose", "Give you speakers to mix on, so mixes translate to cars, earbuds and other systems. Right now all mixing is on headphones."], ["How it works", "The Peavey is a 1970s stereo power amp: it makes a line-level signal strong enough to drive passive speakers. It has no preamp or tone controls. The speakers come from a kit (drivers, crossovers and cabinets)."], ["Setup with the 24&bull;8", "CONTROL ROOM out L/R to the Peavey's channel A and B inputs, then real speaker cable to the speakers. Have a tech check the amp first, and match the speakers' impedance to the minimum on its back panel. The CNTRL RM knob is your volume. Place the speakers and your head in an equal-sided triangle with the tweeters at ear height."]]}, {"type": "card", "title": "<b>Closed-back headphones<\/b> &nbsp; Sony MDR-7506 and Sennheiser HD 280 Pro", "fields": [["Purpose", "Let people hear the mix while tracking without the sound leaking into open mics."], ["How it works", "Closed-back cups seal around the ear to block outside noise and keep sound in."], ["Setup with the 24&bull;8", "The console has two headphone outputs, PHONES 1 and PHONES 2, each with its own level knob and source buttons. Press MONITOR to hear the control room mix, or AUX SEND 3/4 for a separate performer mix."]]}, {"type": "card", "title": "<b>Personal headphone mixers (planned)<\/b> &nbsp; Small mixers with a headphone jack, one per extra player", "fields": [["Purpose", "Give each extra musician their own headphone volume and balance, without a rack headphone amp."], ["How it works", "A small mixer takes two or three aux sends from the console, each carrying a group of instruments, and the player blends them at their own spot and plugs headphones into the mixer."], ["Setup with the 24&bull;8", "Feed them from AUX SENDS 3-6 with PRE down, so the mixes don't change when you move channel faders. Up to two people still use the console's own PHONES 1 and 2."]]}, {"type": "h", "text": "Microphones"}, {"type": "card", "title": "<b>Dynamic mics<\/b> &nbsp; Shure SM57, SM58, three SM58-style, Peavey, Turner 95D", "fields": [["Purpose", "Rugged mics for loud sources: drums, guitar amps, trumpet and live-style vocals."], ["How it works", "Dynamic mics generate their own signal and don't need phantom power. They handle very loud sounds and pick up mostly from the front, which reduces bleed."], ["Setup with the 24&bull;8", "XLR into a channel mic input. For guitar amps, start an inch or two from the grille, aimed near the center of the speaker cone. The Turner is a vintage mic with its own connector and may be high impedance: check it before plugging in (see the Setup Map)."]]}, {"type": "card", "title": "<b>Condenser mic<\/b> &nbsp; Neat Worker Bee", "fields": [["Purpose", "Captures more detail and air than a dynamic mic: lead vocals and acoustic guitar."], ["How it works", "Condenser mics need +48V phantom power from the console. They're more sensitive than dynamics, so they pick up quieter sounds and more of the room."], ["Setup with the 24&bull;8", "XLR into channel 10, then switch on phantom power for channels 9-16. Turn the faders and monitors down before switching phantom on or off to avoid a loud pop. Record in a quiet, less echoey spot and use a pop filter for vocals."]]}, {"type": "card", "title": "<b>Wireless system<\/b> &nbsp; Audio-Technica ATW-R3210 receiver + ATW-T3201 body pack", "fields": [["Purpose", "Carries a mic or instrument to the console without a cable."], ["How it works", "The body pack transmits to the receiver, which puts out a normal balanced signal."], ["Setup with the 24&bull;8", "XLR from the receiver's output to channel 11. Set the receiver's output level before setting the channel trim."]]}, {"type": "card", "title": "<b>DI box (on the needs list)<\/b> &nbsp; Radial ProDI", "fields": [["Purpose", "Lets a guitar, bass or acoustic pickup plug straight into a console mic input."], ["How it works", "A transformer converts the instrument's weak, high-impedance signal to a balanced mic-level signal. A thru jack passes the instrument on to the amp, and a ground lift switch cures hum."], ["Setup with the 24&bull;8", "Instrument into the DI, thru jack to the amp, XLR out to a mic input. You get a clean track alongside the amp mic that can be re-amped later. Synths and drum machines don't need one."]]}, {"type": "h", "text": "Effects and processing"}, {"type": "card", "title": "<b>Reverb / multi-effects<\/b> &nbsp; DigiTech TSR-12", "fields": [["Purpose", "Adds space and depth (reverb, delay) so dry sounds don't feel flat in the headphones."], ["How it works", "A rack effects processor with stereo outputs. You pick a program and adjust it from the front panel."], ["Setup with the 24&bull;8", "AUX SEND 1 to its left input; its L/R outputs to AUX RETURN 1. Set its mix to 100% wet, since the console blends in the dry signal. Turn up aux 1 (PRE up) on each channel that needs the effect. It's in the monitor path only, so Reaper records dry."]]}, {"type": "card", "title": "<b>Compressor (on the needs list)<\/b> &nbsp; Klark Teknik 76-KT, or dbx 1066", "fields": [["Purpose", "Evens out volume swings so vocals, bass and drums sit steady, and gives drums the squashed 70s sound."], ["How it works", "Above the threshold it turns the signal down by the ratio; attack and release set how fast it reacts; output gain restores the level. The 76-KT is a single-channel, aggressive 1176-style unit. The dbx 1066 is two cleaner channels with gates."], ["Setup with the 24&bull;8", "Plug it into a channel's insert jack with an insert (Y) cable: the TRS end goes into the insert and the two other ends go to the compressor's input and output. On Mackie inserts, the tip is the send and the ring is the return. What it does is recorded."]]}, {"type": "card", "title": "<b>Patchbay (optional)<\/b> &nbsp; Two are in Cory's listing", "fields": [["Purpose", "Puts key connections on one front panel so you can reroute with short patch cables instead of reaching behind the console."], ["How it works", "Each channel has a top and bottom jack front and back. Normalled pairs stay connected until you plug in at the front."], ["Setup with the 24&bull;8", "Start small: channel inserts, the compressor's ins and outs, and the connections you swap most (groups 7-8 for the Reface or the Tascam). Label every point."]]}, {"type": "h", "text": "Other gear"}, {"type": "card", "title": "<b>Monitor submixer<\/b> &nbsp; Peavey PV6", "fields": [["Purpose", "Combines sources that only need to be heard (e-drum module, SamplePad 4, DJ mixer) into one stereo pair, saving console channels."], ["How it works", "A small mixer: each source gets a level control, and the main out carries the blend."], ["Setup with the 24&bull;8", "Main out to channels 19-20, panned left and right, L/R button only. Keep its gains and master at unity. Don't put anything through it that you want on its own track."]]}, {"type": "card", "title": "<b>4-track cassette<\/b> &nbsp; Tascam 246 Portastudio (in repair)", "fields": [["Purpose", "Analog tape recording and tape saturation."], ["How it works", "Records four tracks to cassette and has its own small mixer."], ["Setup with the 24&bull;8", "MAIN MIX out to two of its line inputs to record to tape; its stereo line out to channels 23-24 to hear it. Keep 23-24 out of the L/R mix while recording to tape. To move tape into Reaper, assign 23-24 to groups 7-8."]]}, {"type": "card", "title": "<b>Power conditioner<\/b> &nbsp; Furman M-8x2", "fields": [["Purpose", "Protects gear from surges and filters electrical noise that can show up as hum or buzz."], ["How it works", "A rackmount power strip with surge suppression and filtering. Its switch turns the whole rack on or off."], ["Setup with the 24&bull;8", "It sits just above the Mackie power supply with one empty space between. Plug the power supply, UMC1820, ADA8200 and outboard gear into it. Running everything from one conditioner on one circuit also helps prevent ground-loop hum."]]}, {"type": "card", "title": "<b>Rack<\/b> &nbsp; Rolling rack under the desk", "fields": [["Purpose", "Holds the rackmount gear and the console power supply in one ventilated place."], ["How it works", "Standard 19\" rails measured in rack units (1U = 1.75\")."], ["Setup with the 24&bull;8", "Top to bottom: UMC1820, ADA8200, TSR-12, 76-KT, delay unit, a shelf with the computer, Furman, Mackie power supply. The power supply goes at the bottom because it's heavy, runs warm and can put hum into nearby audio gear; the computer's shelf sits above it with air space on both sides."]]}, {"type": "h", "text": "Power-up and power-down"}, {"type": "table", "head": ["Power-up order", "Power-down order"], "rows": [["1. All levels down", "1. Save; all levels down"], ["2. Furman switch: console PSU, UMC1820, ADA8200, TSR-12, compressor, delay all come up", "2. Peavey 260 off"], ["3. Computer, then Reaper", "3. Close Reaper, shut the computer down"], ["4. Wait 20-30 seconds", "4. Furman switch off (everything on it goes down together)"], ["5. Peavey 260, on its own switch", "5. Leave the Furman plugged into the wall"], ["6. Bring levels up: CNTRL RM, Peavey, phones, main fader", ""]]}, {"type": "note", "text": "The speaker amp goes on last and off first so turn-on thumps from other gear never reach the speakers. The Peavey and the computer get their own wall outlets for that reason; everything else is on the Furman. Outlet-by-outlet detail is on the Power page."}, {"type": "h", "text": "Quick gain-staging checklist"}, {"type": "ul", "items": ["Trim down, fader at U, channel unmuted.", "Have the performer play or sing at full volume. Press SOLO and raise the trim until peaks regularly reach 0 on the L/R meters.", "Leave channel faders and group masters at U and check that Reaper peaks around -12 to -6 dBFS. Fix levels with the trim.", "Leave headroom: tape-style \"hot\" levels aren't needed when recording digitally.", "The control room and phones knobs set listening volume; they don't affect what gets recorded.", "The full version is in the Gain Staging Guide."]}]}], "cover": "img/cover.png"}</script>
<script>
(function () {
  const BOOK = JSON.parse(document.getElementById('book-data').textContent);
  const S = BOOK.sections;
  const $ = (s) => document.querySelector(s);
  const page = $('#page'), rail = $('#rail'), q = $('#q');
  const GROUPS = ['Overview', 'Setup', 'Sound', 'Recording', 'Gear'];
  const strip = (h) => { const d = document.createElement('div'); d.innerHTML = h; return d.textContent || ''; };
  const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  // ---------- contents rail ----------
  let n = 0;
  rail.innerHTML = GROUPS.map((g) => {
    const items = S.map((s, i) => [s, i]).filter(([s]) => s.group === g);
    if (!items.length) return '';
    return '<h3>' + g + '</h3>' + items.map(([s, i]) => '<a href="#' + s.id + '" data-id="' + s.id + '"><span class="n">' + String(i + 1).padStart(2, '0') + '</span><span>' + esc(s.title) + '</span></a>').join('');
  }).join('');

  // ---------- EQ strip drawing ----------
  const FREQ_HM = { '500': -1, '800': -0.85, '1k': -0.7, '2.5k': -0.2, '3k': -0.1, '4k': 0.1, '5k': 0.25 };
  const FREQ_LM = { '80': -0.9, '150': -0.6, '200': -0.45, '250': -0.35, '300': -0.25, '400': -0.1, '500': 0 };
  function knob(x, y, r, frac, label, value, moved) {
    const a = (90 - 150 * frac) * Math.PI / 180, col = moved ? 'var(--signal)' : 'var(--ink)';
    const tick = (f) => { const t = (90 - 150 * f) * Math.PI / 180; return '<line x1="' + (x + (r + 2) * Math.cos(t)) + '" y1="' + (y - (r + 2) * Math.sin(t)) + '" x2="' + (x + (r + 5) * Math.cos(t)) + '" y2="' + (y - (r + 5) * Math.sin(t)) + '" style="stroke:var(--muted)" stroke-width="1"/>'; };
    return tick(-1) + tick(0) + tick(1) +
      '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" style="fill:var(--bg);stroke:var(--muted)" stroke-width="1"/>' +
      '<line x1="' + x + '" y1="' + y + '" x2="' + (x + r * 0.85 * Math.cos(a)) + '" y2="' + (y - r * 0.85 * Math.sin(a)) + '" style="stroke:' + col + '" stroke-width="2.6" stroke-linecap="round"/>' +
      '<text x="' + x + '" y="' + (y - r - 7) + '" text-anchor="middle" font-size="9" font-weight="700" style="fill:' + col + '">' + esc(value) + '</text>' +
      '<text x="' + x + '" y="' + (y + r + 11) + '" text-anchor="middle" font-size="7.5" style="fill:var(--muted)">' + label + '</text>';
  }
  function btn(x, y, label, on) {
    return '<rect x="' + x + '" y="' + y + '" width="46" height="14" rx="2" style="fill:' + (on ? 'var(--signal)' : 'var(--surface)') + ';stroke:var(--muted)"/>' +
      '<text x="' + (x + 23) + '" y="' + (y + 10) + '" text-anchor="middle" font-size="7.5" font-weight="700" style="fill:' + (on ? 'var(--surface)' : 'var(--muted)') + '">' + label + (on ? ' ON' : ' off') + '</text>';
  }
  function eqStrip(r) {
    const [ch, name, locut, hi, hmf, hm, bw, lmf, lm, lo] = r;
    const g = (v) => Math.max(-1, Math.min(1, v / 15)), db = (v) => (v ? (v > 0 ? '+' : '') + v + ' dB' : '0');
    const flat = [hi, hm, lm, lo].every((v) => v === 0);
    let s = '<svg viewBox="0 0 110 300" role="img" aria-label="EQ for channel ' + ch + '">';
    s += btn(6, 4, 'LO CUT', locut) + btn(58, 4, 'EQ IN', !flat);
    s += knob(55, 54, 14, g(hi), 'HI 12k shelf', db(hi), hi !== 0);
    s += knob(30, 108, 10, FREQ_HM[hmf] ?? 0, 'HM freq', /k$/.test(hmf) ? hmf : hmf + ' Hz', true);
    s += knob(80, 108, 10, { wide: -0.8, med: 0, narrow: 0.8 }[bw], 'width', bw, bw !== 'med');
    s += knob(55, 160, 14, g(hm), 'HI MID gain', db(hm), hm !== 0);
    s += knob(30, 216, 10, FREQ_LM[lmf] ?? 0, 'LM freq', lmf + ' Hz', true);
    s += knob(80, 216, 10, g(lm), 'LM gain', db(lm), lm !== 0);
    s += knob(55, 268, 14, g(lo), 'LO 80 shelf', db(lo), lo !== 0);
    return '<div class="strip"><div class="ch">Ch ' + esc(String(ch)) + '</div><div class="nm">' + esc(name) + '</div>' + s + '</svg></div>';
  }

  // ---------- rendering ----------
  function blockHTML(b, id) {
    const a = ' class="blk" id="' + id + '"';
    switch (b.type) {
      case 'h': return '<h2' + a + '>' + b.text + '</h2>';
      case 'lead': return '<p' + a.replace('blk', 'blk lead') + '>' + b.text + '</p>';
      case 'note': return '<p' + a.replace('blk', 'blk note') + '>' + b.text + '</p>';
      case 'p': return '<p' + a + '>' + b.text + '</p>';
      case 'ul': return '<ul' + a + '>' + b.items.map((t) => '<li>' + t + '</li>').join('') + '</ul>';
      case 'table': {
        const cols = (b.head || b.rows[0] || []).length;
        return '<div' + a.replace('blk', 'blk tbl' + (cols > 3 ? ' wide' : '')) + '><table>' +
          (b.head ? '<thead><tr>' + b.head.map((h) => '<th>' + h + '</th>').join('') + '</tr></thead>' : '') +
          '<tbody>' + b.rows.map((r) => '<tr>' + r.map((c) => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
      }
      case 'card': return '<div' + a.replace('blk', 'blk card') + '><header>' + b.title + '</header><dl>' + b.fields.map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('') + '</dl></div>';
      case 'eq': return '<div' + a.replace('blk', 'blk eq') + '>' + b.rows.map(eqStrip).join('') + '</div>';
      case 'img': return '<figure' + a + '><div class="scroll"><img src="' + b.src + '" alt="' + esc(b.title) + '" loading="lazy"></div><figcaption>' + esc(b.title) + ' · tap the diagram to zoom</figcaption></figure>';
    }
    return '';
  }

  function setCurrent(id) {
    rail.querySelectorAll('a').forEach((x) => x.setAttribute('aria-current', x.dataset.id === id ? 'page' : 'false'));
  }

  function renderHome() {
    setCurrent('');
    const ex = ['TSR-12', 'phantom', 'aux 3/4', 'shutdown', 'Tascam', 'direct outs', 'Peavey 260', 'snake colors'];
    page.innerHTML =
      '<div class="home-hero"><div><div class="eyebrow">Mackie 24•8 home studio · revised ' + esc(BOOK.revised) + '</div>' +
      '<h1>The Studio Book</h1><p class="lead">Wiring, levels, routing and gear for Toad Studio, in ' + S.length + ' sections. Search anything from a knob name to a cable color, or open a section from the contents.</p>' +
      '<div class="chips">' + ex.map((e) => '<button class="chip" data-q="' + esc(e) + '">' + esc(e) + '</button>').join('') + '</div></div>' +
      '<img src="' + BOOK.cover + '" alt="Toad Studio desk, console and rack illustration"></div>' +
      '<div class="groups">' + GROUPS.map((g) => {
        const items = S.filter((s) => s.group === g);
        return items.length ? '<div class="group"><h3>' + g + '</h3><div class="tiles">' + items.map((s) => '<a class="tile" href="#' + s.id + '"><b>' + esc(s.title) + '</b><span>' + esc(s.desc) + '</span></a>').join('') + '</div></div>' : '';
      }).join('') + '</div>';
    page.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => { q.value = c.dataset.q; runSearch(); q.focus(); }));
  }

  function renderSection(id, target) {
    const i = S.findIndex((s) => s.id === id);
    if (i < 0) return renderHome();
    const s = S[i];
    setCurrent(id);
    const prev = S[i - 1], next = S[i + 1];
    page.innerHTML = '<div class="eyebrow">' + String(i + 1).padStart(2, '0') + ' · ' + s.group + '</div><h1>' + esc(s.title) + '</h1>' +
      s.blocks.map((b, k) => blockHTML(b, s.id + '-' + k)).join('') +
      '<div class="pager">' + (prev ? '<a href="#' + prev.id + '"><small>Previous</small>' + esc(prev.title) + '</a>' : '<span></span>') +
      (next ? '<a href="#' + next.id + '" style="text-align:right"><small>Next</small>' + esc(next.title) + '</a>' : '') + '</div>';
    page.querySelectorAll('figure img').forEach((im) => im.addEventListener('click', () => im.closest('figure').classList.toggle('zoom')));
    store.set('toad-last', id);
    if (target) {
      const el = document.getElementById(target);
      if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1800); highlightIn(el); }
    } else window.scrollTo(0, 0);
  }

  // ---------- search ----------
  const INDEX = [];
  S.forEach((s) => {
    let head = '';
    s.blocks.forEach((b, k) => {
      let t = '';
      if (b.type === 'h') { head = strip(b.text); t = head; }
      else if (b.type === 'ul') t = b.items.map(strip).join(' • ');
      else if (b.type === 'table') t = [(b.head || []).join(' | ')].concat(b.rows.map((r) => r.map(strip).join(' | '))).join(' / ');
      else if (b.type === 'card') t = strip(b.title) + ' — ' + b.fields.map(([k2, v]) => strip(k2) + ': ' + strip(v)).join(' ');
      else if (b.type === 'eq') t = b.rows.map((r) => 'Ch ' + r[0] + ' ' + r[1] + ' EQ: HI ' + r[3] + ', HI MID ' + r[4] + ' ' + r[6] + ' ' + r[5] + ', LO MID ' + r[7] + ' ' + r[8] + ', LO ' + r[9] + (r[2] ? ', LO CUT on' : '')).join(' / ');
      else if (b.type === 'img') t = b.title + ' ' + b.alt;
      else t = strip(b.text || '');
      t = t.replace(/\s+/g, ' ').trim();
      if (t) INDEX.push({ s, k, head, t, low: norm(t), hlow: norm(head + ' ' + s.title) });
    });
  });
  function norm(t) { return t.toLowerCase().replace(/[•·]/g, ' ').replace(/[‐-―]/g, '-').replace(/\s+/g, ' '); }
  function terms(qs) { return norm(qs).split(/[\s,]+/).map((x) => x.replace(/^[^\w/+.]+|[^\w/+.%]+$/g, '')).filter(Boolean); }
  function rx(ts) { return new RegExp('(' + ts.map((t) => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi'); }

  function search(qs) {
    const ts = terms(qs);
    if (!ts.length) return [];
    const phrase = norm(qs.trim());
    const out = [];
    for (const e of INDEX) {
      let score = 0, ok = true;
      for (const t of ts) {
        const c = e.low.split(t).length - 1;
        const h = e.hlow.includes(t);
        if (!c && !h) { ok = false; break; }
        score += Math.min(c, 5) + (h ? 4 : 0) + (new RegExp('(^|[^a-z0-9])' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '([^a-z0-9]|$)').test(e.low) ? 2 : 0);
      }
      if (!ok) continue;
      if (ts.length > 1 && e.low.includes(phrase)) score += 8;
      if (e.s.blocks[e.k].type === 'h') score += 3;
      out.push({ e, score });
    }
    out.sort((a, b) => b.score - a.score);
    return out;
  }
  function snippet(t, ts) {
    const low = t.toLowerCase();
    let pos = Infinity;
    ts.forEach((x) => { const p = low.indexOf(x); if (p >= 0 && p < pos) pos = p; });
    if (pos === Infinity) pos = 0;
    const start = Math.max(0, pos - 70), end = Math.min(t.length, pos + 190);
    return (start ? '…' : '') + esc(t.slice(start, end)).replace(rx(ts), '<mark>$1</mark>') + (end < t.length ? '…' : '');
  }
  let lastQ = '';
  function runSearch() {
    const qs = q.value.trim();
    lastQ = qs;
    if (!qs) { route(); return; }
    const ts = terms(qs), res = search(qs);
    setCurrent('');
    const shown = res.slice(0, 60);
    page.innerHTML = '<div class="results-head"><h1>Search</h1><span class="count">' + res.length + ' match' + (res.length === 1 ? '' : 'es') + ' for “' + esc(qs) + '”</span></div>' +
      (res.length ? shown.map(({ e }) => '<a class="res" href="#' + e.s.id + '" data-id="' + e.s.id + '" data-k="' + e.k + '"><div class="rp">' + esc(e.s.title) + (e.head && e.s.blocks[e.k].type !== 'h' ? ' › ' + esc(e.head) : '') + '</div><div class="rt">' +
        (e.s.blocks[e.k].type === 'h' ? snippet(e.head, ts) : esc(e.head || e.s.title)) + '</div><div class="rs">' + snippet(e.t, ts) + '</div></a>').join('')
        : '<p class="lead">Nothing matches every word. Try fewer words, or a model name like “UMC1820”, “76-KT” or “SH-201”.</p>');
    page.querySelectorAll('.res').forEach((a) => a.addEventListener('click', (ev) => {
      ev.preventDefault();
      pendingTarget = a.dataset.id + '-' + a.dataset.k;
      if (location.hash === '#' + a.dataset.id) route(); else location.hash = a.dataset.id;
    }));
    window.scrollTo(0, 0);
  }
  function highlightIn(el) {
    const ts = terms(lastQ);
    if (!ts.length) return;
    const re = rx(ts), walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach((nd) => {
      if (!re.test(nd.nodeValue) || nd.parentNode.closest('svg')) return;
      re.lastIndex = 0;
      const span = document.createElement('span');
      span.innerHTML = esc(nd.nodeValue).replace(re, '<mark>$1</mark>');
      nd.parentNode.replaceChild(span, nd);
    });
  }

  // ---------- routing ----------
  let pendingTarget = null;
  function route() {
    const id = location.hash.replace('#', '');
    rail.classList.remove('open'); $('#menu').setAttribute('aria-expanded', 'false');
    if (!id || id === 'home') renderHome(); else renderSection(id, pendingTarget);
    pendingTarget = null;
  }
  window.addEventListener('hashchange', () => { if (!pendingTarget) { lastQ = ''; } route(); });
  let timer;
  q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(runSearch, 120); });
  q.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { q.value = ''; lastQ = ''; route(); }
    if (e.key === 'Enter') { const first = page.querySelector('.res'); if (first) first.click(); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
  $('#menu').addEventListener('click', () => { const o = rail.classList.toggle('open'); $('#menu').setAttribute('aria-expanded', String(o)); });
  $('#brand').addEventListener('click', () => { q.value = ''; lastQ = ''; });
  rail.addEventListener('click', () => { q.value = ''; lastQ = ''; });
  const top = document.querySelector('.top');
  const setTop = () => document.documentElement.style.setProperty('--toph', top.offsetHeight + 'px');
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(top); else window.addEventListener('resize', setTop);
  route();
})();
</script>
