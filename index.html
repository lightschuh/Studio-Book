<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Toad Studio: the searchable studio book for a Mackie 24-8 home studio.">
<title>Toad Studio Book</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
img { max-width: 100% }
[hidden] { display: none !important }

/* Layout: a manual page beside a meter-bridge contents rail; search lives in the top strip like a scribble strip. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --ink: #1c2320;
  --muted: #5a6560;
  --line: #d6ddd8;
  --accent: #3d6a37;     /* toad green */
  --accent-soft: #e3eedf;
  --signal: #b8700f;     /* LED amber: moved knobs, search hits */
  --signal-soft: #fbecd2;
  --rail: #e9eee9;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step-0: 0.95rem; --step-1: 1.15rem; --step-2: 1.45rem; --step-3: 2.1rem;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111613; --surface: #181e1b; --ink: #e4eae6; --muted: #98a49e; --line: #2b3430;
  --accent: #8cc27c; --accent-soft: #223022; --signal: #e3a645; --signal-soft: #3a2d16; --rail: #151b18; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111613; --surface: #181e1b; --ink: #e4eae6; --muted: #98a49e; --line: #2b3430;
  --accent: #8cc27c; --accent-soft: #223022; --signal: #e3a645; --signal-soft: #3a2d16; --rail: #151b18; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 400 var(--step-0)/1.6 var(--font-body) }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap }
.brand { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap }
.brand b { font: 800 1.35rem/1 var(--font-display); font-stretch: 112%; letter-spacing: 0.06em; color: var(--accent) }
.brand span { font: 500 0.8rem/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase }
.search { flex: 1 1 260px; min-width: 0; position: relative }
.search input { width: 100%; font: 400 1rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 9px 12px 9px 34px }
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft) }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2 }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 0.72rem var(--font-mono); color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px }
.tools { display: flex; gap: 8px; align-items: center }
.btn { font: 600 0.82rem var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 11px; cursor: pointer; text-decoration: none; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.menu-btn { display: none }

.wrap { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh }
nav.rail { background: var(--rail); border-right: 1px solid var(--line); padding: 18px 12px 40px max(16px, env(safe-area-inset-left, 0px));
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph, 58px)); height: calc(100vh - var(--toph, 58px)); overflow-y: auto; align-self: start }
.rail h3 { font: 700 0.7rem/1 var(--font-display); font-stretch: 100%; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 18px 8px 6px }
.rail h3:first-child { margin-top: 0 }
.rail a { display: flex; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 5px; text-decoration: none; color: var(--ink); font-size: 0.88rem; line-height: 1.35 }
.rail a .n { font: 500 0.7rem var(--font-mono); color: var(--muted); min-width: 1.6em }
.rail a:hover { background: var(--surface) }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600 }

main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.page { max-width: 860px; margin: 0 auto }
.eyebrow { font: 600 0.72rem var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent) }
h1 { font: 800 var(--step-3)/1.1 var(--font-display); font-stretch: 88%; margin: 6px 0 10px; text-wrap: balance; letter-spacing: -0.005em }
h2 { font: 700 var(--step-2)/1.2 var(--font-display); font-stretch: 92%; margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: calc(var(--toph, 58px) + 16px) }
.lead { color: var(--muted); font-size: 1.02rem; max-width: 68ch }
.page p, .page li { max-width: 72ch }
.page ul { padding-left: 1.15em; margin: 8px 0 }
.page li { margin: 6px 0 }
.page li::marker { color: var(--accent) }
.note { font-size: 0.88rem; color: var(--muted); border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin: 10px 0 }
.blk { scroll-margin-top: calc(var(--toph, 58px) + 16px); border-radius: 6px; transition: background-color .6s }
.blk.flash { background: var(--signal-soft) }

.tbl { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 0.86rem; line-height: 1.45 }
th { text-align: left; font: 600 0.74rem var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted);
  background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 10px; vertical-align: bottom }
td { padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums }
tr:first-child td { border-top: 0 }
td:first-child { font-weight: 600 }
.tbl.wide table { min-width: 640px }

.card { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); margin: 14px 0; overflow: hidden }
.card header { padding: 10px 14px; background: var(--accent-soft); font-size: 1rem }
.card dl { margin: 0; display: grid; grid-template-columns: 9.5rem minmax(0, 1fr) }
.card dt, .card dd { margin: 0; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 0.88rem }
.card dt { font-weight: 600; color: var(--muted) }

figure { margin: 16px 0; border: 1px solid var(--line); border-radius: 8px; background: #ffffff; overflow: hidden } /* diagrams are printed on white in both themes */
figure .scroll { overflow-x: auto }
figure img { display: block; width: 100%; height: auto; cursor: zoom-in }
figure.zoom img { width: 1500px; max-width: none; cursor: zoom-out }
figcaption { background: var(--surface); color: var(--muted); font-size: 0.8rem; padding: 7px 12px; border-top: 1px solid var(--line) }

.eq { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; margin: 12px 0 }
.strip { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 8px 6px 10px; text-align: center }
.strip .ch { font: 700 0.95rem var(--font-display); color: var(--accent) }
.strip .nm { font-size: 0.7rem; color: var(--muted); line-height: 1.25; min-height: 2.5em }
.strip svg { width: 100%; height: auto; display: block }
.strip text { font-family: var(--font-body) }

.home-hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 26px }
.home-hero img { border: 1px solid var(--line); border-radius: 8px; background: #fff }
.groups { display: grid; gap: 22px }
.group h3 { font: 700 0.75rem var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px }
.tile { display: block; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px }
.tile:hover { border-color: var(--accent) }
.tile b { display: block; font-size: 0.95rem; margin-bottom: 3px }
.tile span { color: var(--muted); font-size: 0.82rem; line-height: 1.4; display: block }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0 }
.chip { font-size: 0.8rem; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 10px; cursor: pointer }
.chip:hover { border-color: var(--signal) }

.results-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap }
.count { font: 500 0.8rem var(--font-mono); color: var(--muted) }
.res { display: block; text-decoration: none; color: var(--ink); padding: 12px 0; border-top: 1px solid var(--line) }
.res:hover .rt { color: var(--accent) }
.res .rp { font: 500 0.72rem var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase }
.res .rt { font-weight: 600; margin: 2px 0 }
.res .rs { font-size: 0.88rem; color: var(--muted) }
mark { background: var(--signal-soft); color: var(--ink); border-radius: 2px; padding: 0 1px; box-shadow: inset 0 -2px 0 var(--signal) }

.pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 46px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap }
.pager a { text-decoration: none; max-width: 48% }
.pager small { display: block; font: 500 0.7rem var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em }

@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr) }
  nav.rail { display: none; position: fixed; inset: calc(env(safe-area-inset-top, 0px) + var(--toph, 58px)) 0 0 0; height: auto; z-index: 4;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  nav.rail.open { display: block }
  .menu-btn { display: inline-block }
  .brand { order: 1 }
  .tools { order: 2; margin-left: auto }
  .search { order: 3; flex-basis: 100% }
  .brand span { display: none }
  .home-hero { grid-template-columns: minmax(0, 1fr) }
  .search kbd { display: none }
  .card dl { grid-template-columns: minmax(0, 1fr) }
  .card dd { border-top: 0; padding-top: 0 }
}
@media (prefers-reduced-motion: reduce) { .blk { transition: none } }
</style>
</head>

<script id="book-data" type="application/json">{"title": "TOAD STUDIO", "subtitle": "The Studio Book", "revised": "October 15, 2026", "sections": [{"id": "summary", "title": "Studio Build Summary", "desc": "Everything decided, capacity, aux sends, deals, shopping totals, open items", "group": "Overview", "blocks": [{"type": "lead", "text": "Everything decided so far for the Mackie 24&bull;8 studio, in one place. October 2026."}, {"type": "h", "text": "Documents"}, {"type": "table", "head": ["Section", "What it's for"], "rows": [["Studio Setup Map", "Rack order, 24-channel map with pan settings, four snakes, ADA8200, TSR-12, PV6, Tascam 246, garage PA, wiring, cable list."], ["Studio Connection Diagram", "Visual: signal flow (page 1), power and instrument chains with snake colors (page 2). Print and hang by the rack."], ["Monitoring: Outputs and Routes", "Every output and what feeds it; the MONITOR and PHONES sections button by button; talkback; setups for each kind of session."], ["Power: Start-Up and Shutdown", "What plugs into each Furman outlet, the switch-on order, the shutdown order, and why."], ["Gain Staging Guide", "Zeroing the board, setting each of the 24 channels, outboard levels, troubleshooting."], ["Setting Compression Levels", "Dialing in the 76-KT on a channel insert, with starting points per source and the dbx alternative settings."], ["EQ Settings, Channel by Channel", "What each EQ knob does and what not to do with it; a knob-picture starting point for every channel."], ["Mic Placement", "Distance, position and aim for every mic'd source; bleed control for band takes; which decisions depend on room size."], ["Tascam 246: Setup and Recording", "The 246's own controls, how it connects, levels for tape, recording passes, bouncing, and four-track use."], ["Reaper Setup", "ASIO driver, enabling all 16 inputs and outputs, the track template, playback routing, MIDI, recording and autosave settings."], ["FL Studio Setup", "The same studio in FL Studio: Mixer insert inputs and Auto-map, the recording filter, outputs to the tape returns, MIDI."], ["Pro Tools Setup", "The same studio in Pro Tools: Playback Engine, I/O Setup paths, session template, recording, MIDI. Needs Artist tier or above."], ["GarageBand Setup", "The same studio on a Mac in GarageBand: an 8-input recorder with stereo-only playback; good for overdubs and demos."], ["Panning Guide", "Console pan knobs for tracking (24 channels) and starting pan positions for the Reaper mix."], ["Alternate Setups", "Other ways to wire the same studio, each with what changes and how to switch back. Alternate A: all direct outs, one source per track, with a noise test. Alternate B: stereo playback on two outputs, mixing in Reaper."], ["Studio Equipment List", "Everything you own, October 2026."], ["Studio Gear Needs List", "What's still missing, with price ranges, and what was ruled out."], ["Goal Studio Diagram", "The prospective map: today's gear plus every planned purchase, wired in."], ["Studio Equipment Values", "Rough used-market value of everything, with totals."], ["How Each Piece Works", "What each piece of your gear does and how it connects to the 24&bull;8; power order; quick gain checklist."]]}, {"type": "h", "text": "The studio at a glance"}, {"type": "ul", "items": ["Mackie 24&bull;8 console (24 channels, 8 groups) on the desk; rolling rack underneath (about 12U): UMC1820, ADA8200, TSR-12, room for the 76-KT and a delay unit, a rack shelf for the computer, Furman M-8x2, Mackie power supply at the bottom. No rack headphone amp: personal mixers at the players' spots cover that. Planned around the desk: a screen on a swing arm right of the console, and the DIY monitors clamped to the back edge.", "16 recording inputs in Reaper: groups 1-8 into the UMC1820 (Reaper 1-8) and 8 direct outs into the ADA8200 over ADAT (Reaper 9-16). 16 playback tracks: UMC1820 outputs to tape returns 1-8, ADA8200 outputs to tape returns 9-16. Reaper at 44.1 or 48 kHz.", "Four 8-channel snakes, same color order on all: brown, red, yellow, green, blue, gray, white, black. White tape = recording, black = playback 1-8, blue = direct outs, yellow = ADA8200 playback 9-16 (the 6 ft snake).", "All channels assigned except ch 22 (held for the drum machine if it has a stereo out)."]}, {"type": "h", "text": "Capacity at a glance"}, {"type": "ul", "items": ["<b>Console channels:<\/b> 23 of 24 used. Ch 22 is open, held for the drum machine if it has a stereo out; free for anything if it's mono.", "<b>Recording inputs:<\/b> 16 of 16 used. Groups 1-8 &rarr; UMC1820 (Reaper 1-8); direct outs &rarr; ADA8200 (Reaper 9-16). Anything new can be heard, but recording it means borrowing a group or direct-out path (like the Tascam on groups 7-8).", "<b>Playback:<\/b> 16 tracks. UMC1820 outputs 1-8 &rarr; tape returns 1-8; ADA8200 outputs &rarr; tape returns 9-16.", "<b>Still open for signals:<\/b> aux send 2 and AUX RETURN 2 (second effects unit); 2-TK and EXTERNAL inputs (monitor only: reference tracks, a phone); spare PV6 inputs (monitor-only sources); any mic input via the Radial ProDI once that channel's source is swapped.", "<b>If you outgrow 16 inputs:<\/b> the UMC1820's one ADAT input is taken by the ADA8200, so more recording channels means a bigger interface or a second one. Before that, submix monitor-only sources on the PV6."]}, {"type": "h", "text": "How channels get recorded"}, {"type": "ul", "items": ["<b>Group channels<\/b> (drums, bass, guitars, Reface CS): press the channel's group button (1-2, 3-4, 5-6 or 7-8) and L/R. Pan picks the odd or even group, so pan settings stay fixed. Toms and rooms share groups 3-4; both guitar amps share group 6.", "<b>Direct-out channels<\/b> (lead vocal, wireless, trumpet, vocals 2-3, SH-201, drum machine): pan doesn't affect the recording. Press L/R only. The direct out is after the EQ, fader and mute, so keep faders near U (unity) and don't mute a channel while it's recording.", "<b>Monitor-only channels<\/b> (PV6 submix of e-drums, SamplePad 4 and DJ; Tascam 246 return): heard in the mix, not recorded through the console. E-drums and the SamplePad record as MIDI.", "On every recorded channel, the EQ and fader are part of what Reaper gets. Set them before a take and leave them alone during it.", "Lopsided headphones from hard-panned groups: press MONO or use a performer mix on AUX SEND 3/4. Neither changes the recording. Final panning happens in Reaper."]}, {"type": "h", "text": "Aux sends on the 24&bull;8"}, {"type": "ul", "items": ["<b>Aux 1 and 2:<\/b> each has its own knob on every channel. One PRE button covers both. The talkback mic can be sent into them.", "<b>Aux 3-6:<\/b> two knobs per channel. SHIFT makes them aux 3 and 4 (up) or aux 5 and 6 (down), so one channel can feed 3/4 or 5/6, not both. One PRE button covers the pair. SOURCE sends that channel's tape return (Reaper playback on MIX-B) instead of the live channel.", "<b>Headphones:<\/b> the two phones jacks can listen to aux 3/4 or aux 5/6 directly, not aux 1/2.", "<b>How this studio uses them:<\/b> effects on aux 1 and 2 with PRE up (TSR-12 reverb on 1, a delay on 2 later); headphone mixes on aux 3-6 with PRE down.", "<b>Setting up the aux 3/4 performer mix, step by step:<\/b> (1) on each channel the performer needs, SHIFT up and PRE down; (2) aux 3 knob = how loud that channel is in their left ear, aux 4 = right ear, so turn both up equally for a centered sound, or favor one for a little stereo; (3) raise the AUX SEND 3 and 4 masters in the master section to about noon; (4) on the Phones 2 section press AUX SEND 3/4 and bring its level up slowly; (5) keep Phones 1 on MONITOR so you hear the control room mix. Because PRE is down, moving channel faders won't change what the performer hears.", "<b>What's left to fill:<\/b> aux 2 is the only open effects send. Aux 5/6 is a second performer mix or two more mono cues for personal mixers. Aux returns 2, 3 and 4 are open stereo line inputs for a delay or any extra line source (DJ mixer, a phone) when the channels are full."]}, {"type": "h", "text": "16-track playback and clock (UMC1820 + ADA8200)"}, {"type": "ul", "items": ["Two optical cables: ADA8200 ADAT out &rarr; UMC1820 optical in (recording), and UMC1820 ADAT out &rarr; ADA8200 ADAT in (playback). The ADA8200's 8 outputs feed tape returns 9-16 through the 6 ft snake.", "Clock with both cables: UMC1820 is the master; set the ADA8200's SYNC to ADAT IN until it shows LOCKED. With only the first cable, set the ADA8200 to its internal clock at Reaper's sample rate and set the UMC1820 to clock from its optical input.", "The ADA8200's outputs are XLR: use an XLR (female) to TRS snake, or 8 XLR-female-to-TRS-male adapters on a TRS snake. Worth checking before Todd sends the 6 ft snake.", "UMC1820 outputs 1-2 are its MAIN OUT jacks, which follow the front MAIN OUT knob. Turn that knob all the way up and leave it, so playback tracks 1-2 match 3-8.", "In Reaper, route tracks 9-16 to hardware outputs 11-18 (the ADAT outs); they play on MIX-B channels 9-16. The Reaper Setup page has the full template."]}, {"type": "h", "text": "Headphones and monitoring"}, {"type": "ul", "items": ["The 24&bull;8 has two headphone outputs, each with its own level and source (MONITOR, MIX-B, AUX 3/4, AUX 5/6, EXTERNAL).", "Basic: press MONITOR on both phones sections and L/R MIX in the monitor section. Reaper playback comes back on the tape returns: press MIX-B and raise MIX-B LEVEL. The full button-by-button walkthrough, every output, talkback and per-session setups are on the Monitoring page.", "Headphones: used Sony MDR-7506 and Sennheiser HD 280 Pro, both getting new pads.", "Headphone amp: decided against, to keep the rack space for a delay unit. Up to 2 people use Phones 1 and 2. For more, small mixers with headphone jacks at each player's spot, fed from aux sends 3-6; they double as personal headphone amps.", "Speakers: CONTROL ROOM out &rarr; Peavey 260 stereo power amp &rarr; DIY passive monitors (Parts Express kit). Until those are built, all mixing is on headphones."]}, {"type": "h", "text": "Submixers and personal monitor mixes"}, {"type": "ul", "items": ["<b>Freeing console channels:<\/b> a small mixer can combine monitor-only sources (like the PV6 does for the e-drums, SamplePad 4 and DJ mixer) into one stereo pair. Don't submix anything you want on its own track; the blend gets locked in.", "<b>Musicians' own mixes:<\/b> feed a small mixer per musician from aux sends 3-6 with PRE down, each send carrying a group of instruments, e.g. aux 3 = drums, aux 4 = bass and guitars, aux 5 = vocals and trumpet, aux 6 = keys. Each player plugs headphones into their mixer and turns up \"more me\". This replaces using AUX 3/4 as a stereo pair for Phones 2.", "Because aux 3/4 and 5/6 share knobs, set SHIFT up on the drum, bass and guitar channels (aux 3 or 4) and SHIFT down on the vocal, trumpet and keys channels (aux 5 or 6).", "Any small mixer with a headphone jack works. The powered PA mixers aren't a good fit for this; use them for the garage PA and gigs."]}, {"type": "h", "text": "Gain staging rules"}, {"type": "ul", "items": ["Set each 24&bull;8 channel with its fader at U: press SOLO and raise the trim until peaks regularly reach 0 on the L/R meters. Solo on this console is after the fader, so the fader has to be at U first. Aim for Reaper peaks around -12 to -6 dBFS.", "<b>Mixer feeds what's recorded or the main mix<\/b> (PV6 submixer): set gains and master to unity once, then leave them. Small balance tweaks on its faders are fine.", "<b>Mixer only feeds someone's ears<\/b> (personal headphone mixers): musicians can change anything. It can't affect the recording.", "Tascam 246: tape meters around 0 VU, a little past for saturation."]}, {"type": "h", "text": "Microphones"}, {"type": "ul", "items": ["Every owned mic has a spot: kick and snare mics, room mics, SM58-style (3) on toms and guitar amp 2, SM57 on guitar amp 1, SM58 on trumpet, Worker Bee on lead vocal, Peavey on vocal 2, Turner 95D on vocal 3. Bass goes through its DI out.", "No rack mic preamp needed: the 24&bull;8 has 24 preamps and the ADA8200 adds 8. Next mic to buy, if any: another SM57.", "Phantom power is switched in blocks of eight channels (1-8, 9-16, 17-24). The Worker Bee on ch 10 means channels 9-16 all get 48V. That's fine for balanced dynamic mics. Check the wireless receiver's manual, and see the Turner note below.", "Turner 95D: made in high- and low-impedance versions with Amphenol MC1M or MC2M connectors; check the OHMS box. High: needs a matching transformer. Low (200 ohms): needs an adapter or rewired cable to XLR. Until its wiring is confirmed, don't plug it into a block with phantom on. Output is low (about 1.25 mV/Pa) and range narrow (100 Hz-10 kHz): a lo-fi character mic, great for a vintage vocal or a crushed mono room mic.", "Inline mic booster (Cloudlifter CL-1, Triton FetHead, sE DM1): only if a quiet vocal needs the trim near max and you hear hiss. Dynamic mics only, never condensers.", "Acoustic guitar overdubs: Worker Bee on ch 10, aimed at the 12th fret, 8-12 inches away. Keep it off the PV6, which isn't recorded."]}, {"type": "h", "text": "Electronic percussion"}, {"type": "ul", "items": ["Roland e-drum pad and Alesis SamplePad 4 (5 pads total) go into the PV6 for monitoring and record as MIDI through the UMC1820's MIDI in or USB. One pad can play any sound; build parts a drum at a time."]}, {"type": "h", "text": "Rack additions and deals"}, {"type": "ul", "items": ["Priority: (1) a compressor; (2) a patchbay; (3) a Pultec-style EQ such as the Klark Teknik EQP-KT, not a graphic EQ; (4) a rack drawer for patch cables.", "Compressor decision: the Klark Teknik 76-KT (1176-style) is the primary choice and is in the totals. Alternatives if one doesn't turn up, or for four channels later: two dbx 266XS from Drew's listing ($110 the pair, clean, with gates), or two dbx 1066 from Cory's listing ($150 each, better built, same four channels).", "Cory Pollard's listing also has 2 patchbays ($20 each) and 2 Hosa 8-channel TS snakes ($20 each): $80 for the four, worth taking even without the 1066s. Test every patchbay jack and each snake tail before paying.", "Klark Teknik DN514+ quad gate, $100 with free shipping: a fair price. It goes on the inserts of kick, snare and both toms and tightens the drums before they're recorded. Reaper can gate for free afterwards, so buy it only if tom ring and bleed are bothering you now. It takes 1U; with the headphone amp dropped, the rack has room for it under the delay unit.", "Klark Teknik 76-KT: the one in that listing sold. Still on the needs list as the 1176-style character compressor; if you buy the 1066s it becomes a nice-to-have at around $100-135 used.", "Skip from that listing: Warm Audio WA273-EQ ($1,100, a luxury), dbx 1074 quad gate (Reaper can gate later), dbx 231 graphic EQ (PA use only).", "Behringer HA8000 headphone amp listed at $50: passed on it; the rack slot goes to a delay unit and personal mixers handle extra headphones.", "Power amp: covered by the Peavey 260 (vintage 1970s stereo power amp). It drives passive speakers only; it isn't rack-mount, so it goes on a shelf."]}, {"type": "h", "text": "Connecting more gear to the 24&bull;8"}, {"type": "ul", "items": ["Studio monitors: the biggest gap. Plan: CONTROL ROOM out &rarr; Peavey 260 &rarr; DIY passive monitors built from a Parts Express kit (C-Note pair about $160). Get the Peavey checked by a tech, match speaker impedance to its rating, use real speaker cable, power it on last. JBL 305P MkII powered monitors remain the plug-and-play backup.", "A delay on AUX SEND 2 / AUX RETURN 2 (aux 1 is the TSR-12).", "Personal headphone mixers on AUX SENDS 3-6.", "Radial ProDI into any mic input: records a clean guitar or bass track alongside the amp mic, so it can be re-amped later; also for an acoustic pickup. Synths, drum machines and the DJ mixer don't need one.", "Reference tracks into the 2-TK input to compare mixes against Tame Impala songs."]}, {"type": "h", "text": "Marshall MG250DFX"}, {"type": "ul", "items": ["The rear jacks are FX send, FX return(s), footswitch and CD input. The jack that didn't work was most likely the FX return: it skips the preamp, so a guitar plugged in there sounds weak or silent, and anything in it cuts off the preamp. A photo of the back panel will confirm.", "Use it as a loop: drive and fuzz pedals in front of the amp; delay, reverb, modulation and the 720 looper between FX SEND and FX RETURN."]}, {"type": "h", "text": "Effects and the Tame Impala sound"}, {"type": "ul", "items": ["TSR-12 on aux send 1 (PRE up), returned on aux return 1, mix 100% wet. Monitor-only; Reaper records dry.", "Klark Teknik 76-KT (1176-style FET) on a channel insert via Y cable for squashed drums and vocals. Mackie inserts: tip = send, ring = return.", "Guitar chain: guitar &rarr; pedalboard (Big Muff, DBA Exploding Head, Cock Fight Plus, JHS gain, La Grotte) &rarr; Diamond Vibrato &rarr; MXR Phase 90 &rarr; 720 looper &rarr; amp. Vibrato needs a 9-18V supply; Phase 90 a 9V adapter or battery.", "Kevin Parker notes: SM57-style dynamics on drums and amps, heavy 70s drum compression and saturation, Juno-106 run through guitar pedals (run the SH-201 through the pedalboard into ch 17), Vox AC30, SSL-style bus compressor, Manley Vari-Mu on the master. Reaper's ReaComp can cover the mix bus.", "Tascam 246 tape saturation is another route to the 70s drum sound once it's repaired."]}, {"type": "h", "text": "Analog tape: Tascam 246 (once repaired)"}, {"type": "ul", "items": ["To tape: 24&bull;8 MAIN MIX out L/R &rarr; two 246 line inputs. From tape: 246 stereo line out &rarr; ch 23-24.", "To capture tape into Reaper, assign ch 23-24 to groups 7-8 in place of the Reface. Not synced: line takes up by ear or with a click.", "Full setup, the 246's own mixer settings, dbx, tape speed, bouncing and punch-ins are on the Tascam 246 page."]}, {"type": "h", "text": "Garage PA"}, {"type": "ul", "items": ["STUDIO OUTPUT L/R &rarr; one powered mixer (Powerpod 410 or EMX62M) in the garage for playback or a monitor mix. Talkback reaches it through PHONES &amp; STUDIO.", "The other powered mixer can take the MAIN MIX outs for live shows. Garage mics would need a long XLR snake back to the console."]}, {"type": "h", "text": "Power"}, {"type": "ul", "items": ["The Furman plugs straight into a grounded wall outlet (never a power strip). All rack audio gear plugs into its eight switched rear outlets (won on eBay, on its way). Two things stay off it: the Peavey 260, on its own wall outlet so it can be last on and first off, and the computer, so a tripped breaker can't kill a session. Keep the Mackie power supply's umbilical away from the snakes.", "Start-up: levels down &rarr; Furman switch (console PSU, UMC1820, ADA8200, outboard all come up) &rarr; computer and Reaper &rarr; wait 20-30 s &rarr; Peavey 260 &rarr; bring levels up. Shutdown in reverse: levels down, Peavey off, computer down, Furman off. Full page: Power: Start-Up and Shutdown.", "If the window AC causes clicks or hum, power the studio from another circuit."]}, {"type": "h", "text": "Shopping status"}, {"type": "table", "head": ["Needs list", "Low", "High"], "rows": [["Studio essentials", "$163", "$268"], ["Essentials + Tame Impala sound", "$667", "$896"], ["Essentials + Tame Impala + monitoring extras", "$1,067", "$1,657"], ["Everything, including only-if-needed items", "$1,172", "$1,947"]]}, {"type": "note", "text": "Details and what each tier includes are in the Studio Gear Needs List."}, {"type": "h", "text": "Open items"}, {"type": "ul", "items": ["Tascam 246 repair (won't play tape).", "Run the group-vs-direct-out noise test (Alternate Setups) and decide whether to try Alternate A.", "Used MDR-7506 and HD 280 Pro: order pads. Confirm the HD 280 Pro is a 2016 or newer unit before buying the genuine Sennheiser pad kit.", "Power supplies for the Diamond Vibrato (9-18V) and Phase 90 (9V).", "Identify the 1970s Roland drum machine model (decides whether it needs ch 22 for a stereo out, and narrows its value).", "Check the Turner 95D's impedance and wiring before plugging it into the console.", "Send photos when back in the studio: Turner OHMS box and connector, back of the console, Marshall back panel, second pedalboard.", "Measure the live room and control room (length, width, ceiling height; which walls are hard or soft) so the Mic Placement page's room-dependent items become exact.", "Find a used 76-KT (around $100-135). Decide on Cory's patchbays and snakes, and whether the DN514+ gate is worth it now.", "Swap the 3 ft snake with Todd for the 6 ft one (the 3 ft doesn't reach); ideally XLR (female) to TRS for the ADA8200 outputs. Until then, play back in stereo (Alternate B).", "Third snake, XLR cables, second optical cable, MIDI cable, Tascam and DJ cables (see the Setup Map cable list).", "Install the Furman when it arrives: just above the Mackie power supply with one empty space between.", "Peavey 260: tech check, then build the monitors."]}]}, {"id": "setup-map", "title": "Studio Setup Map", "desc": "Rack order, 24-channel map, four snakes, clock, wiring, cable list", "group": "Setup", "blocks": [{"type": "lead", "text": "Rack order, channel map, four snakes, effects routing and cables for the Mackie 24&bull;8 studio. October 2026."}, {"type": "h", "text": "Rack order (top to bottom)"}, {"type": "table", "head": ["Position", "Unit", "Status", "Why it goes here"], "rows": [["1 (top)", "Behringer UMC1820", "In the rack", "Used most: gain knobs, front inputs 1-2, meters. Closest to the desk."], ["2", "Behringer ADA8200", "In the rack", "Direct-out channels record here (Reaper inputs 9-16); its outputs play Reaper tracks 9-16 to tape returns 9-16. Short optical cables to the UMC1820."], ["3", "DigiTech TSR-12", "In the rack", "Reverb/delay on aux send 1."], ["4", "Compressor: Klark Teknik 76-KT or dbx 1066", "Not bought yet", "Adjusted often while tracking."], ["5", "Delay / second effects unit", "Future", "On aux send 2 / aux return 2. Headphones for 3+ people are handled by personal mixers at the players' spots, not a rack headphone amp."], ["6", "Rack shelf with the computer", "Shelf on order", "A 2U vented shelf. The PC's own fan pulls air through the gap, which also keeps power-supply heat off the gear above. Leave the front of the shelf clear."], ["7", "Furman M-8x2", "On its way", "Everything plugs in here; one switch handles power."], ["8 (bottom)", "Mackie 24&bull;8 power supply", "In the rack", "Heaviest, runs warm, can put hum into nearby audio gear. Farthest from the UMC1820 and TSR-12."]]}, {"type": "note", "text": "The Peavey 260 power amp isn't rack-mount: it sits on a shelf near the rack with air around it."}, {"type": "h", "text": "Console channel and panning map"}, {"type": "p", "text": "Groups 1-8 feed UMC1820 inputs 1-8 (Reaper 1-8). Direct outs feed ADA8200 inputs 1-8 (Reaper 9-16). Channel 22 is open."}, {"type": "table", "head": ["Ch", "Source", "Cable", "Pan", "Records to (Reaper input)"], "rows": [["1", "Kick", "XLR", "Hard L", "Group 1 (Reaper 1)"], ["2", "Snare", "XLR", "Hard R", "Group 2 (Reaper 2)"], ["3", "Rack tom (SM58-style)", "XLR", "10 o'clock", "Groups 3-4 (Reaper 3-4)"], ["4", "Floor tom (SM58-style)", "XLR", "2 o'clock", "Groups 3-4 (Reaper 3-4)"], ["5", "Room L", "XLR", "Hard L", "Groups 3-4 (Reaper 3-4)"], ["6", "Room R", "XLR", "Hard R", "Groups 3-4 (Reaper 3-4)"], ["7", "Bass amp (DI out or mic)", "XLR", "Hard L", "Group 5 (Reaper 5)"], ["8", "Magnatone (SM57)", "XLR", "Hard R", "Group 6 (Reaper 6)"], ["9", "Marshall or Orange (SM58-style)", "XLR", "Hard R", "Group 6 (Reaper 6)"], ["10", "Lead vocal (Worker Bee)", "XLR", "Center", "Direct out &rarr; ADA8200 in 1 (Reaper 9)"], ["11", "ATW-R3210 wireless", "XLR", "Center", "Direct out &rarr; ADA8200 in 2 (Reaper 10)"], ["12", "Reface CS L", "1/4\" TS", "Hard L", "Group 7 (Reaper 7)"], ["13", "Reface CS R", "1/4\" TS", "Hard R", "Group 8 (Reaper 8)"], ["14", "Trumpet (SM58)", "XLR", "1 o'clock", "Direct out &rarr; ADA8200 in 3 (Reaper 11)"], ["15", "Vocal 2 (Peavey)", "XLR", "10 o'clock", "Direct out &rarr; ADA8200 in 4 (Reaper 12)"], ["16", "Vocal 3 (Turner 95D)", "XLR", "2 o'clock", "Direct out &rarr; ADA8200 in 5 (Reaper 13)"], ["17", "Roland SH-201 L", "1/4\" TS", "9 o'clock", "Direct out &rarr; ADA8200 in 6 (Reaper 14)"], ["18", "Roland SH-201 R", "1/4\" TS", "3 o'clock", "Direct out &rarr; ADA8200 in 7 (Reaper 15)"], ["19", "Peavey PV6 main out L", "1/4\"", "Hard L", "Monitor only (e-drums, SamplePad 4, DJ)"], ["20", "Peavey PV6 main out R", "1/4\"", "Hard R", "Monitor only (e-drums, SamplePad 4, DJ)"], ["21", "1970s Roland drum machine", "1/4\" TS", "Center", "Direct out &rarr; ADA8200 in 8 (Reaper 16)"], ["22", "Open (drum machine R if stereo)", "&mdash;", "&mdash;", "&mdash;"], ["23", "Tascam 246 line out L", "RCA to 1/4\"", "Hard L", "Monitor; assign to groups 7-8 to capture into Reaper"], ["24", "Tascam 246 line out R", "RCA to 1/4\"", "Hard R", "Monitor; assign to groups 7-8 to capture into Reaper"]]}, {"type": "note", "text": "<b>Group channels<\/b> (1-9, 12-13): press the group button for that pair (1-2, 3-4, 5-6 or 7-8) plus L/R to hear it. Pan picks the group, so keep these settings fixed. If they sound lopsided in the headphones, press MONO or use the AUX SEND 3/4 performer mix; neither changes the recording. <b>Direct-out channels<\/b> (10-11, 14-18, 21): pan doesn't affect what's recorded, so set it for the headphones. Press L/R only, no group buttons. The direct out is after the EQ, fader and mute: keep faders near U (unity) and don't mute while recording. <b>Monitor-only channels<\/b> (19-20 and 23-24): press L/R only; they aren't recorded through the console. <b>Other layouts:<\/b> an all-direct-outs version of this map (every channel 1-16 on its own track, no groups) is in the Alternate Setups chapter, with how to switch."}, {"type": "note", "text": "<b>Mics:<\/b> every mic you own has a spot. Kick and snare mics on 1-2, room mics on 5-6, bass through its DI out. If the Turner moves to a mono room \"crush\" mic, vocal 3 needs another mic; an SM57 is the best add. <b>Phantom power<\/b> is switched in blocks of eight channels (1-8, 9-16, 17-24): the Worker Bee on ch 10 puts 48V on the mic inputs of 9-16."}, {"type": "h", "text": "Snake color order"}, {"type": "p", "text": "Same order on both ends of all four snakes. UMC1820 inputs 1-2 are on the front panel; inputs 3-8 are on the back."}, {"type": "table", "head": ["#", "Color", "Recording (white tape)", "Playback 1-8 (black tape)", "Direct outs (blue tape)", "Playback 9-16 (yellow tape)"], "rows": [["1", "Brown", "Group out 1 &rarr; UMC1820 in 1 (front)", "UMC1820 out 1 &rarr; tape return 1 (MAIN OUT)", "Ch 10 direct out &rarr; ADA8200 in 1", "ADA8200 out 1 &rarr; tape return 9"], ["2", "Red", "Group out 2 &rarr; UMC1820 in 2 (front)", "UMC1820 out 2 &rarr; tape return 2 (MAIN OUT)", "Ch 11 direct out &rarr; ADA8200 in 2", "ADA8200 out 2 &rarr; tape return 10"], ["3", "Yellow", "Group out 3 &rarr; UMC1820 in 3", "UMC1820 out 3 &rarr; tape return 3", "Ch 14 direct out &rarr; ADA8200 in 3", "ADA8200 out 3 &rarr; tape return 11"], ["4", "Green", "Group out 4 &rarr; UMC1820 in 4", "UMC1820 out 4 &rarr; tape return 4", "Ch 15 direct out &rarr; ADA8200 in 4", "ADA8200 out 4 &rarr; tape return 12"], ["5", "Blue", "Group out 5 &rarr; UMC1820 in 5", "UMC1820 out 5 &rarr; tape return 5", "Ch 16 direct out &rarr; ADA8200 in 5", "ADA8200 out 5 &rarr; tape return 13"], ["6", "Gray", "Group out 6 &rarr; UMC1820 in 6", "UMC1820 out 6 &rarr; tape return 6", "Ch 17 direct out &rarr; ADA8200 in 6", "ADA8200 out 6 &rarr; tape return 14"], ["7", "White", "Group out 7 &rarr; UMC1820 in 7", "UMC1820 out 7 &rarr; tape return 7", "Ch 18 direct out &rarr; ADA8200 in 7", "ADA8200 out 7 &rarr; tape return 15"], ["8", "Black", "Group out 8 &rarr; UMC1820 in 8", "UMC1820 out 8 &rarr; tape return 8", "Ch 21 direct out &rarr; ADA8200 in 8", "ADA8200 out 8 &rarr; tape return 16"]]}, {"type": "note", "text": "Check each color one at a time: brown into group out 1, confirm signal on input 1 in Reaper, then continue through black. UMC1820 outputs 1-2 are its MAIN OUT jacks, which follow the front MAIN OUT knob: turn that knob all the way up and leave it so playback tracks 1-2 match 3-8."}, {"type": "h", "text": "UMC1820 and ADA8200 (Reaper inputs and playback 9-16)"}, {"type": "ul", "items": ["Recording: optical cable from the ADA8200's ADAT out to the UMC1820's optical in. Its line inputs 1-8 (on the front) take 24&bull;8 direct outs from channels 10, 11, 14-18 and 21 through the third snake (blue tape).", "16-track playback: second optical cable from the UMC1820's ADAT out to the ADA8200's ADAT in. The ADA8200's 8 outputs (XLR, on the back) feed tape returns 9-16 through the 6 ft snake (yellow tape). In Reaper, route tracks 9-16 to the 8 ADAT outputs; they play back on MIX-B channels 9-16.", "The ADA8200's outputs are XLR: use an XLR (female) to TRS snake, or 8 XLR-female-to-TRS-male adapters on the rack end of a TRS snake.", "Clock, with both optical cables connected: the UMC1820 is the master; set the ADA8200's SYNC switch to ADAT IN until it shows LOCKED.", "Clock, with only the ADA8200-to-UMC1820 cable: set the ADA8200 to its internal clock at the same sample rate as Reaper, and set the UMC1820's clock source to its optical input. Clicks and pops on inputs 9-16 mean the clock isn't set right.", "Keep Reaper at 44.1 or 48 kHz. At 88.2/96 kHz, ADAT carries only 4 channels."]}, {"type": "h", "text": "Aux sends on the 24&bull;8"}, {"type": "ul", "items": ["Aux 1 and 2 have their own knobs on every channel and share one PRE button. Talkback can be sent into them.", "Aux 3-6 share two knobs: SHIFT up = aux 3 and 4, SHIFT down = aux 5 and 6, so one channel feeds 3/4 or 5/6, not both. One PRE button covers the pair. SOURCE sends the channel's tape return (MIX-B) instead of the live channel.", "The phones jacks can listen to aux 3/4 or 5/6, not 1/2. So: effects on aux 1 and 2 (PRE up), headphone mixes on aux 3-6 (PRE down).", "Aux 3/4 performer mix: on each channel the performer needs, SHIFT up, PRE down, aux 3 = left ear, aux 4 = right ear (equal for centered). AUX SEND 3 and 4 masters to about noon. On Phones 2 press AUX SEND 3/4 and raise its level. Phones 1 stays on MONITOR for you.", "Still open: aux 2 (second effect), aux 5/6 (a second performer mix or two mono cues), aux returns 2-4 (stereo line inputs for a delay or any extra source)."]}, {"type": "h", "text": "PV6 submixer, electronic drums, drum machine and DJ"}, {"type": "ul", "items": ["Peavey PV6 as a monitor submixer: e-drum module, SamplePad 4 and DJ mixer into the PV6; PV6 main out into ch 19-20, panned L/R, L/R button only. Set the balance between them on the PV6 and the overall level on the console.", "Keep the PV6's channel gains and master at unity (normal) settings to avoid adding hiss. Only monitor-only sources go through it; anything you want on its own track goes straight into the 24&bull;8.", "E-drums: record the pad as MIDI. Module MIDI out to the UMC1820's MIDI in, then record a MIDI track in Reaper. One pad can play any sound, so build parts one drum at a time and replace sounds later.", "Alesis SamplePad 4: main output into the PV6 with the e-drums. Record it as MIDI through its USB port to the computer. The UMC1820 has one MIDI in, which the e-drum module uses.", "1970s Roland drum machine: output to ch 21, recorded through its direct out on ADA8200 in 8 (Reaper 16). Use ch 22 if it has a stereo out.", "DJ sets: record on the DJ mixer's record out, or temporarily repatch the SH-201's ADA8200 inputs 6-7."]}, {"type": "h", "text": "Mic notes, acoustic guitar and pedalboard"}, {"type": "ul", "items": ["Turner 95D: check the OHMS box on the label. High impedance: it needs an inline Hi-Z to low-Z matching transformer before the console's XLR input. Low (200 ohms): it needs an adapter or rewired cable from its Amphenol connector to XLR. Until that's sorted, keep it off channels 9-16 while the Worker Bee's phantom power is on. Great as a lo-fi vocal mic or a mono room mic crushed through a compressor.", "Acoustic guitar (overdubs): Worker Bee on ch 10, aimed at the 12th fret about 8-12 inches away. Ch 10 records through its direct out. Keep it off the PV6, which isn't recorded.", "Pedalboard (720 looper, La Grotte, DBA Exploding Head, Big Muff, Cock Fight Plus, JHS gain): guitar &rarr; drive and fuzz pedals &rarr; Diamond Vibrato &rarr; Phase 90 &rarr; 720 looper &rarr; amp. The Big Muff covers the fuzz role.", "Marshall MG250DFX FX loop: drive and fuzz pedals go in front of the amp's front input; delay, reverb, modulation and the 720 looper can go in the loop instead (FX SEND &rarr; pedals &rarr; FX RETURN). The FX RETURN feeds the power amp directly: a guitar plugged straight in there sounds weak or silent, and anything in the return cuts off the preamp.", "Synths through pedals, Kevin Parker style: SH-201 L out &rarr; pedalboard &rarr; ch 17. Keep the synth's volume low going in; synths run much hotter than guitars."]}, {"type": "h", "text": "Tascam 246 analog tape (once repaired)"}, {"type": "ul", "items": ["To tape: the 24&bull;8's MAIN MIX out L/R feeds two 246 line inputs. Whatever is in the L/R mix (a Reaper playback, a stem, or a live take) goes to the cassette tracks you arm on the 246.", "From tape: the 246's stereo line out feeds ch 23-24. Balance its 4 tracks on the 246's own mixer; set overall level on the console. Keep ch 23-24 out of the L/R mix while recording to tape, or the tape output feeds back into its own input.", "Levels: the 24&bull;8 runs hotter than the 246. Start with the 246's input trims low and raise them until tape meters peak around 0 VU; push slightly past for more tape saturation.", "Capturing tape into Reaper: assign ch 23-24 to groups 7-8 (temporarily in place of the Reface CS) and record Reaper inputs 7-8. The cassette isn't synced to Reaper, so line takes up by ear or with a click at the start.", "Good uses: run drums or a full mix through tape for 70s-style saturation, or record 4-track ideas on the 246 by itself (its own mic inputs) and dump them in later."]}, {"type": "h", "text": "Capacity at a glance"}, {"type": "ul", "items": ["<b>Console channels:<\/b> 23 of 24 used. Ch 22 is open, held for the drum machine if it has a stereo out; free for anything if it's mono.", "<b>Recording inputs:<\/b> 16 of 16 used. Groups 1-8 &rarr; UMC1820 (Reaper 1-8); direct outs &rarr; ADA8200 (Reaper 9-16). Anything new can be heard, but recording it means borrowing a group or direct-out path (like the Tascam on groups 7-8).", "<b>Playback:<\/b> 16 tracks. UMC1820 outputs 1-8 &rarr; tape returns 1-8; ADA8200 outputs &rarr; tape returns 9-16.", "<b>Still open for signals:<\/b> aux send 2 and AUX RETURN 2 (second effects unit); 2-TK and EXTERNAL inputs (monitor only: reference tracks, a phone); spare PV6 inputs (monitor-only sources); any mic input via the Radial ProDI once that channel's source is swapped.", "<b>If you outgrow 16 inputs:<\/b> the UMC1820's one ADAT input is taken by the ADA8200, so more recording channels means a bigger interface or a second one. Before that, submix monitor-only sources on the PV6."]}, {"type": "h", "text": "Open connections and planned additions"}, {"type": "ul", "items": ["Monitors: CONTROL ROOM outputs L/R &rarr; Peavey 260 inputs (channel A = left, B = right; TRS-to-TS cables) &rarr; speaker cable &rarr; DIY passive monitors (Parts Express kit).", "Peavey 260 first use: tech check first. Speaker impedance at or above the amp's rated minimum (back panel). Level knobs low, CONTROL ROOM level low, then bring both up while watching the VU meters. Power it on last and off first.", "AUX SEND 2 &rarr; a delay (second effects unit, or a pedal with the send kept low) &rarr; AUX RETURN 2.", "Channel inserts &rarr; compressor (76-KT, or a pair of dbx 266XS / 1066) with insert Y cables: drum pair, lead vocal, bass.", "Channel inserts 1-4 &rarr; Klark Teknik DN514+ quad gate (option) with 4 insert Y cables: kick, snare, rack tom, floor tom. Set thresholds with the drummer at full volume; use the LF/HF key filters so cymbals don't open the tom gates.", "AUX SENDS 3-6 &rarr; small personal headphone mixers, one per musician (aux 3 drums, 4 bass and guitars, 5 vocals and trumpet, 6 keys), or AUX SEND 3/4 &rarr; an 8-channel headphone amp.", "Any mic input: Radial ProDI for a clean guitar or bass track for re-amping, or an acoustic pickup.", "2-TK input: phone or computer (3.5mm to RCA) for reference tracks; press 2-TK in the monitor section.", "Patchbay in the rack for inserts and repatching (groups 7-8 swaps, ADA8200 borrowing).", "Garage alternative: the Peavey 260 can also drive passive PA speakers from STUDIO OUTPUT, freeing both powered mixers for gigs."]}, {"type": "h", "text": "Garage PA (STUDIO OUTPUT)"}, {"type": "ul", "items": ["Feed one powered mixer (Phonic Powerpod 410 or Yamaha EMX62M) from the 24&bull;8's STUDIO OUTPUT L/R. Choose its source in the MONITOR section and set level with the STUDIO knob.", "Use it for playback or a monitor mix in the garage. TALKBACK &rarr; PHONES &amp; STUDIO lets you talk to whoever is out there.", "For live shows, the other powered mixer can take the MAIN MIX outputs instead.", "Garage mics would need their own long XLR snake back to the console; not included here."]}, {"type": "h", "text": "TSR-12 reverb"}, {"type": "ul", "items": ["Wiring: 24&bull;8 AUX SEND 1 &rarr; TSR-12 left input; TSR-12 L/R outputs &rarr; AUX RETURN 1 L/R.", "TSR-12: mix 100% wet; set input level so the meter peaks just under overload.", "Per channel: aux 1 to about noon, PRE up (not pressed). Master AUX SEND 1 to about noon; raise AUX RETURN 1 and assign it to L/R.", "Don't press TALKBACK &rarr; AUX SEND 1 while tracking. Reverb is monitor-only; Reaper records dry."]}, {"type": "h", "text": "Wiring the back"}, {"type": "ul", "items": ["Power cords down one rear rail, audio cables down the other. Snakes through the wire basket.", "Keep the power supply's umbilical away from the snakes and the coiled snake slack; cross only at a right angle.", "Plug the power supply, UMC1820, ADA8200 and outboard gear into the Furman.", "The computer lives on a rack shelf below the headphone-amp space, so the USB run to the UMC1820 is short. Its power cord goes to the wall, not the Furman.", "If the window AC shares the wall circuit and causes clicks or hum, power the studio from another circuit."]}, {"type": "h", "text": "Cables"}, {"type": "table", "head": ["Cable", "Qty", "Use"], "rows": [["8-channel TRS snake, 20 ft", "2 owned + 1 needed", "Recording, playback 1-8, and direct outs to the ADA8200 (all 8 tails used). Eight single TRS cables also work for the third."], ["8-channel snake, 6 ft", "1 (swapping the 3 ft)", "ADA8200 outputs &rarr; tape returns 9-16. XLR (female) to TRS, or a TRS snake plus 8 XLR-to-TRS adapters. Not needed for stereo playback (Alternate Setups, Alternate B)."], ["XLR mic cable", "14 + 1 spare", "15-20 ft for drums, amps and trumpet; 25 ft for vocals and room mics."], ["1/4\" TS line cable", "14", "Reface CS to ch 12-13 (2). SH-201 to ch 17-18 (2). E-drum module to PV6 (2). SamplePad 4 to PV6 (2). PV6 main out to ch 19-20 (2). Drum machine to ch 21 (1). TSR-12: aux send 1 to input, L/R outs to aux return 1 (3, short)."], ["Optical (TOSLINK) cable", "2", "ADA8200 ADAT out &rarr; UMC1820 optical in; UMC1820 ADAT out &rarr; ADA8200 ADAT in."], ["MIDI cable (5-pin DIN)", "1", "E-drum module MIDI out &rarr; UMC1820 MIDI in."], ["Insert Y cable", "1 per compressor channel", "1 for the 76-KT (TRS to dual 1/4&quot;; TRS to dual XLR if using its XLR jacks). Two dbx 1066s would need 4."], ["Monitor line cables", "2", "CONTROL ROOM out L/R &rarr; Peavey 260 inputs. 1/4\" TRS to 1/4\" TS."], ["Speaker cable", "2 runs", "Peavey 260 outputs &rarr; DIY monitors. Also needed between any guitar amp head and its cabinet. Never use an instrument cable for either."], ["Tascam 246 cables", "2 + 2", "MAIN MIX out L/R &rarr; 246 line inputs (2 x 1/4\"). 246 line out L/R &rarr; ch 23-24 (2 x RCA-to-1/4\" if its outs are RCA)."], ["DJ mixer cables", "2", "DJ mixer master or booth out &rarr; PV6 inputs. Ends to match both mixers (often RCA-to-1/4\")."], ["Instrument cables", "2 long, 1 medium, patch cables", "Guitar &rarr; pedalboard &rarr; Diamond Vibrato &rarr; Phase 90 &rarr; amp; bass &rarr; bass amp."], ["Reference cable", "1", "3.5mm to dual RCA: phone or computer &rarr; 2-TK input."], ["Long balanced cables", "2 (optional)", "STUDIO OUTPUT L/R &rarr; garage PA. Length to suit the run; ends to match the PA's inputs."]]}]}, {"id": "connection-diagram", "title": "Studio Connection Diagram", "desc": "Signal flow; power, instrument chains and snake colors", "group": "Setup", "blocks": [{"type": "img", "src": "img/connection-diagram-1.png", "title": "Studio Connection Diagram: Signal Flow", "alt": "Studio Connection Diagram: Signal Flow Mackie 248 studio, October 2026. Follow the arrows from sources to the console, rack and Reaper. Mackie 248 console Drums 6 XLR: kick, snare, toms, rooms Ch 1-6 Bass amp DI out or mic (XLR) Ch 7 Guitar amps Magnatone + Marshall/Orange Ch 8-9 Vocals Lead, wireless, vocals 2-3 Ch 10-11, 15-16 Trumpet XLR Ch 14 Synths Reface CS + Roland SH-201 Ch 12-13, 17-18 PV6 submixer E-drums, SamplePad 4, DJ (monitor) Ch 19-20 1970s drum machine 1/4\" out Ch 21 Group outs 1-8 Tape returns 1-8 (MIX-B) Direct outs 10-11, 14-18, 21 Tape returns 9-16 (MIX-B) Aux send 1 Aux return 1 L/R Control room out L/R Studio out L/R Group channels: pan picks the group. Direct-out and monitor-only: pan freely. Behringer UMC1820 Inputs 1-8 (1-2 on front panel) Outs 1-8 (1-2 = MAIN OUT, knob full up) ADAT in + out  /  MIDI in Behringer ADA8200 Line ins 1-8 = Reaper inputs 9-16 XLR outs 1-8 = Reaper tracks 9-16 DigiTech TSR-12 Input L  /  Outputs L-R Mix 100% wet Computer: Reaper 44.1 or 48 kHz; on a rack shelf short USB run to the UMC1820 RACK Recording snake (white tape) Group outs 1-8 to inputs 1-8 Playback snake (black tape) Outs 1-8 to tape returns 1-8 Direct-out snake (blue tape) Ch 10-11, 14-18, 21 to ADA8200 ins 1-8 ADA8200 playback snake (yellow tape) ADA outs 1-8 to tape returns 9-16 1/4\" cable 2 x 1/4\" cables (L/R) Optical x2 USB Peavey 260 Power amp on a shelf Speaker cable > DIY monitors Garage PA (optional) Powerpod 410 or EMX62M Talkback: PHONES & STUDIO Phones 1 Sony MDR-7506 Phones 2 Sennheiser HD 280 Pro Source: MONITOR, or AUX SEND 3/4 for a performer mix Tascam 246 4-track cassette (once repaired) Main mix out L/R Ch 23-24 (tape) Recording snake Playback snake Direct-out snake ADA playback snake Single cable Optional"}, {"type": "img", "src": "img/connection-diagram-2.png", "title": "Studio Connection Diagram: Power, Instruments and Snake Colors", "alt": "Studio Connection Diagram: Power, Instruments and Snake Colors Everything plugs into the Furman. Instruments run through pedals before the amp mic. POWER Wall outlet Own circuit if the window AC causes hum Furman M-8x2 Rack, above the Mackie power supply Peavey 260 (monitors) wall outlet, own switch, on last Computer (rack shelf) wall outlet; shut down normally straight from the wall Mackie power supply Furman outlet 1 Behringer UMC1820 outlet 2 Behringer ADA8200 outlet 3 DigiTech TSR-12 outlet 4 Compressor / delay unit outlets 5-6, when added Umbilical Mackie 248 console Keep the umbilical away from the snakes. Power-up order 1. All levels down 2. Furman (rack comes up together) 3. Computer, Reaper 4. Wait 20-30 seconds 5. Peavey 260, own switch 6. Levels up Power down in reverse order. Phones and control room levels down before switching anything. INSTRUMENT CHAINS Guitar Pedalboard Vibrato + Phase 90 720 looper Guitar amp SM57 / SM58-style Console ch 8-9 Bass Bass amp DI out or mic Console ch 7 SH-201 L out > pedalboard > ch 17 (synth volume low). Marshall: time-based pedals can go in its FX loop instead. Amp head + separate cab? Speaker cable only. SNAKE COLOR ORDER (both ends, all four snakes) 1 Brown 2 Red 3 Yellow 4 Green 5 Blue 6 Gray 7 White 8 Black Tape near each end: white = recording, black = playback 1-8, blue = direct outs, yellow = ADA8200 playback 9-16."}]}, {"id": "monitoring", "title": "Monitoring: Outputs and Routes", "desc": "Every console output, monitor and phones sections, talkback, setups per session", "group": "Setup", "blocks": [{"type": "lead", "text": "The 24&bull;8's monitor section explained button by button, every output the console has and what feeds it, and ready-made setups for the sessions you'll actually run. Button names are from the Mackie 8&bull;Bus manual."}, {"type": "h", "text": "Every output the console has"}, {"type": "table", "head": ["Output (rear panel)", "What's on it", "Where it goes in this studio", "Level control"], "rows": [["CNTRL RM OUT L/R", "Whatever source buttons are pressed in the MONITOR section, summed if MONO is in", "Peavey 260 &rarr; DIY monitors (the room speakers)", "CNTRL RM knob. Talkback drops it 20 dB."], ["STUDIO OUT L/R", "The same monitor-section selection as the control room", "Garage PA (powered mixer) when wanted", "STUDIO knob. Talkback does NOT drop it."], ["PHONES 1", "Its own five source buttons (below)", "Your headphones (MDR-7506)", "PHONES 1 level"], ["PHONES 2", "Its own five source buttons", "Performer headphones (HD 280 Pro)", "PHONES 2 level"], ["MAIN MIX OUT L/R", "The L/R mix: everything assigned L/R, at the main fader", "Tascam 246 inputs (for tape). Not used for speakers.", "Main L/R fader"], ["MIX-B OUT L/R", "The MIX-B bus: Reaper playback from the tape returns", "Spare. Could feed a playback-only cue later.", "MIX-B LEVEL"], ["AUX SEND 1-6", "Per-channel aux knobs, at each aux master", "1: TSR-12. 2: open. 3/4 and 5/6: performer mixes (also selectable on the phones)", "Aux masters"], ["GROUP OUTS 1-8, DIRECT OUTS", "Recording feeds", "UMC1820 and ADA8200 (see the Setup Map)", "Group masters; channel faders"]]}, {"type": "h", "text": "The MONITOR section, button by button"}, {"type": "ul", "items": ["<b>Source buttons: L/R MIX, MIX-B, 2-TK (tape), EXTERNAL.<\/b> They pick what the control room and studio outputs carry, and you can press any combination; the sources add together. L/R MIX = the live mix at the main fader. MIX-B = Reaper playback coming back on the tape returns. 2-TK = the 2-TRACK INPUT jacks (your reference cable from a phone or computer). EXTERNAL = the EXTERNAL INPUT jacks (a spare stereo line in).", "<b>MONO.<\/b> Sums left and right for the speakers and the L/R meters. Press it to check that nothing disappears in mono, or to make hard-panned group channels sit in the middle of your headphones while tracking.", "<b>CNTRL RM level.<\/b> The room speaker volume, through the Peavey. Fully clockwise is unity; normal listening is well below that. Has no effect on headphones or on the recording.", "<b>STUDIO level.<\/b> Volume of the STUDIO OUT, which carries the same selection as the control room. In this studio that's the garage PA feed; leave it down when the garage isn't in use.", "<b>MIX-B section: MIX-B LEVEL and ASSIGN TO L/R MIX.<\/b> MIX-B LEVEL sets how loud Reaper playback is on the MIX-B bus. ASSIGN TO L/R MIX folds the playback into the main mix, which you'd use to hear a Reaper track while recording to tape, and should otherwise leave out so playback doesn't end up in a tape bounce by accident."]}, {"type": "h", "text": "The PHONES sections (Phones 1 and Phones 2)"}, {"type": "ul", "items": ["Each has its own level knob, its own SOLO button, and five source buttons: <b>MONITOR, MIX-B, AUX SEND 3&amp;4, AUX SEND 5&amp;6, EXTERNAL.<\/b> You can press more than one.", "<b>MONITOR<\/b> = the same thing the control room speakers are getting, taken after the source buttons. The CNTRL RM knob and MONO do not touch the phones, so you can turn the room down to nothing and still hear everything in headphones.", "<b>MIX-B<\/b> = Reaper playback only. <b>AUX SEND 3&amp;4<\/b> and <b>5&amp;6<\/b> = the performer mixes built on those aux knobs (aux 3 left ear, aux 4 right). <b>EXTERNAL<\/b> = the EXTERNAL INPUT jacks, a private cue that appears on no channel.", "<b>Solo and headphones.<\/b> The solo bus only reaches a phones output whose MONITOR button is pressed. If Phones 2 is on AUX SEND 3&amp;4, pressing SOLO lights the Rude Solo light but the performer hears no change, which is exactly what you want: you can solo-check a channel without disturbing them. Solo is after the fader on this console; the SOLO level knob at its center detent makes a soloed channel match its unsoloed level."]}, {"type": "h", "text": "Talkback"}, {"type": "ul", "items": ["The talkback mic is built into the console, just above the main L/R fader. Four momentary buttons send it to <b>AUX SEND 1, AUX SEND 2, TAPE SUBGRPS<\/b> (the L/R mix and all eight groups) and <b>PHONES/STUDIO<\/b>.", "To talk to a performer on Phones 2: hold PHONES/STUDIO. To talk to the garage: the same button, since it also feeds the STUDIO OUT.", "While talkback is held, the control room output drops 20 dB so the speakers don't feed back into the mic. The studio output is not dropped. Keep the garage PA modest if someone's talking back from out there.", "Never hold AUX SEND 1 or 2 or TAPE SUBGRPS during a take: AUX 1 would put your voice into the reverb, and TAPE SUBGRPS would put it into the recording.", "The talkback level knob starts at its center detent."]}, {"type": "h", "text": "Setups for common sessions"}, {"type": "table", "head": ["Session", "MONITOR section", "Phones 1 (you)", "Phones 2 (performer)", "Notes"], "rows": [["Tracking a performer, you at the desk", "L/R MIX in. MIX-B in if they're playing to a Reaper track. MONO out.", "MONITOR", "AUX SEND 3&4, built from aux 3/4 (PRE down) on the channels they need, plus MIX-B if they need the playback", "Room speakers low or off while mics are open, so they don't bleed into the mics. Talk with PHONES/STUDIO."], ["Tracking yourself", "L/R MIX in, MIX-B in", "MONITOR, and MONO pressed in the monitor section if the hard-panned groups sound lopsided", "Unused or same as Phones 1", "MONO changes only what you hear, never the recording."], ["Full band, everyone in headphones", "L/R MIX and MIX-B in", "MONITOR", "AUX SEND 3&4 for the second person; everyone else on a personal mixer fed from aux 3-6", "Each aux pair is one stereo mix. The personal mixers are the headphone amps for players 3 and up."], ["Mixing in Reaper", "MIX-B in only. Everything else out.", "MONITOR, or nothing: use the speakers", "Off", "You're listening to Reaper's output on the tape returns. The console's channel faders are out of the path. Check in mono with MONO."], ["Reference track A/B", "Toggle between MIX-B (your mix) and 2-TK (the reference). Press only one at a time.", "MONITOR", "Off", "Match the two levels by ear with MIX-B LEVEL and the phone's volume before judging anything."], ["Recording to the Tascam 246", "L/R MIX in. Keep ch 23-24 out of L/R.", "MONITOR", "Off", "The 246 gets MAIN MIX OUT at the main fader. To hear the tape back afterwards, assign ch 23-24 to L/R and listen on L/R MIX; MIX-B has nothing to do with the tape."], ["Playback in the garage", "Same selection as the room; STUDIO knob up", "MONITOR", "Off", "STUDIO OUT mirrors the control room selection. Talkback reaches it undimmed."]]}, {"type": "h", "text": "Rules that keep you out of trouble"}, {"type": "ul", "items": ["Only the MONITOR section and the two PHONES sections decide what people hear. Nothing in them changes what Reaper records, so experiment freely.", "Open mics plus loud room speakers equals bleed and feedback. While tracking, monitor on headphones and keep CNTRL RM low; the Peavey's own knobs are the last line of defense.", "Press one of L/R MIX or MIX-B at a time when you need to know which is which. With both in, a Reaper track and the live mix add together, which is right for overdubs but confusing for troubleshooting.", "If you hear nothing in the room: check in this order: CNTRL RM knob, a source button pressed, Peavey level knobs, Peavey power. If you hear nothing in Phones 2: its level, a source button, and whether the aux 3/4 masters are up.", "If the performer hears your solo-checking, Phones 2 is on MONITOR. Switch it to AUX SEND 3&amp;4.", "If talkback feeds back: you're holding it with CNTRL RM too loud for a 20 dB dip, or the garage PA is loud enough to reach the mic. Turn the room down first."]}]}, {"id": "power", "title": "Power: Start-Up and Shutdown", "desc": "Furman outlets, switch-on order, shutdown order", "group": "Setup", "blocks": [{"type": "lead", "text": "Where everything plugs in, the order to switch it on and off, and why. The Mackie manual's only power rule is that the 24&bull;8 is powered only by its own Mackie 8&bull;Bus power supply; the sequence below is standard studio practice, not a Mackie requirement."}, {"type": "h", "text": "Where the Furman plugs in"}, {"type": "ul", "items": ["<b>Straight into a grounded wall outlet.<\/b> Not into a power strip, surge protector or UPS. Stacking surge protectors is against most electrical codes and UL listings, can make the surge protection work worse rather than better, and puts the whole rack's load through the weakest strip's wiring and switch.", "Check the outlet first with a plug-in outlet tester (a few dollars at a hardware store): it should show correct wiring and a good ground. The Furman's surge protection and filtering both dump to ground; on an ungrounded or miswired outlet they do little, and that's also a common cause of hum.", "If the wall outlet is too far from the rack, use a <b>heavy-duty extension cord<\/b>, 12 or 14 gauge, three-prong, rated 15 A, as short as will reach. That's acceptable where a power strip isn't. Avoid thin household cords.", "Use an outlet on a different circuit from the window AC if you can (find out by flipping breakers and seeing what goes dark). The AC's compressor kicking on is the most likely source of clicks in this room.", "The Peavey 260 and the computer, which stay off the Furman, go to the wall too, on the same circuit as the Furman so everything shares one ground. Plugging those two into an ordinary surge strip is fine, since that strip isn't stacked on anything."]}, {"type": "h", "text": "What the Furman M-8x2 gives you"}, {"type": "ul", "items": ["Nine outlets: eight switched outlets on the rear panel and one convenience outlet on the front. Fifteen-amp rating with its own circuit breaker, surge and spike protection, and RFI/EMI noise filtering. A Protection OK light on the front tells you the surge protection is still alive; if it goes dark, the Furman has taken a hit and should be replaced.", "The front switch turns the eight rear outlets on and off together. Everything plugged into the back comes up at once, so the Furman is step one of the start-up and the last thing off.", "Load check: the whole rack draws well under 15 A. The Mackie power supply is the biggest item at around 2 A; the UMC1820, ADA8200, TSR-12 and a compressor are a fraction of an amp each. The Peavey 260 power amp is the one thing to keep off the Furman's switched outlets (see below)."]}, {"type": "h", "text": "Which outlet gets what"}, {"type": "table", "head": ["Rear outlet", "Plug in", "Why here"], "rows": [["1", "Mackie 24&bull;8 power supply", "Biggest draw, and the console must be up before anything that listens to it."], ["2", "Behringer UMC1820", "Computer interface. Fine on a switched outlet; the computer wakes it over USB."], ["3", "Behringer ADA8200", "Comes up with the UMC1820 so the ADAT clock locks right away."], ["4", "DigiTech TSR-12", "Outboard effects."], ["5", "Compressor (76-KT) when it arrives", "Outboard dynamics."], ["6", "Delay / second effects unit, when added", "Outboard effects."], ["7", "Spare", "Patchbays need no power. Keep this free."], ["8", "Spare", "Keep one free. Never daisy-chain a second power strip off the Furman."], ["Front", "Phone or laptop charger, soldering iron, a work light", "Convenience only. Nothing in the audio path."], ["Not on the Furman", "Peavey 260 power amp; the computer", "See the next section."]]}, {"type": "note", "text": "Label each plug at the Furman end with masking tape (\"MACKIE PSU\", \"UMC\", and so on) so a tripped breaker or a swap doesn't turn into a guessing game."}, {"type": "h", "text": "Two things that stay off the Furman's switched outlets"}, {"type": "ul", "items": ["<b>Peavey 260 power amp.<\/b> A power amp must come on last and go off first, so it can't be on the same switch as everything else: if it powered up with the rack, the turn-on thumps of the console and interface would go straight to the speakers. Plug it into a wall outlet on the same circuit (or a separate surge strip), and use its own power switch as the final step each way.", "<b>The computer.<\/b> It sits on a shelf in the rack but does not plug into the Furman: cutting its power with the Furman switch is the same as pulling the plug mid-session. Give it its own outlet and shut it down normally. If the Furman trips, the computer stays up and Reaper's autosave is intact.", "Everything else audio belongs on the Furman: the point of a conditioner is that one filtered, surge-protected feed covers the whole signal chain, which also helps against ground-loop hum."]}, {"type": "h", "text": "Start-up, in order"}, {"type": "table", "head": ["Step", "Switch on", "Before you do"], "rows": [["1", "All levels down: CNTRL RM, STUDIO, both PHONES, Peavey 260 input knobs. Main L/R fader down.", "Nothing can thump through speakers or headphones that have no level."], ["2", "Furman front switch. The eight rear outlets come up: Mackie power supply, UMC1820, ADA8200, TSR-12, compressor, delay unit.", "Check the Protection OK light. The console's power LED and the power supply fan should come on."], ["3", "Computer, then open Reaper.", "The UMC1820 should show up as the audio device; the ADA8200 SYNC light should read LOCKED."], ["4", "Wait about 20-30 seconds.", "Lets the console's circuits settle and any relays click before the amp is live."], ["5", "Peavey 260 power switch (its own switch, at the wall).", "Its level knobs are still down from step 1."], ["6", "Bring up CNTRL RM to a normal setting, then the Peavey's level knobs, then phones levels.", "Now the room and headphones are live. Raise the main L/R fader last, with music playing, so you hear it come in."]]}, {"type": "h", "text": "Shutdown, in reverse"}, {"type": "table", "head": ["Step", "Switch off", "Why"], "rows": [["1", "Save the Reaper project. Main L/R fader down, CNTRL RM, STUDIO and PHONES levels down, Peavey level knobs down.", "Protects the session and the speakers from whatever happens next."], ["2", "Peavey 260 power switch off.", "Amp off first, so no later click reaches the speakers."], ["3", "Close Reaper and shut the computer down from its menu.", "The interface will drop off the USB cleanly."], ["4", "Furman front switch off. The console, interface, ADA8200 and outboard all go down together.", "Fine for all of this gear; none of it has a disk or a session to lose."], ["5", "Leave the Furman plugged into the wall.", "Its surge protection only works while it's connected. Unplug it only for storms or when you're away for a long time."]]}, {"type": "h", "text": "Details that matter"}, {"type": "ul", "items": ["The 24&bull;8 has no power switch of its own; it's on when the power supply is on. The power supply's umbilical plugs into DC POWER IN on the console: connect it with everything off, and never plug or unplug it live.", "Mackie's one hard rule: power the console only from the Mackie 8&bull;Bus power supply. No substitutes.", "Phantom power: switch the 48V blocks on after start-up with the block's faders down, and off before shutdown. Never plug or unplug a mic on a powered block.", "The power supply runs warm and its fan needs air: keep the empty rack space between it and the Furman, and never block the front vents (the kitten's spot is fine; a blanket is not).", "If the Furman's breaker trips: everything on the rear outlets goes dark at once, but the Peavey and computer stay up. Turn the Peavey's levels down, press the breaker back in, and start again from step 2. If it trips twice, something is drawing too much or has a fault; stop and find it.", "Storms: the Furman absorbs surges, but nothing stops a direct lightning hit. Unplug the Furman and the Peavey from the wall when a bad storm is coming.", "If you ever add a power sequencer (Furman's M-8S model does this), it automates steps 2-5 with one button: conditioner, then outboard, then amps, a few seconds apart, and in reverse on shutdown. Not needed now."]}]}, {"id": "gain", "title": "Gain Staging Guide", "desc": "Setting levels on every channel and piece of gear", "group": "Sound", "blocks": [{"type": "lead", "text": "Channel-by-channel levels for the Mackie 24&bull;8 studio, October 2026. Goal: clean, strong signals with room to spare, peaking around -12 to -6 dBFS in Reaper."}, {"type": "h", "text": "1. Zero everything first"}, {"type": "ul", "items": ["Trims all the way down, aux sends down, EQ switched out, phones and control room levels down.", "Group masters 1-8 and the main L/R fader at U (unity).", "UMC1820 inputs 1-8: LINE, not INST; gain knobs at minimum; pads off (switch a pad in only if an input still clips). ADA8200: gain knobs at minimum. The console does the amplifying; these just pass it along.", "Reaper track faders at 0 dB."]}, {"type": "h", "text": "2. Set each channel (one at a time)"}, {"type": "ul", "items": ["Put the channel's fader at U and make sure it isn't muted. Solo on this console is taken after the fader, so the fader has to be at U for the reading to mean anything.", "Have the player perform the loudest part of the song, not a quiet warm-up.", "Press the channel's SOLO and watch the L/R meters. A hard-panned channel shows on one meter only.", "Raise the trim until peaks regularly reach 0 on the meters. An occasional +2 or +3 is fine; steady red is not.", "Release SOLO. Leave the fader at U; on group channels, the group master stays at U too.", "Check Reaper: peaks around -12 to -6 dBFS. Too hot or too quiet? Change the trim, not the fader."]}, {"type": "h", "text": "3. Channel chart"}, {"type": "p", "text": "Starting trims are where to begin, not final settings; your ears and meters decide. U = unity (0) on the fader."}, {"type": "table", "head": ["Ch", "Source", "Input", "48V", "Starting trim", "Fader", "Notes"], "rows": [["1", "Kick (kick mic)", "Mic", "If cond.", "Low", "U", "Very loud source. Group 1."], ["2", "Snare (snare mic)", "Mic", "If cond.", "Low", "U", "Check rimshots; they peak hardest. Group 2."], ["3", "Rack tom (SM58-style)", "Mic", "No", "Low-med", "U", "Hit hard to set level. Groups 3-4."], ["4", "Floor tom (SM58-style)", "Mic", "No", "Low-med", "U", "Groups 3-4."], ["5", "Room L", "Mic", "If cond.", "Med-high", "U", "Set L and R to the same trim. Groups 3-4."], ["6", "Room R", "Mic", "If cond.", "Med-high", "U", "Match ch 5. Groups 3-4."], ["7", "Bass amp DI out (or mic)", "Mic or line", "No", "Low-med", "U", "If the DI out is line level, use the line input. Group 5."], ["8", "Magnatone (SM57)", "Mic", "No", "Low-med", "U", "Depends on amp volume; set the amp first. Group 6."], ["9", "Marshall MG250DFX or Orange (SM58-style)", "Mic", "No", "Low-med", "U", "Shares group 6 with ch 8. Set each trim first, then balance the two on their faders and leave them."], ["10", "Lead vocal (Worker Bee)", "Mic", "Yes", "Med", "U", "Set with the loudest line of the song. Direct out &rarr; ADA8200 in 1."], ["11", "Wireless (ATW-R3210)", "Mic", "No", "Med", "U", "Set the receiver's output level first. Direct out &rarr; ADA8200 in 2."], ["12-13", "Reface CS L/R", "Line", "No", "Low", "U", "Synth volume about 3/4. Groups 7-8."], ["14", "Trumpet (SM58)", "Mic", "No", "Low", "U", "Very loud; player 1-2 ft back. Direct out &rarr; ADA8200 in 3."], ["15", "Vocal 2 (Peavey)", "Mic", "No", "Med-high", "U", "Direct out &rarr; ADA8200 in 4."], ["16", "Vocal 3 (Turner 95D)", "Mic", "No (see note)", "High", "U", "Low-output vintage mic; check impedance first. Direct out &rarr; ADA8200 in 5."], ["17-18", "Roland SH-201 L/R", "Line", "No", "Low", "U", "Through the pedalboard, check levels again. Direct outs &rarr; ADA8200 in 6-7."], ["19-20", "PV6 main out (e-drums, SamplePad 4, DJ)", "Line", "No", "Low", "To taste", "PV6 at unity. Monitor only."], ["21", "1970s Roland drum machine", "Line", "No", "Low-med", "U", "Vintage outputs can be quieter. Direct out &rarr; ADA8200 in 8."], ["22", "Open", "&mdash;", "&mdash;", "&mdash;", "&mdash;", ""], ["23-24", "Tascam 246 line out L/R", "Line", "No", "Med", "To taste", "Consumer-level outputs; trim up a little more than other line sources."]]}, {"type": "note", "text": "<b>48V (phantom power)<\/b> is switched in blocks of eight channels: 1-8, 9-16 and 17-24, with the switch at the top of each block. \"If cond.\" means only if that mic is a condenser. The Worker Bee on ch 10 needs it, so the mic inputs on 9-16 all get 48V. That's safe for balanced dynamic mics (SM58, Peavey). Check the wireless receiver's manual before leaving it on a powered block. Keep the Turner 95D off a powered block until it's on a matching transformer or proper low-impedance XLR wiring. Turn the block's faders down before switching phantom, and don't plug or unplug mics with it on."}, {"type": "h", "text": "4. What ends up in the recording"}, {"type": "ul", "items": ["Group channels: trim, EQ, fader, pan and the group master all shape what Reaper gets.", "Direct-out channels: trim, EQ, fader and mute. Pan and the L/R button don't matter to the recording.", "So set EQ and faders before the take and leave them. Use the phones level, MIX-B and aux sends to change what people hear."]}, {"type": "h", "text": "5. Outboard and other gear"}, {"type": "ul", "items": ["<b>Compressor (76-KT or dbx):<\/b> see the Setting Compression Levels page. Short version: trim first with the compressor bypassed, then Input (or Threshold) for 3-6 dB of gain reduction, then Output until bypass and un-bypass sound equally loud.", "<b>TSR-12:<\/b> aux 1 master at about noon; TSR-12 input so its meter peaks just under overload; mix 100% wet; AUX RETURN 1 to taste.", "<b>PV6 submixer:<\/b> its channel gains and master at unity; set each source's own volume moderately high; balance the sources on the PV6.", "<b>Tascam 246:<\/b> input trims low to start, then tape meters around 0 VU; a little past for saturation.", "<b>Reaper playback:<\/b> MIX-B level and tape-return levels set so playback sits naturally under the live mix. UMC1820 MAIN OUT knob all the way up, since it sets the level of playback tracks 1-2.", "<b>Headphones:<\/b> phones level low before anyone puts headphones on; build mixes with aux sends 3-6.", "<b>Garage PA:<\/b> STUDIO level low, PA inputs at unity, then raise STUDIO level.", "<b>Peavey 260 + DIY monitors:<\/b> CONTROL ROOM level and Peavey level knobs low; play a mix, raise CONTROL ROOM to a normal setting, then raise the Peavey until it's loud enough. VU meters should stay below the red."]}, {"type": "h", "text": "6. Final checks"}, {"type": "ul", "items": ["Re-check with the whole band playing: everyone plays louder together.", "Hiss on a quiet singer: move the mic closer before adding gain. If the trim is near max and hiss remains, consider an inline booster (Cloudlifter-style) for that mic.", "Distortion with meters fine: check the source itself (amp, synth, DJ mixer, PV6) for clipping.", "Clicks and pops only on Reaper inputs 9-16: check the ADA8200's clock setting (see the Setup Map).", "Write down final trim positions (masking tape on the console) so sess
